<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YouBuddy · 비즈니스 영어 챌린지 5기 학습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
<style>
:root {
  --ivory: #FBF7F0;
  --cream: #FFFDF7;
  --paper: #F5EEE0;
  --ink: #2A1F14;
  --ink-soft: #5A4A36;
  --muted: #9A8B73;
  --line: #E7DDC8;
  --line-soft: #EFE7D4;
  --orange: #E8743C;
  --orange-dark: #C95721;
  --orange-soft: #FAE3D1;
  --orange-ghost: #FDF0E2;
  --green: #6B8E4E;
  --green-soft: #DFEAD0;
  --lilac: #A98BB8;
  --lilac-soft: #EEE6F3;
  --gold: #C89B3C;
  --radius-s: 8px;
  --radius-m: 14px;
  --radius-l: 22px;
  --radius-xl: 32px;
  --font-sans: 'Pretendard Variable', Pretendard, 'Noto Sans KR', system-ui, -apple-system, sans-serif;
  --font-kor: 'Pretendard Variable', Pretendard, 'Noto Sans KR', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  --font-serif: 'Pretendard Variable', Pretendard, 'Noto Sans KR', system-ui, -apple-system, sans-serif;
  --shadow-s: 0 1px 0 rgba(42,31,20,0.04), 0 2px 6px -3px rgba(42,31,20,0.08);
  --shadow-m: 0 2px 0 rgba(42,31,20,0.03), 0 10px 24px -12px rgba(42,31,20,0.15);
  --shadow-l: 0 30px 60px -28px rgba(42,31,20,0.24);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--ivory);
  color: var(--ink);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  overflow-x: hidden;
}
button { font-family: inherit; cursor: pointer; }
input, textarea, select { font-family: inherit; }

.app {
  min-height: 100vh;
  max-width: 480px;
  margin: 0 auto;
  background: var(--ivory);
  position: relative;
  box-shadow: 0 0 0 1px var(--line-soft), 0 40px 80px -30px rgba(42,31,20,0.18);
  padding-bottom: 110px;
}
@media (min-width: 900px) {
  body { padding: 24px 0 48px; }
  .app { border-radius: 36px; min-height: calc(100vh - 72px); }
}
.page { padding: 20px 20px 24px; animation: pageIn 280ms cubic-bezier(.2,.9,.3,1.1); }
@keyframes pageIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* typography */
.kicker { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.serif { font-family: var(--font-serif); font-style: normal; font-weight: 700; letter-spacing: -0.01em; }
.h1 { font-size: 24px; font-weight: 700; line-height: 1.25; letter-spacing: -0.02em; margin: 0; word-break: keep-all; }
.h2 { font-size: 19px; font-weight: 700; line-height: 1.25; letter-spacing: -0.015em; margin: 0; word-break: keep-all; }
.h3 { font-size: 15px; font-weight: 700; margin: 0; word-break: keep-all; }
.t-body { font-size: 14px; line-height: 1.55; color: var(--ink-soft); margin: 0; word-break: keep-all; }
.t-small { font-size: 12px; color: var(--muted); word-break: keep-all; }
.mono { font-family: var(--font-mono); }

/* topbar */
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 4px 16px; }
.brand { display: flex; align-items: center; gap: 10px; }
.logo-mark {
  width: 32px; height: 32px; border-radius: 10px;
  background: var(--ink); color: var(--ivory);
  display: grid; place-items: center;
  font-weight: 800; font-family: var(--font-serif); font-style: normal;
}
.brand-name { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
.brand-name small { font-family: var(--font-mono); font-size: 10px; color: var(--muted); margin-left: 6px; font-weight: 500; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 12px;
  background: var(--cream); border: 1px solid var(--line);
  display: grid; place-items: center; color: var(--ink);
  transition: all 120ms;
}
.icon-btn:hover { background: var(--paper); border-color: var(--ink-soft); }

/* cards */
.card {
  background: var(--cream);
  border: 1px solid var(--line);
  border-radius: var(--radius-l);
  padding: 18px;
}
.card-flat { background: var(--paper); border: none; }
.card-ink { background: var(--ink); color: var(--cream); border-color: var(--ink); }
.card-ink .t-body, .card-ink .t-small { color: rgba(251,247,240,0.7); }
.card-lilac { background: linear-gradient(155deg, #C2A9D1 0%, #A98BB8 100%); color: #fff; border: none; }
.card-lilac .t-body, .card-lilac .t-small { color: rgba(255,255,255,0.82); }
.card-orange { background: linear-gradient(155deg, #F08B56, #E8743C 55%, #D45F23); color: #fff; border: none; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 18px; border-radius: 999px;
  font-weight: 600; font-size: 14px; letter-spacing: -0.005em;
  border: none; transition: transform 120ms, background 150ms, color 150ms;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--orange); color: #fff; }
.btn-primary:hover { background: var(--orange-dark); }
.btn-primary:disabled { background: var(--paper); color: var(--muted); cursor: not-allowed; }
.btn-ink { background: var(--ink); color: var(--cream); }
.btn-ghost { background: var(--cream); color: var(--ink); border: 1px solid var(--line); }
.btn-ghost:hover { background: var(--paper); }
.btn-lilac { background: var(--lilac); color: #fff; }
.btn-lilac:hover { background: #8f6ea3; }
.btn-lg { padding: 15px 22px; font-size: 15px; }
.btn-sm { padding: 8px 14px; font-size: 12.5px; }
.btn-full { width: 100%; }

/* badges */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 999px;
  font-family: var(--font-mono); font-size: 10px; font-weight: 500;
  letter-spacing: 0.04em; text-transform: uppercase;
  background: var(--paper); color: var(--ink-soft);
}
.badge-orange { background: var(--orange-ghost); color: var(--orange-dark); }
.badge-green { background: var(--green-soft); color: var(--green); }
.badge-lilac { background: var(--lilac-soft); color: #7b5ea7; }
.badge-ink { background: var(--ink); color: var(--cream); }

/* bars */
.bar { height: 6px; background: var(--line-soft); border-radius: 999px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--ink); border-radius: 999px; transition: width 600ms cubic-bezier(.2,.9,.3,1); }
.bar.orange > span { background: var(--orange); }
.bar.lilac > span { background: var(--lilac); }

/* tabbar */
.tabbar {
  position: fixed; bottom: 14px; left: 0; right: 0;
  display: flex; justify-content: center;
  z-index: 40; pointer-events: none;
}
.tabbar-inner {
  display: flex; gap: 2px;
  background: var(--ink); color: var(--cream);
  padding: 6px; border-radius: 999px;
  box-shadow: var(--shadow-l);
  pointer-events: auto;
}
.tab {
  padding: 10px 14px; border-radius: 999px;
  background: transparent; color: rgba(251,247,240,0.6); border: none;
  font-weight: 600; font-size: 12px;
  display: flex; align-items: center; gap: 6px;
  transition: all 180ms;
  position: relative;
}
.tab.active { background: var(--cream); color: var(--ink); }
.tab:hover { color: var(--cream); }
.tab.active:hover { color: var(--ink); }
.tab.locked { opacity: 0.55; }
.tab .lock-dot {
  position: absolute; top: 2px; right: 4px;
  width: 6px; height: 6px; border-radius: 50%; background: var(--lilac);
}

/* progress dots */
.progress-dots { display: grid; grid-template-columns: repeat(20, 1fr); gap: 2px; }
.progress-dots span { aspect-ratio: 1; border-radius: 2px; background: var(--line-soft); }
.progress-dots span.on { background: var(--ink); }
.progress-dots span.today { background: var(--orange); box-shadow: 0 0 0 2px var(--orange-ghost); }
.card-ink .progress-dots span { background: rgba(251,247,240,0.12); }
.card-ink .progress-dots span.on { background: var(--cream); }
.card-ink .progress-dots span.today { background: var(--orange); }

/* leaderboard */
.rank-row {
  display: grid; grid-template-columns: 28px 36px 1fr auto;
  gap: 12px; align-items: center;
  padding: 10px 12px; border-radius: var(--radius-m);
  transition: background 180ms;
}
.rank-row.me { background: var(--orange-ghost); box-shadow: inset 0 0 0 1px var(--orange-soft); }
.rank-num { font-family: var(--font-serif); font-style: normal; font-size: 17px; color: var(--ink-soft); text-align: right; }
.rank-num.top1 { color: var(--orange); font-weight: 600; }
.avatar {
  width: 36px; height: 36px; border-radius: 12px;
  background: var(--paper); color: var(--ink);
  display: grid; place-items: center; font-weight: 700; font-size: 12px;
  flex-shrink: 0;
}
.avatar.orange { background: var(--orange); color: #fff; }
.avatar.ink { background: var(--ink); color: var(--cream); }
.avatar.cream { background: var(--cream); color: var(--ink); border: 1px solid var(--line); }
.streak-pill { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--ink-soft); }

/* weeks */
.week-card {
  background: var(--cream); border: 1px solid var(--line);
  border-radius: var(--radius-l); padding: 16px;
  transition: all 180ms; cursor: pointer;
}
.week-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-m); }
.week-card.current { background: var(--ink); color: var(--cream); border-color: var(--ink); }
.week-card.current .t-small, .week-card.current .t-body { color: rgba(251,247,240,0.65); }
.week-card.current .bar { background: rgba(251,247,240,0.15); }
.week-card.current .bar > span { background: var(--orange); }
.day-chip-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.day-chip {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--paper); color: var(--ink);
  display: grid; place-items: center;
  font-family: var(--font-mono); font-size: 11px; font-weight: 600;
  border: 1px solid transparent; transition: all 140ms;
  cursor: pointer; position: relative;
}
.day-chip:hover:not(.locked) { transform: scale(1.06); }
.day-chip.done { background: var(--ink); color: var(--cream); }
.day-chip.today { background: var(--orange); color: #fff; box-shadow: 0 0 0 3px var(--orange-ghost); }
.day-chip.locked { background: transparent; color: var(--muted); border-color: var(--line); cursor: not-allowed; }
.week-card.current .day-chip { background: rgba(251,247,240,0.08); color: var(--cream); }
.week-card.current .day-chip.done { background: var(--cream); color: var(--ink); }
.week-card.current .day-chip.today { background: var(--orange); color: #fff; }
.week-card.current .day-chip.locked { background: transparent; color: rgba(251,247,240,0.3); border-color: rgba(251,247,240,0.12); }

/* day note */
.step-head { display: flex; align-items: center; gap: 10px; }
.step-num {
  width: 26px; height: 26px; border-radius: 9px;
  background: var(--ink); color: var(--cream);
  display: grid; place-items: center;
  font-family: var(--font-serif); font-style: normal; font-size: 13px; font-weight: 600;
}
.vocab-card {
  background: var(--cream); border: 1px solid var(--line);
  border-radius: var(--radius-l); padding: 18px; position: relative;
}
.vocab-num { position: absolute; top: 14px; right: 16px; font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
.eng-word {
  font-family: var(--font-sans); font-style: normal;
  font-size: 26px; color: var(--orange); line-height: 1.12; letter-spacing: -0.015em;
  font-weight: 800;
  margin: 0 0 6px;
}
.kor-def { font-size: 13px; color: var(--ink-soft); margin: 0; }
.vocab-example {
  background: var(--paper); border-radius: var(--radius-m);
  padding: 12px 14px; margin-top: 12px;
  font-size: 13.5px; line-height: 1.55; color: var(--ink);
}
.vocab-example b { color: var(--orange-dark); font-weight: 600; }
.vocab-example .translate { display: block; margin-top: 6px; color: var(--ink-soft); font-size: 12.5px; }
.syn-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.syn-chip { font-family: var(--font-mono); font-size: 11px; padding: 3px 9px; border-radius: 999px; background: var(--orange-ghost); color: var(--orange-dark); }

.target-banner {
  background: var(--paper); border-radius: var(--radius-l);
  padding: 18px; position: relative; overflow: hidden;
}
.target-banner::before {
  content: ""; position: absolute; right: -30px; top: -30px;
  width: 120px; height: 120px; border-radius: 50%;
  background: radial-gradient(circle, rgba(232,116,60,0.15), transparent 70%);
}
.quote-mark { font-family: var(--font-serif); font-style: normal; font-size: 44px; color: var(--orange); line-height: 0.5; height: 18px; }

.sentence-input {
  width: 100%; background: var(--cream);
  border: 1px solid var(--line); border-radius: var(--radius-m);
  padding: 12px 14px; font-size: 14px; line-height: 1.5;
  resize: vertical; min-height: 60px; color: var(--ink);
  transition: border-color 160ms, background 160ms;
}
.sentence-input:focus { outline: none; border-color: var(--orange); background: #fff; box-shadow: 0 0 0 3px var(--orange-ghost); }
.sentence-input::placeholder { color: var(--muted); }
.ai-feedback {
  margin-top: 14px;
  background: linear-gradient(135deg, #FFF3E3 0%, #FDE2C6 100%);
  border: 1px solid var(--orange-soft);
  border-radius: var(--radius-m);
  padding: 14px;
  font-size: 13px;
  line-height: 1.55;
  color: var(--ink);
}
.ai-head {
  display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--orange-dark); font-weight: 600;
}
.ai-corrected {
  font-family: var(--font-serif); font-style: normal; font-size: 18px;
  color: var(--ink); margin: 4px 0 8px; line-height: 1.35;
}
.ai-feedback ins { background: var(--green-soft); color: var(--green); text-decoration: none; padding: 1px 3px; border-radius: 3px; }
.ai-feedback del { background: #F5D8CE; color: var(--orange-dark); text-decoration: line-through; padding: 1px 3px; border-radius: 3px; }

/* verify */
.verify-step {
  background: var(--cream); border: 1px solid var(--line);
  border-radius: var(--radius-l); padding: 14px;
  display: flex; align-items: center; gap: 12px;
  transition: all 200ms;
}
.verify-step.done { background: var(--green-soft); border-color: var(--green-soft); }
.vs-icon {
  width: 40px; height: 40px; border-radius: 12px;
  background: var(--paper); display: grid; place-items: center; flex-shrink: 0;
  font-size: 18px;
}
.verify-step.done .vs-icon { background: var(--green); color: #fff; }

.check-toggle {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--cream); border: 1.5px solid var(--line);
  display: grid; place-items: center; cursor: pointer;
  flex-shrink: 0; transition: all 140ms;
}
.check-toggle.on { background: var(--green); border-color: var(--green); color: #fff; }

/* premium */
.premium-banner {
  background: linear-gradient(155deg, #C2A9D1, #A98BB8 55%, #8F6EA3);
  color: #fff; border-radius: var(--radius-l);
  padding: 20px; position: relative; overflow: hidden;
}
.premium-banner::before {
  content: ""; position: absolute; right: -40px; top: -40px;
  width: 160px; height: 160px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.22), transparent 65%);
}
.locked-panel {
  background: var(--cream); border: 1.5px dashed var(--lilac);
  border-radius: var(--radius-l); padding: 24px 20px;
  text-align: center;
}
.locked-panel .lock-icon {
  width: 60px; height: 60px; border-radius: 18px;
  background: var(--lilac-soft); color: var(--lilac);
  display: grid; place-items: center; margin: 0 auto 14px;
  font-size: 28px;
}

.meeting-card {
  background: var(--cream); border: 1px solid var(--line);
  border-radius: var(--radius-l); padding: 16px;
  display: flex; gap: 14px; align-items: flex-start;
}
.meeting-card.upcoming { border-color: var(--lilac); background: linear-gradient(145deg, #fff 55%, var(--lilac-soft)); }
.meeting-card.done { opacity: 0.65; }
.meeting-date {
  width: 52px; flex-shrink: 0; text-align: center;
  background: var(--paper); border-radius: var(--radius-m);
  padding: 8px 4px;
}
.meeting-date .md-mon { font-family: var(--font-mono); font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.meeting-date .md-day { font-family: var(--font-serif); font-style: normal; font-size: 22px; color: var(--ink); }
.meeting-card.upcoming .meeting-date { background: #fff; }
.meeting-card.upcoming .meeting-date .md-day { color: var(--lilac); }

/* quiz */
.quiz-card {
  background: var(--cream); border: 1px solid var(--line);
  border-radius: var(--radius-l); padding: 18px;
}
.quiz-question {
  font-family: var(--font-serif); font-style: normal;
  font-size: 22px; color: var(--ink); line-height: 1.3; margin: 0 0 14px;
}
.quiz-option {
  display: block; width: 100%; text-align: left;
  padding: 12px 14px; border-radius: var(--radius-m);
  background: var(--paper); border: 1.5px solid transparent;
  font-size: 14px; color: var(--ink); margin-top: 8px;
  transition: all 140ms; font-family: inherit;
}
.quiz-option:hover { background: var(--orange-ghost); }
.quiz-option.selected { background: var(--orange-ghost); border-color: var(--orange); }
.quiz-option.correct { background: var(--green-soft); border-color: var(--green); }
.quiz-option.wrong { background: #F5D8CE; border-color: var(--orange-dark); }

/* cert */
.cert-wrap {
  background: linear-gradient(165deg, #FFFDF7 0%, #FAE3D1 100%);
  border: 2px solid var(--orange-soft);
  border-radius: var(--radius-xl); padding: 28px 22px;
  text-align: center; position: relative; overflow: hidden;
}
.cert-seal {
  width: 72px; height: 72px; border-radius: 50%;
  background: var(--orange); color: #fff;
  display: grid; place-items: center;
  font-family: var(--font-serif); font-style: normal;
  font-size: 28px; margin: 0 auto 16px;
  box-shadow: 0 8px 20px -6px rgba(232,116,60,0.4);
}
.cert-title { font-family: var(--font-serif); font-style: normal; font-size: 28px; color: var(--ink); margin: 0 0 6px; }
.cert-name { font-size: 20px; font-weight: 700; color: var(--orange-dark); margin: 8px 0; }
.cert-progress-text { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-top: 12px; }

/* checkboard */
.checkboard-wrap {
  background: var(--cream); border: 1px solid var(--line);
  border-radius: var(--radius-l); padding: 14px 10px 14px 14px;
}
.checkboard { display: grid; grid-template-columns: 86px repeat(20, 1fr); gap: 2px; align-items: center; font-family: var(--font-mono); font-size: 9px; }
.cb-header { color: var(--muted); font-weight: 500; text-align: center; padding: 4px 0; letter-spacing: 0.04em; }
.cb-header.today-col { color: var(--orange); font-weight: 700; }
.cb-name { display: flex; align-items: center; gap: 6px; font-family: var(--font-sans); font-size: 10.5px; font-weight: 500; color: var(--ink); padding-right: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.cb-name .tiny-av { width: 18px; height: 18px; border-radius: 5px; background: var(--paper); display: grid; place-items: center; font-size: 8px; font-weight: 700; flex-shrink: 0; }
.cb-name .tiny-av.orange { background: var(--orange); color: #fff; }
.cb-name .tiny-av.ink { background: var(--ink); color: var(--cream); }
.cb-cell { aspect-ratio: 1; border-radius: 3px; background: var(--line-soft); }
.cb-cell.on { background: var(--ink); }
.cb-cell.today { background: var(--orange); box-shadow: 0 0 0 1.5px var(--orange-ghost); }
.cb-row-me { background: var(--orange-ghost); border-radius: 6px; padding: 0 2px; margin: 0 -2px; }

/* modal */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(42,31,20,0.48);
  display: grid; place-items: center; z-index: 100; padding: 20px;
  animation: fadeIn 200ms;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--ivory); border-radius: var(--radius-xl);
  max-width: 420px; width: 100%; padding: 24px;
  box-shadow: var(--shadow-l);
  animation: popIn 260ms cubic-bezier(.2,.9,.3,1.1);
}
@keyframes popIn { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
.input {
  width: 100%; background: var(--cream);
  border: 1px solid var(--line); border-radius: var(--radius-m);
  padding: 12px 14px; font-size: 14px; color: var(--ink);

@keyframes spin { to { transform: rotate(360deg); } }

.peer-ticker {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);

}
.peer-ticker.out { animation: peerSlideOut 300ms ease forwards; }

  width: 32px; height: 32px; border-radius: 10px;

.peer-ticker .pt-pulse {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--orange); flex-shrink: 0; margin-right: 2px;
  animation: pulseDot 1.4s ease-in-out infinite;
}
@keyframes peerSlideIn {
  from { transform: translateX(-50%) translateY(-24px); opacity: 0; }
  to { transform: translateX(-50%) translateY(0); opacity: 1; }
}
@keyframes peerSlideOut {
  from { transform: translateX(-50%) translateY(0); opacity: 1; }
  to { transform: translateX(-50%) translateY(-24px); opacity: 0; }
}
@keyframes pulseDot {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.35); opacity: 0.5; }
}

/* utils */
.stack > * + * { margin-top: 12px; }
.stack-sm > * + * { margin-top: 8px; }
.stack-lg > * + * { margin-top: 20px; }
.row { display: flex; align-items: center; }
.row-between { display: flex; align-items: center; justify-content: space-between; }
.row-gap-sm { gap: 8px; }
.row-gap { gap: 12px; }
.flex-1 { flex: 1; }
.divider { height: 1px; background: var(--line-soft); margin: 14px 0; }
.hidden { display: none !important; }

/* icon helper */
.i { width: 1em; height: 1em; stroke-width: 2; }

/* confetti */
.celebration { position: fixed; inset: 0; pointer-events: none; z-index: 90; overflow: hidden; }
.celebration span { position: absolute; top: -20px; font-size: 18px; animation: fall 2.8s cubic-bezier(.2,.9,.3,1.1) forwards; }
@keyframes fall { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 100% { transform: translate(var(--x, 0), 110vh) rotate(var(--r, 360deg)); opacity: 0.3; } }

/* Bind the logged-in user to the correct MEMBERS identity.
   - If state.name matches a roster entry by name → that roster entry becomes "me" (me: true),
     and the placeholder me slot is marked hidden so we don't duplicate rows.
   - Otherwise (operator like 유버디, or generic YB5 user) → keep the placeholder as the me slot,
     renamed to state.name; operators are hidden from the streak/ranking board.
   Call this after state hydration and after __finishOnboarding. */
function bindMeToMembers() {
  const placeholder = MEMBERS.find((m) => m.id === 'me');
  if (!placeholder) return;
  // reset transient flags
  MEMBERS.forEach((m) => { if (m.id !== 'me') m.me = false; });
  placeholder.hidden = false;
  placeholder.isOperator = false;

  const nm = (state.name || '').trim();
  if (!nm) {
    placeholder.name = '나';
    placeholder.me = true;
    return;
  }

  const real = MEMBERS.find((m) => m.id !== 'me' && m.name === nm);
  if (real) {
    // Existing roster member logged in → promote that row to "me", hide placeholder
    real.me = true;
    placeholder.me = false;
    placeholder.hidden = true;
    placeholder.name = nm;
    return;
  }

  // Not in roster (e.g., 유버디 운영팀, or a generic code user)
  placeholder.name = nm;
  placeholder.me = true;
  if (state.isOperator) {
    placeholder.isOperator = true;
    // Operators don't show on the public streak board.
    placeholder.hidden = true;
  }
}

/* Visible roster — filters out hidden rows (placeholder when already bound to a real member,
   or operators like 유버디). Use this for rankings / streak board / counts shown to users. */
function visibleMembers() {
  return MEMBERS.filter((m) => !m.hidden);
}
function meMember() {
  return MEMBERS.find((m) => m.me) || MEMBERS[0];
}

/* Demo seed — pre-fills a few days (1, 3, 5 late, 7) so the design can be previewed
   with visible progress. Only applied if nothing persisted yet (first visit). */
function seedDemoState(s) {
  const mark = (d, lateOffset = 0) => {
    s.verified = s.verified || {};
    s.verified_at = s.verified_at || {};
    s.submitted = s.submitted || {};
    s.sentences = s.sentences || {};
    s.verified['d' + d] = true;
    // Compute scheduled date
    const scheduled = dayDate(d);
    const mark = new Date(scheduled);
    mark.setDate(mark.getDate() + lateOffset);
    const y = mark.getFullYear();
    const m = String(mark.getMonth() + 1).padStart(2, '0');
    const day = String(mark.getDate()).padStart(2, '0');
    s.verified_at['d' + d] = `${y}-${m}-${day}`;
    // Submit 3 sentences + sample sentences per word
    const d_ = typeof getDay === 'function' ? getDay(d) : null;
    if (d_ && d_.words) {
      d_.words.forEach((w, i) => {
        const key = `d${d}-${i}`;
        s.submitted[key] = true;
        if (!s.sentences[key]) s.sentences[key] = `Let's ${w.en} the timeline before we kick off.`;
      });
    }
  };
  mark(1, 0);         // 정시
  mark(3, 0);         // 정시
  mark(5, 2);         // 지각 (자정 넘어서)
  mark(7, 0);         // 정시
  s.currentDay = Math.max(s.currentDay || 1, 8);
  return s;
}

async function persistStateNow() {
  const snapshot = persistedStateSnapshot();
  const snapshotJson = JSON.stringify(snapshot);
  if (snapshotJson === stateLastSavedJson && !statePersistQueued) return true;
  cacheState(snapshot);
  if (!hasSupabase()) {
    stateLastSavedJson = snapshotJson;
    return true;
  }
  if (statePersistInFlight) {
    statePersistQueued = true;
    return false;
  }
  statePersistInFlight = true;
  statePersistQueued = false;
  try {
    await supabaseRpc('upsert_member_app_state', {
      p_cohort: CHALLENGE.cohort,
      p_member_key: memberKey(),
      p_member_name: state.name || '',
      p_tier: state.tier || 'basic',
      p_app_state: snapshot,
    });
    stateLastSavedJson = snapshotJson;
    return true;
  } catch (e) {
    return false;
  } finally {
    statePersistInFlight = false;
    if (statePersistQueued) {
      statePersistQueued = false;
      persistStateNow();
    }
  }
}

}

function escapeHtml(str='') {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function buildLocalCorrection(word, sentence) {
  const trimmed = (sentence || '').trim();
  if (!trimmed) {
    return {
      corrected: `Let's ${word.en} the details before we move forward.`,
      diff_html: `<ins>Let's ${escapeHtml(word.en)} the details before we move forward.</ins>`,
      why: '문장이 비어 있어서 업무에서 바로 쓸 수 있는 기본형 예문으로 먼저 잡아드렸어요.',
    };
  }

  const lower = trimmed.toLowerCase();
  let corrected = trimmed;
  if (!lower.includes(word.en.toLowerCase())) {
    corrected = `Let's ${word.en} on the next step before we wrap up.`;
  } else if (!/[.!?]$/.test(corrected)) {
    corrected += '.';
  }

  return {
    corrected,
    diff_html: escapeHtml(trimmed) === escapeHtml(corrected)
      ? escapeHtml(corrected)
      : `<del>${escapeHtml(trimmed)}</del> <ins>${escapeHtml(corrected)}</ins>`,
    why: '표현이 문장 안에서 자연스럽게 들리도록 조금 더 업무 영어답게 다듬었어요.',
  };
}

async function requestSentenceCorrection(word, sentence) {
  const prompt = `You are a warm, encouraging business English coach for Korean learners.
The student is practicing the phrase "${word.en}" (${word.def}).
Their attempt: "${sentence}"

Return ONLY valid JSON with this exact shape:
{
  "corrected": "a natural business-English sentence using '${word.en}'",
  "diff_html": "the corrected sentence as HTML with <del>removed</del> and <ins>added</ins> tags to show changes",
  "why": "1-2 sentences in Korean explaining what you changed and why."
}`;

  if (window.claude && typeof window.claude.complete === 'function') {
    const raw = await window.claude.complete(prompt);
    const clean = raw.replace(/^```json\s*/i, '').replace(/```\s*$/,'').trim();
    return JSON.parse(clean);
  }

  return buildLocalCorrection(word, sentence);
}

  if (!member) return null;
  if (member.me) {
    const savedWords = [];
    CHALLENGE.weeks.forEach((week) => {
      week.days.forEach((day) => {
        day.words.forEach((word, idx) => {
          const key = `d${day.day}-${idx}`;
          if (state.bookmarks[key]) {
            savedWords.push({ rank: day.day * 10 + idx, label: word.en });
          }

    });
    const savedPosts = COMMUNITY_POSTS
      .filter((post, idx) => state.community_bookmarks?.[post.id])
      .map((post, idx) => ({ rank: 1000 - idx, label: titleCasePhrase(post.word) }));
    const allSaved = [...savedWords, ...savedPosts].sort((a, b) => b.rank - a.rank);
    return allSaved[0]?.label || null;
  }

  const latestCommunityWord = COMMUNITY_POSTS.find((post) => post.user === member.name)?.word;

  return null;

function todayStr() {

/* Compute the calendar date for a given day number based on CHALLENGE.start_date.
   Skips weekends so that Day 1 = start_date, Day 2 = next weekday, etc. */
function dayDate(dayN) {
  const [y, m, d] = CHALLENGE.start_date.split('-').map(Number);
  const start = new Date(y, m - 1, d);
  let cursor = new Date(start);
  let left = dayN - 1;
  while (left > 0) {
    cursor.setDate(cursor.getDate() + 1);
    const dow = cursor.getDay();
    if (dow !== 0 && dow !== 6) left -= 1;
  }
  return cursor;
}

function computeCurrentDay() {
  const today = todayStr();

    const d = dayDate(n);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    const s = `${y}-${m}-${dd}`;
    if (today <= s) return n;
  }
  return 20;
}

async function supabaseRpc(fn, payload={}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(payload),
  });
  if (!res.ok) throw new Error(`supabase rpc failed: ${fn}`);
  return res.json();
}

function formatComparisonLabel(data) {
  if (!data) return '어제 이 시간 데이터 없음';

  return `어제 이 시간보다 ${diff > 0 ? '↑' : '↓'} ${Math.abs(diff)}%`;
}

/* ============================================================
   PEER TICKER — floating "방금 문장이 추가됐어요" notification
   Lightweight: single setInterval, pauses when tab hidden, stops on nav away
   ============================================================ */
window.__peerTickerTimer = window.__peerTickerTimer || null;
window.__peerTickerSeen = window.__peerTickerSeen || new Set();

function stopPeerTicker() {
  if (window.__peerTickerTimer) {
    clearInterval(window.__peerTickerTimer);
    window.__peerTickerTimer = null;
  }
  const existing = document.querySelector('.peer-ticker');
  if (existing) existing.remove();
}

function startPeerTicker(dayN) {
  stopPeerTicker();
  // Fire first one after 20s, then every 45s
  let first = true;
  const tick = () => {
    if (document.hidden) return;
    if (currentPage !== 'day') { stopPeerTicker(); return; }
    const peers = peerSentencesFor(dayN);
    if (!peers || !peers.length) return;
    // Pick an unseen-in-session peer (or cycle)
    const unseen = peers.filter(p => !window.__peerTickerSeen.has('d' + dayN + ':' + p.user + ':' + p.sentence));
    const pick = (unseen.length ? unseen : peers)[Math.floor(Math.random() * (unseen.length ? unseen.length : peers.length))];
    if (!pick) return;
    window.__peerTickerSeen.add('d' + dayN + ':' + pick.user + ':' + pick.sentence);
    showPeerTicker(pick);
  };
  window.__peerTickerTimer = setInterval(tick, 45000);
  setTimeout(() => { if (first) { first = false; tick(); } }, 20000);
}

function showPeerTicker(peer) {
  // Remove any existing ticker first
  const existing = document.querySelector('.peer-ticker');
  if (existing) existing.remove();

  const node = el('div', { class: 'peer-ticker' });
  const preview = (peer.sentence || '').length > 48
    ? (peer.sentence || '').slice(0, 46) + '…'
    : (peer.sentence || '');
  node.innerHTML = `
    <span class="pt-pulse"></span>
    <div class="pt-avatar">${(peer.avatar || peer.user || '').slice(0,2)}</div>
    <div class="pt-text">
      <div class="pt-label">방금 ${peer.user}님이 문장을 올렸어요</div>
      <div class="pt-body">${preview.replace(/</g, '&lt;')}</div>
    </div>`;
  node.addEventListener('click', () => {
    // Scroll to peer sentences section if present
    const sec = document.querySelector('[data-peer-section]');
    if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    node.classList.add('out');
    setTimeout(() => node.remove(), 280);
  });
  document.body.appendChild(node);
  setTimeout(() => {
    if (!node.isConnected) return;
    node.classList.add('out');
    setTimeout(() => node.remove(), 280);
  }, 4200);
}

// Clean up timer when tab is hidden
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    const existing = document.querySelector('.peer-ticker');
    if (existing) existing.remove();
  }
});

      onClick: () => { __onboardStep -= 1; render(); },
    }, '← 이전');
    navRow.appendChild(back);
  }
  const nextLabel = __onboardStep < 2 ? '다음 →' : '시작하기 ✨';
  const next = el('button', {
    class: 'btn btn-primary',
    style: { flex: '1', padding: '14px 18px', fontWeight: '700' },
    onClick: () => __onboardAdvance(),
  }, nextLabel);
  navRow.appendChild(next);
  page.appendChild(navRow);

  // Hints / footer
  const footer = el('p', {
    style: { marginTop: '18px', textAlign: 'center', fontSize: '11px', color: 'var(--muted)', lineHeight: '1.6' }
  });
  footer.innerHTML = `5기 · 2026/4/20 ~ 5/15 · 매일 영업일 하루 한 개 <br/>입력한 정보는 이 기기에만 저장돼요.`;
  page.appendChild(footer);

  // Wire up after mount
  setTimeout(() => {
    if (__onboardStep === 0) {
      const nameInp = document.getElementById('__obName');
      const codeInp = document.getElementById('__obCode');
      const hint = document.getElementById('__obCodeHint');
      if (nameInp) nameInp.oninput = (e) => { __onboardDraft.name = e.target.value; };
      if (codeInp) codeInp.oninput = (e) => {
        __onboardDraft.code = e.target.value;
        // Keep the hint neutral — never reveal whether a code is bound to a name,
        // so participant identities can't be enumerated by typing numbers.
        if (hint) { hint.textContent = '코드를 못 받았다면 운영팀에 문의해주세요.'; hint.style.color = 'var(--muted)'; }
      };
      if (nameInp) nameInp.focus();
    } else if (__onboardStep === 1) {
      const goal = document.getElementById('__obGoal');
      if (goal) {
        goal.oninput = (e) => { __onboardDraft.goal = e.target.value; };
        goal.focus();
      }
      page.querySelectorAll('.__goalChip').forEach((chip) => {
        chip.onclick = () => {
          const g = chip.getAttribute('data-goal') || '';
          __onboardDraft.goal = g;
          const ta = document.getElementById('__obGoal');
          if (ta) ta.value = g;
        };
      });
    } else if (__onboardStep === 2) {
      const roleInp = document.getElementById('__obRole');
      if (roleInp) roleInp.oninput = (e) => { __onboardDraft.role = e.target.value; __onboardDraft.roleSkipped = false; };
      page.querySelectorAll('.__roleChip').forEach((chip) => {
        chip.onclick = () => {
          const r = chip.getAttribute('data-role') || '';
          __onboardDraft.role = r;
          __onboardDraft.roleSkipped = false;
          if (roleInp) roleInp.value = r;
          render();
        };
      });
      const skip = document.getElementById('__obSkipRole');
      if (skip) skip.onclick = () => {
        __onboardDraft.role = '';
        __onboardDraft.roleSkipped = true;
        __finishOnboarding();
      };
    }
  }, 0);

  return page;
}

function __onboardAdvance() {
  if (__onboardStep === 0) {
    const name = (__onboardDraft.name || '').trim();
    const code = (__onboardDraft.code || '').trim();
    if (!name) { showToast('이름을 입력해주세요'); return; }
    const match = lookupCode(code);
    if (!match) {
      const hint = document.getElementById('__obCodeHint');
      if (hint) { hint.textContent = '코드가 맞지 않아요. 다시 확인해주세요.'; hint.style.color = 'var(--orange-dark)'; }
      return;
    }
    // Bound code (e.g., 00/1/2): auto-set role/tier. Name must match if code is personal.
    if (!match.generic && match.name) {
      if (name !== match.name) {
        const hint = document.getElementById('__obCodeHint');
        if (hint) { hint.textContent = `이 코드는 ${match.name} 님 전용이에요. 이름을 확인해주세요.`; hint.style.color = 'var(--orange-dark)'; }
        return;
      }
      if (match.role) __onboardDraft.role = match.role;
    }
    __onboardStep = 1;
    render();
  } else if (__onboardStep === 1) {
    const goal = (__onboardDraft.goal || '').trim();
    if (!goal) { showToast('한 줄만 적어주세요. 나중에 수정할 수 있어요.'); return; }
    __onboardStep = 2;
    render();
  } else if (__onboardStep === 2) {
    __finishOnboarding();
  }
}

function __finishOnboarding() {
  state.name = (__onboardDraft.name || '').trim();
  state.accessCode = (__onboardDraft.code || '').trim();
  state.goal = (__onboardDraft.goal || '').trim();
  state.role = (__onboardDraft.role || '').trim();
  state.roleSkipped = !!__onboardDraft.roleSkipped;
  state.onboarded = true;
  const m = lookupCode(state.accessCode);
  if (m && m.tier) state.tier = m.tier;
  state.isOperator = !!(m && m.isOperator);
  bindMeToMembers();
  saveState({ immediate: true });
  currentPage = 'home';
  saveRoute();
  showToast(`🚀 환영해요, ${state.name}! Day 1이 기다리고 있어요.`);
  render();
}

    name.innerHTML = `<div class="tiny-av ${m.color}">${m.name.slice(0,1)}</div><span>${m.name}</span>`;
    grid.appendChild(name);
    for (let d = 1; d <= 20; d++) {
      const on = m.me ? !!state.verified['d'+d] : d <= m.progress;

      let cls = 'cb-cell';
      if (on) cls += ' on';
      if (today) cls += ' today';
      grid.appendChild(el('div', { class: cls }));
    }
  });
  wrap.appendChild(grid);
  return wrap;
}

function buildVerifyQuestions(dayN) {
  const day = getDay(dayN);
  const primary = (day?.words || []).map((w) => ({
    en: w.en,
    kr: w.def,
    syn: w.syn || [],
    prompt: w.ex_en || `Let's use ${w.en} in a sentence.`,
    prompt_kr: w.ex_kr || '',
  }));
  const reviewPool = [];
  CHALLENGE.weeks.forEach((week) => {
    week.days.forEach((item) => {
      if (item.day >= dayN) return;
      item.words.forEach((w) => {
        reviewPool.push({
          day: item.day,
          en: w.en,
          kr: w.def,
          syn: w.syn || [],
          prompt: w.ex_en || `Let's use ${w.en} in a sentence.`,
          prompt_kr: w.ex_kr || '',
        });
      });
    });
  });
  reviewPool.sort((a, b) => b.day - a.day);
  const seen = new Set();
  const deduped = [...primary, ...reviewPool, ...VERIFY_VOCAB_BANK].filter((item) => {
    const key = item.en.toLowerCase();
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
  return [...deduped.slice(0, 3), ...deduped.slice(3).slice(0, 7)];
}

      onInput: (e) => { state.sentences[key] = e.target.value; saveState(); },
    });
    ta.rows = 4;
    ta.style.minHeight = '180px';
    ta.style.borderRadius = '28px';
    ta.style.padding = '28px 30px';
    ta.style.fontSize = '19px';
    ta.style.background = '#fffdfa';
    ta.value = state.sentences[key] || '';
    row.appendChild(ta);

    const isSubmitted = !!state.submitted[key];
    const controls = el('div', { class: 'row-between', style: { marginTop: '18px', gap: '12px', flexWrap: 'wrap' } });
    const count = el('span', { class: 't-small mono', style: { color: 'var(--muted)', fontSize: '15px' } }, `${ta.value.length} chars`);
    controls.appendChild(count);

    // STEP A — Submit first (raw, alone). This unlocks day verification.
    const submitBtn = el('button', {
      class: 'btn',
      style: {
        padding: '14px 22px', borderRadius: '999px', fontSize: '15px', fontWeight: '700',
        background: isSubmitted ? 'var(--green-soft)' : 'var(--orange)',
        color: isSubmitted ? 'var(--green)' : '#fff',
        border: 'none',
      },
      disabled: !ta.value.trim() && !isSubmitted,
      onClick: () => {
        if (isSubmitted) {
          state.submitted[key] = false;
          delete state.submitted[key];
          saveState();
          showToast('제출 취소됨. 다시 다듬어볼 수 있어요.');
          render();
          return;
        }
        if (!ta.value.trim()) { showToast('문장을 먼저 써주세요.'); return; }
        state.submitted[key] = true;
        saveState();
        showToast('제출 완료. 원하면 AI 리뷰로 다듬어봐요 (참고용).');
        render();
      },
    });
    submitBtn.innerHTML = isSubmitted
      ? `${Icon('check', 12)} 제출 완료 (수정하기)`
      : `제출하기`;
    controls.appendChild(submitBtn);

    // STEP B — AI review (optional, only after submit, private)
    if (isSubmitted) {
      const aiBtn = el('button', {
        class: 'btn btn-ghost',
        style: {
          padding: '14px 20px', background: hasCorrection ? 'var(--green-soft)' : 'transparent',
          color: hasCorrection ? 'var(--green)' : 'var(--ink)', borderRadius: '999px',
          fontSize: '14px', fontWeight: '700',
        },
        disabled: state.tier === 'basic' && hasCorrection,
        onClick: async () => {
          if (!canUseAiForSentence(dayN, key)) {
            showToast('베이직은 한 문장당 AI 리뷰를 1번만 사용할 수 있어요.');
            return;
          }
          aiBtn.disabled = true;
          aiBtn.innerHTML = `${Icon('sparkles', 12)} 리뷰 중...`;
          try {
            const result = await requestSentenceCorrection(w, ta.value);
            state.ai_feedback[key] = result;
            saveState();
            render();
          } catch (e) {
            state.ai_feedback[key] = {
              corrected: ta.value,
              diff_html: escapeHtml(ta.value),
              why: '네트워크 이슈로 AI 리뷰가 지연되고 있어요. 잠시 후 다시 시도해보세요.',
            };
            saveState();
            render();
          }
        },
      });
      aiBtn.innerHTML = hasCorrection
        ? `${Icon('sparkles', 12)} 다시 리뷰 받기`
        : `${Icon('sparkles', 12)} 💡 AI 리뷰 (참고용)`;
      controls.appendChild(aiBtn);
    }
    row.appendChild(controls);

    ta.addEventListener('input', () => {
      count.textContent = `${ta.value.length} chars`;
      submitBtn.disabled = !ta.value.trim() && !state.submitted[key];
    });

    // Private "내 기록실" — only shown after AI review requested.
    const fb = state.ai_feedback[key];
    if (fb && isSubmitted) {
      const result = el('div', { class: 'ai-feedback', style: { marginTop: '18px', padding: '20px 22px', borderRadius: '28px' } });
      result.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
          <div class="ai-head" style="margin:0;">${Icon('sparkles', 12)} 내 기록실 · AI 리뷰</div>

        </div>
        <div class="ai-corrected">"${escapeHtml(fb.corrected)}"</div>
        <div style="font-size:13px;margin-bottom:8px;">${fb.diff_html}</div>
        <div class="t-small" style="color:var(--ink-soft);line-height:1.55;"><b style="color:var(--orange-dark);">💡 Why.</b> ${escapeHtml(fb.why)}</div>
        <div class="t-small" style="margin-top:8px;color:var(--muted);font-size:11.5px;line-height:1.5;">커뮤니티에는 처음 제출한 문장이 그대로 올라가요. 이 리뷰는 다음 학습용 메모예요.</div>`;
      row.appendChild(result);
    }

    sentenceStack.appendChild(row);
  });
  s2.appendChild(sentenceStack);

  // Story hook bonus quest — shown after all 3 AI-corrected
  if (allSentenceDone) {
    const hookKey = `hook-${dayN}`;
    const hookValue = state.sentences[hookKey] || '';
    const hook = el('div', {
      style: {
        marginTop: '18px',
        padding: '20px 22px',
        borderRadius: '24px',
        background: 'linear-gradient(135deg, #FFF3E3 0%, #FDE2C6 100%)',
        border: '1px solid var(--orange-soft)',
      }
    });
    hook.innerHTML = `
      <div class="kicker" style="color:var(--orange-dark);">BONUS · STORY HOOK</div>
      <h3 class="h3" style="margin-top:6px;">오늘 3문장을 하나의 짧은 흐름으로 이어볼까요?</h3>
      <p class="t-body" style="margin-top:6px;font-size:13px;line-height:1.55;">실제 미팅 시나리오 1분 상황극 — 세 표현을 자연스럽게 엮으면 기억에 더 오래 남아요.</p>`;
    const hookTa = el('textarea', {
      class: 'sentence-input',
      placeholder: `예) Before we jump in, let's ${d.words[0].en} on the timeline. I think we should ${d.words[1].en} option A — ${d.words[2].en}, at least.`,
      onInput: (e) => { state.sentences[hookKey] = e.target.value; saveState(); },
    });
    hookTa.rows = 3;
    hookTa.style.minHeight = '120px';
    hookTa.style.marginTop = '12px';
    hookTa.style.borderRadius = '20px';
    hookTa.style.padding = '16px 18px';
    hookTa.style.fontSize = '15px';
    hookTa.style.background = '#fffdfa';
    hookTa.value = hookValue;
    hook.appendChild(hookTa);
    s2.appendChild(hook);
  }

  page.appendChild(s2);

  page.appendChild(el('div', { class: 'divider', style: { margin: '30px 0' } }));

  const bonus = el('div', {
    class: 'card',
    style: {
      background: 'var(--paper)',
      border: 'none',
      borderRadius: '28px',
      padding: '24px 24px',
    }
  });
  bonus.innerHTML = `
    <div style="display:flex;align-items:center;gap:18px;">
      <div style="font-size:26px;">💡</div>
      <div style="flex:1;min-width:0;">

      </div>
      <button class="icon-btn" style="width:72px;height:72px;border-radius:22px;background:#fff;">${Icon('play', 20)}</button>
    </div>`;
  page.appendChild(bonus);

  // Complete button
  const verified = !!state.verified['d'+dayN];
  const cta = el('button', {
    class: 'btn btn-full btn-lg',

    },
    disabled: prepDone !== 2 && !verified,
    onClick: () => {
      if (verified) {

    },
  });
  cta.innerHTML = verified ? `오늘 인증 완료됨` : (prepDone === 2 ? `인증하러 가기 ${Icon('arrowRight', 18)}` : `체크 완료 (${prepDone}/2 준비됨) ${Icon('arrowRight', 18)}`);

  page.appendChild(el('div', { class: 't-small', style: { textAlign: 'center', marginTop: '16px', fontSize: '16px', lineHeight: '1.55' } },
    verified
      ? '인증이 완료되어 대시보드에 반영됐어요.'
      : (prepDone === 2
          ? '준비 완료. 이제 인증 화면으로 넘어가 Step 3, 4를 마치면 됩니다.'

  ));

  return page;
}

function aiGenerateTalkPoints(meta, isPT, existing='') {
  const focus = (meta.desc || '').trim();
  const title = meta.title || '';
  const common = [
    `- ${isPT ? '나의 약점: ' : ''}이번 주 가장 자주 막혔던 표현 정리`,
    `- ${focus ? focus + ' 관련해서' : '이번 세션에서'} 내 실제 업무 예시로 써먹을 방법`,
    '- 단톡방에서 받은 피드백 중 헷갈리는 것',
    '- 다음 주 적용할 한 가지 목표(Goal) 확정',
  ];
  const themed = isPT
    ? [
        '- 내 발음/인토네이션에서 가장 "한국어스러운" 부분 1개 꼭 짚어달라 요청',
        '- 지난 주 작성한 문장 중 가장 어색했던 3개 리뷰 요청',
        `- "${title}"에서 기대하는 구체적 결과 말로 표현`,
      ]
    : [
        `- "${title}" 핵심 표현 3개를 내 업무 상황에 바로 적용`,
        '- 롤플레이에서 내가 말할 오프닝 문장 1개 준비',
        '- 이번 주 표현 중 회의에서 꼭 써볼 표현 1개 선정',
      ];
  const out = [...themed, ...common];
  const hasExisting = (existing || '').trim();
  return (hasExisting ? '' : '') + out.join('\n');
}

function aiPolishNotes(raw) {
  const text = (raw || '').trim();
  if (!text) {
    return [
      '[배운 표현]',
      '- ',
      '',
      '[액션 아이템]',
      '- ',
      '',
      '[인상적이었던 피드백]',
      '- ',
      '',
      '[다음 주 적용]',
      '- ',
    ].join('\n');
  }
  // Super-lightweight structuring: group lines into a template
  const lines = text.split('\n').map(s => s.trim()).filter(Boolean);
  const buckets = { expr: [], action: [], feedback: [], misc: [] };
  lines.forEach(l => {
    const low = l.toLowerCase();
    if (/^(\[?배운|표현|phrase|express|vocab)/i.test(l) || /circle back|loop in|align|kick off/i.test(low)) buckets.expr.push(l.replace(/^[-\*\s]+/, ''));
    else if (/액션|todo|다음|할일|action/i.test(l)) buckets.action.push(l.replace(/^[-\*\s]+/, ''));
    else if (/피드백|feedback|코칭|지적/i.test(l)) buckets.feedback.push(l.replace(/^[-\*\s]+/, ''));
    else buckets.misc.push(l.replace(/^[-\*\s]+/, ''));
  });
  const out = [];
  const add = (head, arr) => {
    out.push(head);
    if (arr.length) arr.forEach(x => out.push('- ' + x));
    else out.push('- ');
    out.push('');
  };
  add('[배운 표현]', buckets.expr);
  add('[액션 아이템]', buckets.action);
  add('[인상적이었던 피드백]', buckets.feedback);
  if (buckets.misc.length) add('[기타 메모]', buckets.misc);
  add('[다음 주 적용]', []);
  return out.join('\n').trim();
}

function aiKrToEn(korean) {
  // Tiny heuristic translator: leaves a clean bilingual template for AI polishing
  const text = (korean || '').trim();
  if (!text) return '- I want to clarify how to use "align on" vs "sync on".\n- Could you give me 3 closings I can use to wrap up a status meeting?';
  const lines = text.split('\n').map(s => s.trim()).filter(Boolean);
  const map = [
    ['회의', 'meeting'], ['발표', 'presentation'], ['피드백', 'feedback'], ['목표', 'goal'],
    ['다음 주', 'next week'], ['지난 주', 'last week'], ['이번 주', 'this week'],
    ['맞았는지', 'was right'], ['차이', 'difference'], ['표현', 'expression'], ['롤플레이', 'role-play'],
    ['질문', 'question'], ['확인', 'check'], ['업무', 'work'], ['프로젝트', 'project'],
  ];
  return lines.map(l => {
    let en = l.replace(/^[-\*\s]+/, '');
    map.forEach(([k, e]) => { en = en.split(k).join(e); });
    // Strip leftover hangul and tidy spacing
    const clean = en.replace(/[가-힣]+/g, '__').replace(/\s+/g, ' ').trim();
    return `- Korean: ${l.replace(/^[-\*\s]+/, '')}\n  → English draft: Could you help me with ${clean.replace(/__/g, 'this')}?`;
  }).join('\n');
}

function aiSummarize(meta, notes) {
  const mn = (notes.meeting_notes || '').trim();
  const tp = (notes.talk_points || '').trim();
  if (!mn && !tp) return '아직 적힌 내용이 부족해요. 몇 줄만 먼저 써보면 요약 드릴게요. ✍️';
  const lines = [];
  lines.push(`📌 ${meta.title}`);
  lines.push('');
  if (tp) {
    const count = tp.split('\n').filter(s => s.trim()).length;
    lines.push(`• 말할 거리 ${count}개 준비됨`);
  }
  if (mn) {
    const len = mn.length;
    const keywords = [];
    ['circle back', 'loop in', 'align', 'kick off', 'for now', 'prioritize', 'trade-off'].forEach(k => {
      if (mn.toLowerCase().includes(k)) keywords.push(`"${k}"`);
    });
    lines.push(`• 회의록 ${len}자 기록`);
    if (keywords.length) lines.push(`• 등장한 핵심 표현: ${keywords.join(', ')}`);
  }
  lines.push('');
  lines.push(`💡 다음 주 적용 TIP: 회의록에서 가장 인상 깊었던 표현 1개를 내일 이메일이나 슬랙에서 한 번 써보세요.`);
  return lines.join('\n');
}

/* ============================================================

   ============================================================ */
async function cloudSaveMeetingNote(meetingId) {
  const notes = state.meeting_notes[meetingId] || {};
  if (!hasSupabase()) {
    // No cloud configured — simulate success so UX still feels right, but mark as local
    await new Promise(r => setTimeout(r, 320));
    return { ok: false, reason: 'local-only' };
  }
  try {
    await supabaseRpc('upsert_meeting_note', {
      p_user: memberKey(),
      p_cohort: CHALLENGE.cohort,
      p_meeting_id: meetingId,
      p_talk_points: notes.talk_points || '',
      p_meeting_notes: notes.meeting_notes || '',
      p_updated_at: new Date().toISOString(),
    });
    return { ok: true };
  } catch (e) {
    return { ok: false, reason: 'error', error: String(e.message || e) };
  }
}

// Debounced cloud sync — fires 1.5s after last edit
function scheduleCloudSync(meetingId) {
  window.__mnSyncTimers = window.__mnSyncTimers || {};
  if (window.__mnSyncTimers[meetingId]) clearTimeout(window.__mnSyncTimers[meetingId]);
  if (!hasSupabase()) return; // local-only — no background sync
  window.__mnSyncTimers[meetingId] = setTimeout(async () => {
    window.__mnSync = window.__mnSync || {};
    const prev = window.__mnSync[meetingId] || { status: 'cloud' };
    window.__mnSync[meetingId] = { status: 'syncing', lastSaved: prev.lastSaved };
    if (currentPage === 'meeting-notes' && window.__currentMeetingId === meetingId) render();
    const res = await cloudSaveMeetingNote(meetingId);
    const now = new Date();
    const when = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
    window.__mnSync[meetingId] = { status: res.ok ? 'cloud' : 'local', lastSaved: when };
    if (currentPage === 'meeting-notes' && window.__currentMeetingId === meetingId) render();
  }, 1500);
}

function generateMeetingMarkdown(meetingId) {
  let meta = null;
  let isPT = false;
  if (meetingId.startsWith('pt')) {
    isPT = true;
    const idx = parseInt(meetingId.replace('pt', ''), 10) - 1;
    meta = CHALLENGE.premium.pt_sessions[idx];
  } else {
    const n = parseInt(meetingId.replace('m', ''), 10);
    meta = CHALLENGE.premium.weekly_meetings.find(x => x.n === n);
  }
  const notes = state.meeting_notes[meetingId] || { talk_points: '', meeting_notes: '' };
  const lines = [];
  lines.push(`# ${isPT ? 'PT' : 'Weekly Meeting'} — ${meta.title}`);
  lines.push('');
  lines.push(`- **Date**: ${meta.date}`);
  lines.push(`- **Cohort**: ${CHALLENGE.cohort}`);
  lines.push(`- **Focus**: ${meta.desc}`);
  lines.push('');
  lines.push('## 🗣 Talking points');
  lines.push('');
  lines.push(notes.talk_points || '_(작성 전)_');
  lines.push('');
  lines.push('## 📝 Meeting notes');
  lines.push('');
  lines.push(notes.meeting_notes || '_(작성 전)_');
  lines.push('');
  lines.push(`*Exported from YouBuddy 비즈니스 영어 챌린지 ${CHALLENGE.cohort}*`);
  return lines.join('\n');
}

        <span class="badge">${q.hint}</span>
      </div>
      <div class="quiz-question">${q.q}</div>`;
    q.options.forEach((opt, oi) => {
      const chosen = state.quiz_answers['q'+qi];

      let cls = 'quiz-option';
      if (answered) {
        if (oi === q.a) cls += ' correct';
        else if (oi === chosen) cls += ' wrong';
      } else if (chosen === oi) {
        cls += ' selected';
      }
      const b = el('button', {

        padding: '8px 14px',
        fontSize: '11.5px',
        fontWeight: active ? '700' : '500',
        cursor: 'pointer',
      },
      onClick: () => { state.savedTab = t.key; saveState(); render(); },
    });
    btn.innerHTML = `${t.label} <span style="font-family:var(--font-mono);opacity:0.72;">${t.count}</span>`;
    tabBar.appendChild(btn);
  });
  bookmarkCard.appendChild(tabBar);

  if (!totalSaved) {
    bookmarkCard.appendChild(el('p', { class: 't-body', style: { marginTop: '14px', fontSize: '13px', color: 'var(--muted)' } },
      'Day 노트에서 단어/유의어에 🔖 해보세요. 여기에 한 통에 모여요.'));
  } else {
    const list = el('div', { style: { marginTop: '14px', display: 'flex', flexDirection: 'column', gap: '8px' } });
    const showWords = tab === 'all' || tab === 'word';
    const showSyns = tab === 'all' || tab === 'syn';
    const showPosts = tab === 'all' || tab === 'post';

    if (showWords && bookmarkedEntries.length) {
      if (tab === 'all') list.appendChild(el('div', { class: 'kicker', style: { color: 'var(--muted)' } }, `단어 · ${bookmarkedEntries.length}`));
      bookmarkedEntries.forEach(({ key, day, weekN, word }) => {
        const row = el('div', {
          style: {
            display: 'flex', alignItems: 'center', gap: '12px',
            padding: '10px 12px', borderRadius: '14px', background: 'var(--paper)',
            cursor: 'pointer',
          },
          onClick: () => go('day', { week: weekN, day }),
        });
        row.innerHTML = `
          <span class="mono" style="font-size:10px;color:var(--muted);min-width:30px;">D${day}</span>
          <div style="flex:1;min-width:0;">
            <div style="font-size:14.5px;font-weight:800;color:var(--orange);line-height:1.2;">${escapeHtml(word.en)}</div>
            <div class="t-small" style="margin-top:2px;font-size:12px;color:var(--ink-soft);">${escapeHtml(word.def)}</div>
          </div>
          <button class="icon-btn" style="width:30px;height:30px;border-radius:10px;background:transparent;border:none;color:var(--orange);" onclick="event.stopPropagation(); window.__toggleBookmark('${key}')">${Icon('bookmarkFill', 13)}</button>`;
        list.appendChild(row);
      });
    }

    if (showSyns && synonymEntries.length) {
      if (tab === 'all') list.appendChild(el('div', { class: 'kicker', style: { color: 'var(--muted)', marginTop: '6px' } }, `유의어 · ${synonymEntries.length}`));
      synonymEntries.forEach(({ key, day, weekN, parent, syn }) => {
        const row = el('div', {
          style: {
            display: 'flex', alignItems: 'center', gap: '12px',
            padding: '10px 12px', borderRadius: '14px', background: 'rgba(245,239,228,0.55)',
            border: '1px solid rgba(240,125,56,0.14)',
            cursor: 'pointer',
          },
          onClick: () => go('day', { week: weekN, day }),
        });
        row.innerHTML = `
          <span class="mono" style="font-size:10px;color:var(--muted);min-width:30px;">D${day}</span>
          <div style="flex:1;min-width:0;">
            <div style="font-size:13.5px;font-weight:800;color:var(--ink);line-height:1.2;">${escapeHtml(syn)}</div>
            <div class="t-small" style="margin-top:2px;font-size:11.5px;color:var(--ink-soft);">≈ ${escapeHtml(parent)}</div>
          </div>
          <button class="icon-btn" style="width:30px;height:30px;border-radius:10px;background:transparent;border:none;color:var(--orange);" onclick="event.stopPropagation(); window.__toggleSynBookmark('${key}')">${Icon('bookmarkFill', 13)}</button>`;
        list.appendChild(row);
      });
    }

    if (showPosts && savedCommunityPosts.length) {
      if (tab === 'all') list.appendChild(el('div', { class: 'kicker', style: { color: 'var(--muted)', marginTop: '6px' } }, `커뮤니티 문장 · ${savedCommunityPosts.length}`));
      savedCommunityPosts.forEach((post) => {
        const row = el('div', {
          style: {
            display: 'flex', alignItems: 'flex-start', gap: '12px',
            padding: '12px', borderRadius: '14px', background: 'var(--paper)',
            cursor: 'pointer',
          },
          onClick: () => go('community'),
        });
        row.innerHTML = `
          <div class="avatar ${post.avatarClass}" style="width:32px;height:32px;border-radius:11px;font-size:11px;flex-shrink:0;">${post.avatar}</div>
          <div style="flex:1;min-width:0;">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
              <span style="font-size:12.5px;font-weight:800;color:var(--ink);">${escapeHtml(post.user)}</span>
              <span class="mono" style="font-size:10px;color:var(--muted);">${escapeHtml(post.word)}</span>
            </div>
            <div style="margin-top:3px;font-size:12.5px;line-height:1.45;color:var(--ink);font-weight:600;">${escapeHtml(post.sentence)}</div>
          </div>
          <button class="icon-btn" style="width:30px;height:30px;border-radius:10px;background:transparent;border:none;color:var(--orange);flex-shrink:0;" onclick="event.stopPropagation(); window.__toggleCommunityBookmark('${post.id}')">${Icon('bookmarkFill', 13)}</button>`;
        list.appendChild(row);
      });
    }

    bookmarkCard.appendChild(list);
  }
  page.appendChild(bookmarkCard);

  // 5. Tier section (moved to bottom near export)
  const tierCard = el('div', { class: 'card', style: { marginTop: '18px' } });
  const tierHtml = state.tier === 'premium' ? `
    <div class="kicker">PREMIUM UNLOCKED · ₩169,000</div>
    <h3 class="h2" style="margin-top:6px;"><span class="serif">Welcome</span> to premium</h3>
    <p class="t-body" style="margin-top:6px;">프리미엄 전용 PT · 주간 미팅 · 퀴즈 · Certification이 열려있어요.</p>
    <button class="btn btn-ghost btn-sm" style="margin-top:12px;" onclick="window.__resetTier()">베이직으로 되돌리기</button>
  ` : `
    <div class="kicker">BASIC MEMBER · ₩59,000</div>
    <h3 class="h2" style="margin-top:6px;"><span class="serif">Upgrade</span> to premium</h3>
    <p class="t-body" style="margin-top:6px;">PT 세션, 주간 Zoom 미팅 4회, 개인 퀴즈, 최종 Certification을 함께 받아요.</p>
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;">
      <button class="btn btn-lilac btn-sm" onclick="window.__openPremiumGate()">프리미엄 코드 입력</button>
      <a href="https://www.latpeed.com/products/en0l_" target="_blank" class="btn btn-ghost btn-sm" style="text-decoration:none;">업그레이드 (₩169,000)</a>
    </div>`;
  tierCard.innerHTML = tierHtml;
  page.appendChild(tierCard);

  const exportCard = el('div', { class: 'card', style: { marginTop: '20px', padding: '18px', background: 'linear-gradient(135deg, #FFF3E3, #FDE2C6)', border: '1px solid var(--orange-soft)' } });
  exportCard.innerHTML = `
    <div style="display:flex;gap:12px;align-items:flex-start;">
      <div style="width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:18px;font-family:var(--font-serif);font-style:normal;font-weight:700;color:var(--ink);">N</div>
      <div style="flex:1;">
        <div class="h3">Notion으로 내보내기</div>
        <div class="t-small" style="margin-top:4px;">학습 기록과 내 문장을 마크다운으로 저장해서 Notion에서 바로 열어요</div>
      </div>
    </div>`;
  const exportActions = el('div', { style: { display: 'flex', gap: '8px', marginTop: '14px' } });
  const exportPageBtn = el('button', { class: 'btn btn-ink', style: { flex: '1', justifyContent: 'center' }, onClick: () => go('export') });
  exportPageBtn.innerHTML = `${Icon('download', 16)} 노션 내보내기`;
  exportActions.appendChild(exportPageBtn);
  const copyBtn = el('button', { class: 'btn btn-ghost', onClick: () => copyMarkdown() });
  copyBtn.textContent = '마크다운 복사';
  exportActions.appendChild(copyBtn);
  exportCard.appendChild(exportActions);
  page.appendChild(exportCard);

  return page;
}

/* ============================================================
   COMMUNITY PAGE
   ============================================================ */
function CommunityPage() {
  const page = el('div', { class: 'page', style: { paddingTop: '24px', paddingLeft: '22px', paddingRight: '22px' } });
  const filterState = state.communityFilter || 'all';
  const likedMap = state.community_likes || {};
  const savedMap = state.community_bookmarks || {};
  // 날짜 필터 — 기본값은 오늘. 달력에서 지난 날짜 고를 수 있음.
  const selectedDay = state.communityDay || state.currentDay;
  const selDayObj = getDay(selectedDay);

  const header = el('div', {
    style: {
      display: 'grid',
      gridTemplateColumns: '56px 1fr 56px',
      alignItems: 'start',
      gap: '12px',
    }
  });
  const back = el('button', { class: 'icon-btn', style: { width: '56px', height: '56px', borderRadius: '20px' }, onClick: () => go('home') });
  back.innerHTML = Icon('arrowLeft', 20);
  header.appendChild(back);
  const title = el('div', { style: { textAlign: 'center', paddingTop: '2px' } });
  title.innerHTML = `<h2 style="margin:0;font-size:21px;line-height:1.2;letter-spacing:-0.02em;">커뮤니티</h2><p style="margin:6px 0 0;font-size:12px;line-height:1.4;color:var(--muted);">${selectedDay === state.currentDay ? '오늘' : `Day ${selectedDay}`} 동료들의 문장</p>`;
  header.appendChild(title);
  // 달력 아이콘 → 지난 날짜 탐색
  const calBtn = el('button', {
    class: 'icon-btn',
    style: {
      width: '56px', height: '56px', borderRadius: '20px',
      background: state.communityDay && state.communityDay !== state.currentDay ? 'var(--orange-ghost)' : 'transparent',
      color: state.communityDay && state.communityDay !== state.currentDay ? 'var(--orange-dark)' : 'var(--ink)',
      borderColor: state.communityDay && state.communityDay !== state.currentDay ? 'rgba(240,125,56,0.28)' : 'var(--line)',
    },
    onClick: () => { state.communityDayPickerOpen = !state.communityDayPickerOpen; render(); },
    title: '날짜 선택',
  });
  calBtn.innerHTML = Icon('calendar', 18);
  header.appendChild(calBtn);
  page.appendChild(header);

  // Day picker drawer — compact 20-day grid with status dots
  if (state.communityDayPickerOpen) {
    const picker = el('div', {
      style: {
        marginTop: '14px',
        padding: '16px',
        borderRadius: '22px',
        background: 'var(--cream)',
        border: '1px solid var(--line)',
      }
    });
    picker.innerHTML = `<div class="kicker" style="margin-bottom:10px;">날짜 선택 · Day 1–20</div>`;
    const grid = el('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: '6px' } });
    for (let d = 1; d <= 20; d++) {
      const isSel = d === selectedDay;
      const isToday = d === state.currentDay;
      const isDone = !!state.verified['d' + d];
      const bg = isSel ? 'var(--ink)'
        : isToday ? 'var(--orange-ghost)'
        : isDone ? 'var(--paper)'
        : '#FFFDF7';
      const color = isSel ? 'var(--cream)' : (isToday ? 'var(--orange-dark)' : 'var(--ink)');
      const btn = el('button', {
        style: {
          padding: '10px 6px',
          borderRadius: '10px',
          background: bg,
          color,
          border: '1px solid ' + (isSel ? 'var(--ink)' : 'var(--line-soft)'),
          fontSize: '12px',
          fontWeight: isSel ? '800' : '600',
          cursor: d <= state.currentDay ? 'pointer' : 'not-allowed',
          opacity: d > state.currentDay ? 0.4 : 1,
          position: 'relative',
        },
        disabled: d > state.currentDay,
        onClick: () => {
          state.communityDay = d;
          state.communityDayPickerOpen = false;
          saveState();
          render();
        },
      });
      const dot = isDone ? '<span style="position:absolute;top:4px;right:5px;width:5px;height:5px;border-radius:3px;background:var(--green);"></span>' : '';
      btn.innerHTML = `${dot}<span style="font-family:var(--font-mono);">D${d}</span>`;
      grid.appendChild(btn);
    }
    picker.appendChild(grid);
    const resetRow = el('div', { style: { display: 'flex', justifyContent: 'space-between', marginTop: '12px', alignItems: 'center' } });
    resetRow.innerHTML = `<span class="t-small" style="font-size:11px;color:var(--muted);">회색 점 = 내가 인증한 날</span>`;
    const todayBtn = el('button', {
      class: 'btn btn-ghost btn-sm',
      style: { padding: '6px 12px', fontSize: '11px', borderRadius: '999px' },
      onClick: () => { state.communityDay = state.currentDay; state.communityDayPickerOpen = false; saveState(); render(); },
    }, '오늘로 돌아가기');
    resetRow.appendChild(todayBtn);
    picker.appendChild(resetRow);
    page.appendChild(picker);
  }

  const hero = el('div', { style: { padding: '24px 8px 12px' } });
  const dateStr = formatDateKR(dayDate(selectedDay));
  hero.innerHTML = `
    <div class="kicker">${selectedDay === state.currentDay ? 'TODAY' : 'LOOKING BACK'} · DAY ${selectedDay} · ${dateStr}</div>
    <h1 style="margin:10px 0 0;font-size:26px;line-height:1.12;letter-spacing:-0.03em;font-weight:700;"><span class="serif">${visibleMembers().length}명의</span> ${selectedDay === state.currentDay ? '오늘 문장' : `Day ${selectedDay} 문장`}</h1>
    <p style="margin:10px 0 0;font-size:13px;line-height:1.55;color:var(--ink-soft);letter-spacing:-0.01em;word-break:keep-all;">
      제출한 <b>영어 원문</b>이 그대로 올라가요. 한글 해석은 없어도 OK — 있으면 같이 보여줘요.
    </p>`;
  page.appendChild(hero);

  // Storage policy mini-banner
  const policyNote = el('div', {
    style: {
      marginTop: '4px',
      padding: '10px 12px',
      borderRadius: '12px',
      background: 'var(--paper)',
      fontSize: '11px',
      lineHeight: '1.5',
      color: 'var(--ink-soft)',
      display: 'flex',
      alignItems: 'center',
      gap: '8px',
    }
  });
  policyNote.innerHTML = `<span style="font-size:13px;">💡</span><span>제출 시 저장되는 건 <b>영어 원문 1줄</b>뿐이에요. AI 리뷰본은 내 기록실에만 남아요.</span>`;
  page.appendChild(policyNote);

  const filters = ['all', 'ALIGN ON', 'GO WITH', 'FOR NOW'];
  const chips = el('div', { class: 'hidden-scroll', style: { display: 'flex', gap: '8px', overflowX: 'auto', padding: '14px 0 14px', marginRight: '-22px' } });
  filters.forEach((f) => {
    const active = filterState === f;
    const chip = el('button', {
      style: {
        border: 'none',
        background: active ? 'var(--ink)' : '#F5EFE4',
        color: active ? 'var(--cream)' : 'var(--orange-dark)',
        borderRadius: '999px',
        padding: '10px 16px',
        fontSize: '11px',
        lineHeight: '1',
        flexShrink: '0',
        letterSpacing: '0.06em',
        textTransform: 'uppercase',
      },
      onClick: () => { state.communityFilter = f; saveState(); render(); },
    });
    chip.innerHTML = f === 'all' ? '전체' : `<span style="font-size:11px;color:${active ? 'var(--cream)' : 'var(--orange)'};font-weight:700;">${f}</span>`;
    chips.appendChild(chip);
  });
  page.appendChild(chips);

  // Build merged feed for the selected day:
  //   - My submitted sentences (from state.sentences) — editable, raw English
  //   - Peer sentences from PEER_SENTENCES / fallback generator
  //   - Today only: append curated COMMUNITY_POSTS
  const myName = state.name || '박지혜';
  const dayData = selDayObj;
  const myPosts = [];
  if (dayData && dayData.words) {
    dayData.words.forEach((w, i) => {
      const raw = state.sentences[`d${selectedDay}-${i}`];
      if (!raw || !raw.trim()) return;
      const submitted = state.submitted?.[`d${selectedDay}-${i}`];
      // Only raw SUBMITTED sentences appear in community
      if (!submitted) return;
      const edit = state.community_edits?.[`me-d${selectedDay}-${i}`];
      myPosts.push({
        id: `me-d${selectedDay}-${i}`,
        user: myName,
        team: 'A',
        avatar: myName.slice(0, 1),
        avatarClass: 'orange',
        word: (w.en || '').toUpperCase(),
        time: '방금',
        sentence: edit?.sentence || raw,
        translation: edit?.translation || '',
        likes: 0,
        comments: 0,
        mine: true,
        edited: !!edit,
      });
    });
  }
  const peers = peerSentencesFor(selectedDay).map((p, idx) => {
    const w = dayData && dayData.words ? (dayData.words[p.wordIdx] || dayData.words[0]) : { en: '' };
    return {
      id: `peer-d${selectedDay}-${idx}`,
      user: p.user,
      team: p.team,
      avatar: p.avatar,
      avatarClass: idx % 2 === 0 ? 'cream' : 'ink',
      word: (w.en || '').toUpperCase(),
      time: p.time,
      sentence: p.sentence,
      translation: p.translation,
      likes: p.likes || 0,
      comments: 0,
    };
  });
  const curated = selectedDay === state.currentDay ? COMMUNITY_POSTS : [];
  let basePosts = [...myPosts, ...peers, ...curated];
  if (filterState !== 'all') basePosts = basePosts.filter((p) => p.word === filterState);

  const stack = el('div', { style: { marginTop: '4px' } });
  basePosts.forEach((post) => {
    const liked = !!likedMap[post.id];
    const saved = !!savedMap[post.id];
    const likeCount = post.likes + (liked ? 1 : 0);
    const row = el('div', {
      style: {
        display: 'grid',
        gridTemplateColumns: '36px 1fr',
        gap: '10px',
        padding: '10px 2px 12px',
        borderBottom: '1px solid rgba(231,221,200,0.55)',
        alignItems: 'flex-start',
      }
    });
    const highlighted = escapeHtml(post.sentence).replace(
      /(align on|go with|for now|push back|circle back|heads-up|on track|wrap up|flag|blocker)/i,
      '<span style="background:var(--orange-ghost);color:var(--orange-dark);padding:1px 5px;border-radius:5px;font-weight:700;">$1</span>'
    );
    const editTag = post.edited
      ? `<span style="font-size:10px;color:var(--muted);margin-left:6px;">(수정됨)</span>` : '';
    const mineEditBtn = post.mine
      ? `<button onclick="window.__editMyCommunityPost('${post.id}')" style="background:transparent;border:none;padding:2px 6px;font-size:11px;color:var(--orange-dark);cursor:pointer;">수정</button>` : '';
    row.innerHTML = `
      <button onclick="window.__openMemberCard(${JSON.stringify(post.user)})" style="background:transparent;border:none;padding:0;">
        <div class="avatar ${post.avatarClass}" style="width:34px;height:34px;border-radius:10px;font-size:12px;">${post.avatar}</div>
      </button>
      <div style="min-width:0;">
        <div style="display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;">
          <button onclick="window.__openMemberCard(${JSON.stringify(post.user)})" style="background:transparent;border:none;padding:0;font-size:12.5px;font-weight:700;color:var(--ink);letter-spacing:-0.01em;cursor:pointer;">${escapeHtml(post.user)}</button>
          <span style="font-size:10px;color:var(--muted);">Team ${post.team}</span>
          <span style="font-size:10px;color:var(--muted);">· ${post.time}</span>
          <span style="font-size:9.5px;font-weight:700;letter-spacing:0.08em;color:var(--orange-dark);background:var(--orange-ghost);padding:2px 6px;border-radius:4px;">${escapeHtml(post.word)}</span>
          ${editTag}
        </div>
        <p style="margin:5px 0 0;font-size:13.5px;line-height:1.5;color:var(--ink);letter-spacing:-0.01em;">${highlighted}</p>
        ${post.translation ? `<p style="margin:3px 0 0;font-size:11.5px;line-height:1.45;color:var(--ink-soft);word-break:keep-all;">${escapeHtml(post.translation)}</p>` : ''}
        <div style="display:flex;gap:12px;margin-top:6px;align-items:center;">
          <button onclick="window.__toggleCommunityLike('${post.id}')" style="background:transparent;border:none;padding:0;display:inline-flex;align-items:center;gap:3px;color:${liked ? 'var(--orange-dark)' : 'var(--muted)'};font-size:11px;font-weight:${liked ? '700' : '500'};">${Icon('flame', 10)} ${likeCount}</button>
          <button onclick="showToast('댓글은 다음 단계에서 연결할게요.')" style="background:transparent;border:none;padding:0;display:inline-flex;align-items:center;gap:3px;color:var(--muted);font-size:11px;">${Icon('messageCircle', 10)} ${post.comments}</button>
          <button onclick="window.__speakText(${JSON.stringify(post.sentence)})" style="background:transparent;border:none;padding:0;display:inline-flex;align-items:center;gap:3px;color:var(--muted);font-size:11px;">${Icon('volume', 10)} 듣기</button>
          <button onclick="window.__toggleCommunityBookmark('${post.id}')" style="background:transparent;border:none;padding:0;display:inline-flex;align-items:center;gap:3px;color:${saved ? 'var(--orange-dark)' : 'var(--muted)'};font-size:11px;margin-left:auto;">${Icon(saved ? 'bookmarkFill' : 'bookmark', 10)}</button>
          ${mineEditBtn}
        </div>
      </div>`;
    stack.appendChild(row);
  });
  if (!basePosts.length) {
    stack.appendChild(el('p', { class: 't-body', style: { marginTop: '18px', fontSize: '13px', color: 'var(--muted)' } },
      '아직 올라온 문장이 없어요.'));
  }
  page.appendChild(stack);

  return page;
}

function SettingsModal() {
  const backdrop = el('div', {
    class: 'modal-backdrop',
    onClick: (e) => { if (e.target === backdrop) { showSettings = false; render(); } },
  });
  const modal = el('div', {
    class: 'modal',
    style: {
      width: 'min(92vw, 420px)',
      padding: '22px 20px 18px',
      borderRadius: '26px',
      background: '#FFFDF7',
      border: '1px solid var(--line)',
    },
  });
  const ROLE_PRESETS = ['PM', '마케터', '디자이너', '개발자', '기획자', '세일즈', '리서처', 'HR'];
  const currentRole = state.role || '';

function __collectScriptsMarkdown(onlyDay) {
  const lines = [];
  lines.push(`# 비즈니스 영어 챌린지 ${CHALLENGE.cohort} — 내 대본`);
  lines.push('');
  lines.push(`- 이름: ${state.name || '-'}`);
  if (state.role) lines.push(`- 직무: ${state.role}`);
  if (state.goal) lines.push(`- 목표: ${state.goal}`);
  lines.push(`- 기간: ${CHALLENGE.start_date} ~ ${CHALLENGE.end_date}`);
  lines.push('');
  CHALLENGE.weeks.forEach((w) => {
    w.days.forEach((dy) => {
      if (onlyDay && dy.day !== onlyDay) return;
      const rows = [];
      dy.words.forEach((word, i) => {
        const key = `d${dy.day}-${i}`;
        const s = state.sentences[key];
        if (!s || !s.trim()) return;
        const ai = state.ai_feedback?.[key];
        rows.push({ word, sentence: s.trim(), corrected: ai?.corrected || '' });
      });
      if (!rows.length) return;
      const dateStr = formatDateShortKR(dayDate(dy.day));
      lines.push(`## Day ${dy.day} · ${dy.title} (${dateStr})`);
      lines.push('');
      rows.forEach((r) => {
        lines.push(`- **${r.word.en}** _(${r.word.def})_`);
        lines.push(`  - 내 문장: ${r.sentence}`);
        if (r.corrected && r.corrected !== r.sentence) {
          lines.push(`  - AI 교정: ${r.corrected}`);
        }
      });
      lines.push('');
    });
  });
  return lines.join('\n');
}

async function __exportScriptsAsMarkdown(onlyDay) {
  const md = __collectScriptsMarkdown(onlyDay);
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(md);
      showToast(onlyDay ? `📋 Day ${onlyDay} 마크다운 복사됨 — Notion에 붙여넣기` : '📋 전체 마크다운 복사됨 — Notion에 붙여넣기');
      return;
    }
  } catch (e) {}
  // Fallback — open in new tab
  const win = window.open('', '_blank');
  if (win) {
    win.document.write('<pre style="white-space:pre-wrap;font-family:monospace;padding:24px;">' + md.replace(/[<>&]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c])) + '</pre>');
    win.document.title = 'Notion Export';
  } else {
    showToast('클립보드 접근이 막혀있어요. 수동 복사해주세요.');
  }
}

  window.__verifyUi = window.__verifyUi || {};
  const ui = window.__verifyUi[dayN] || { idx: 0, value: '', done: false, score: 0, activeStep: 'capture', reveal: false };
  ui.reveal = !ui.reveal;
  window.__verifyUi[dayN] = ui;

};
window.__advanceVerifyQuiz = (dayN, skipped) => {
  const questions = buildVerifyQuestions(dayN);
  window.__verifyUi = window.__verifyUi || {};
  const ui = window.__verifyUi[dayN] || { idx: 0, value: '', done: false, score: 0, activeStep: 'capture', reveal: false };
  const current = questions[ui.idx];
  const answer = (ui.value || '').trim().toLowerCase();
  const correct = skipped ? false : answer === current.en.toLowerCase();
  ui.score = (ui.score || 0) + (correct ? 1 : 0);
  if (ui.idx >= questions.length - 1) {
    ui.done = true;
    ui.value = '';
  } else {
    ui.idx += 1;
    ui.value = '';
  }
  ui.reveal = false;
  ui.activeStep = 'capture';
  window.__verifyUi[dayN] = ui;
  render();
};

/* Female English voice picker — prefers well-known female voices, falls back gracefully */
function pickFemaleEnVoice() {
  try {
    const voices = window.speechSynthesis.getVoices() || [];
    if (!voices.length) return null;
    const preferredNames = [
      'Samantha', 'Ava', 'Allison', 'Susan', 'Karen', 'Moira', 'Tessa', 'Fiona',
      'Google US English', 'Google UK English Female',
      'Microsoft Aria', 'Microsoft Jenny', 'Microsoft Zira', 'Microsoft Emma', 'Microsoft Michelle',
    ];
    for (const n of preferredNames) {
      const v = voices.find((vo) => vo.name && vo.name.toLowerCase().includes(n.toLowerCase()));
      if (v) return v;
    }
    const femaleEn = voices.find((v) => /en/i.test(v.lang) && /female/i.test(v.name));
    if (femaleEn) return femaleEn;
    const anyEn = voices.find((v) => /^en/i.test(v.lang));
    return anyEn || null;
  } catch (e) { return null; }
}
/* preload voices so the picker works on first click */

  window.speechSynthesis.getVoices();

}
window.__speakText = (text) => {
  try {
    if (!text) return;
    const u = new SpeechSynthesisUtterance(text);
    u.voice = pickFemaleEnVoice();
    u.lang = 'en-US';
    u.rate = 0.94;
    u.pitch = 1.04;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  } catch (e) {}
};

  try {

};

        lines.push(`- 해석: ${w.ex_kr}`);

        lines.push('');
      });

      lines.push('---');

    });

  if (state.tier === 'premium') {

    lines.push('');
    lines.push(`### Weekly Zoom Meetings`);

      if (n && (n.talk_points || n.meeting_notes)) {

          lines.push(`  **🗣 Talking points**`);

        if (n.meeting_notes) {

function download(filename, content, mime='text/plain') {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 100);
}

/* confetti */
function fireConfetti() {
  const layer = el('div', { class: 'celebration' });
  const emojis = ['🎉', '✨', '🧡', '📘', '🎊'];
  for (let i = 0; i < 28; i++) {
    const s = document.createElement('span');
    s.textContent = emojis[i % emojis.length];
    s.style.left = (Math.random() * 100) + '%';
    s.style.setProperty('--x', (Math.random() * 200 - 100) + 'px');
    s.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
    s.style.animationDelay = (Math.random() * 400) + 'ms';
    layer.appendChild(s);
  }
  document.body.appendChild(layer);
  clearTimeout(confettiTimer);
  confettiTimer = setTimeout(() => layer.remove(), 3200);
}

//    so returning users skip onboarding and see their real identity.

  try {
    const cached = loadCachedState();
    if (cached) mergePersistedState(cached);
  } catch (e) { console.warn('hydrate state failed', e); }
}

// 2) Bind the logged-in user to the right MEMBERS row (or keep placeholder renamed).
try { bindMeToMembers(); } catch (e) { console.warn('bindMeToMembers failed', e); }

// 3) Sync currentDay to today's calendar (skip in demo mode so seed stays visible)

  try {
    const realDay = computeCurrentDay();
    if (realDay && realDay !== state.currentDay) {
      state.currentDay = realDay;
    }
  } catch (e) { console.warn('computeCurrentDay failed', e); }
}

// 4) Async remote hydrate (Supabase) — overrides localStorage if fresher,
//    then re-binds + re-renders.
