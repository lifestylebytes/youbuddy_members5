<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YOUBUDDY · 비즈니스 영어 챌린지</title>
<meta name="description" content="혼자 안 해도 되는 영어. 20일 챌린지로 비즈니스 영어 60개 표현을 본인 voice 로 만들어 가세요." />

<!-- 즉시 리다이렉트 (meta refresh — JS 꺼져있어도 동작) -->
<meta http-equiv="refresh" content="0; url=https://lifestylebytes.github.io/youbuddy-challenge/" />

<!-- 캐노니컬 (검색엔진 SEO) -->
<link rel="canonical" href="https://lifestylebytes.github.io/youbuddy-challenge/" />

<style>
  html, body {
    margin: 0; padding: 0;
    background: #FFFDF7;
    color: #2A1F14;
    font-family: 'Pretendard Variable', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    height: 100%;
  }
  .wrap {
    min-height: 100vh;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    padding: 40px 24px;
    text-align: center;
  }
  .loader {
    width: 38px; height: 38px;
    border: 3px solid rgba(240,125,56,0.18);
    border-top-color: #F07D38;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 22px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 {
    margin: 0 0 6px;
    font-size: 22px; font-weight: 800;
    letter-spacing: -0.02em;
  }
  p {
    margin: 0 0 24px;
    font-size: 14px; color: #5A4A36;
    line-height: 1.55;
  }
  a.fallback {
    display: inline-block;
    padding: 11px 20px;
    border-radius: 999px;
    background: #F07D38;
    color: #fff;
    font-size: 13px; font-weight: 800;
    text-decoration: none;
    transition: background 0.15s, transform 0.15s;
  }
  a.fallback:hover { background: #C95721; transform: translateY(-1px); }
  .small {
    margin-top: 14px;
    font-size: 11.5px; color: #9A8B73;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="loader"></div>
    <h1>YOUBUDDY 챌린지 페이지로 이동 중이에요</h1>
    <p>잠시 후 자동으로 이동돼요.<br>이동이 안 되면 아래 버튼을 눌러주세요.</p>
    <a class="fallback" href="https://lifestylebytes.github.io/youbuddy-challenge/">🍊 챌린지 페이지로 이동 →</a>
    <div class="small">YOUBUDDY · 혼자 안 해도 되는 비즈니스 영어 챌린지</div>
  </div>

  <!-- JS 추가 리다이렉트 — meta refresh 가 막힌 환경 대비 -->
  <script>
    (function () {
      // 5기 참여자가 /5th/ 로 직접 들어오는 경우는 라우팅 안 함
      if (window.location.pathname.indexOf('/5th') === 0) return;
      window.location.replace('https://lifestylebytes.github.io/youbuddy-challenge/');
    })();
  </script>
</body>
</html>
