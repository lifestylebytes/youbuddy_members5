<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Week 3 · Live Practice (Prototype v2) · YOUBUDDY</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
  :root {
    --cream: #FFFDF7;
    --paper: #F7EFDE;
    --paper-2: #F1E6CF;
    --ink: #2A1F14;
    --ink-soft: #5B4A32;
    --muted: #8A7A5C;
    --line: #E7DDC8;
    --orange: #F07D38;
    --orange-dark: #C95721;
    --orange-bg: rgba(240,125,56,0.10);
    --lilac: #A98BB8;
    --lilac-dark: #6B4F7D;
    --lilac-bg: rgba(169,139,184,0.14);
    --gold: #FCE8B2;
    --green: #6FAE6C;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif}
  html,body{background:var(--cream);color:var(--ink)}
  body{min-height:100vh;padding-bottom:60px}

  .proto-banner{
    background:linear-gradient(135deg,#FFE8D1 0%,#FFF1DD 100%);color:var(--orange-dark);
    text-align:center;padding:6px;font-size:11px;font-weight:700;letter-spacing:0.05em;
    border-bottom:1px dashed rgba(240,125,56,0.4);
  }

  /* Meeting Info Banner */
  .meeting-info{
    background:linear-gradient(135deg,rgba(169,139,184,0.12) 0%,rgba(252,232,178,0.30) 100%);
    border-bottom:1px solid var(--line);padding:12px 22px;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  }
  .mi-block{display:flex;flex-direction:column;gap:2px;min-width:0}
  .mi-title{font-size:13px;font-weight:800;color:var(--ink);letter-spacing:-0.01em}
  .mi-title b{color:var(--lilac-dark);margin-right:4px}
  .mi-date{font-size:11.5px;color:var(--ink-soft);font-weight:600}
  .mi-date .tz{font-size:10.5px;color:var(--muted);font-weight:500;margin-left:6px}
  .mi-spacer{flex:1}
  .mi-meet{
    padding:9px 16px;border-radius:12px;background:var(--lilac);color:#fff;
    font-size:12.5px;font-weight:700;text-decoration:none;
    display:inline-flex;align-items:center;gap:6px;letter-spacing:-0.005em;
    box-shadow:0 6px 14px -6px rgba(169,139,184,0.6);
  }
  .mi-meet:hover{background:var(--lilac-dark);transform:translateY(-1px)}
  .mi-copy{
    background:transparent;border:1px solid rgba(107,79,125,0.3);color:var(--lilac-dark);
    padding:8px 12px;border-radius:10px;font-size:11.5px;font-weight:700;cursor:pointer;
    display:inline-flex;align-items:center;gap:5px;
  }
  .mi-copy:hover{background:rgba(169,139,184,0.1)}
  @media (max-width:600px){
    .meeting-info{padding:10px 16px;gap:10px}
    .mi-title{font-size:12px}
    .mi-meet{padding:7px 12px;font-size:11.5px}
  }

  /* HEADER */
  .hdr{
    background:var(--ink);color:#fff;padding:14px 22px;
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-bottom:3px solid var(--gold);
  }
  .hdr-title{font-size:14px;font-weight:600;color:var(--gold)}
  .hdr-title b{color:#fff;font-weight:800;margin:0 6px}
  .timer{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:18px;font-weight:700;color:var(--gold);min-width:90px}
  .hdr-icon-btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#fff;
    padding:7px 12px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer}
  .hdr-icon-btn:hover{background:rgba(255,255,255,0.18)}
  .hdr-spacer{flex:1}
  .names-input{
    background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.18);color:#fff;
    padding:8px 12px;border-radius:10px;font-size:12.5px;min-width:280px;outline:none;
    font-family:inherit;
  }
  .names-input::placeholder{color:rgba(255,255,255,0.4)}
  .names-input:focus{border-color:var(--gold);background:rgba(255,255,255,0.14)}

  /* CONTAINER */
  .wrap{max-width:980px;margin:0 auto;padding:24px 22px}

  /* SITUATION NAV */
  .sit-nav{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .sit-tab{
    padding:9px 14px;border-radius:99px;background:#fff;border:1.5px solid var(--line);
    font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink-soft);
    display:flex;align-items:center;gap:6px;
  }
  .sit-tab:hover{border-color:var(--orange)}
  .sit-tab.active{background:var(--orange);color:#fff;border-color:var(--orange);box-shadow:0 6px 14px -6px rgba(240,125,56,0.5)}
  .sit-tab .num{font-size:10px;background:rgba(0,0,0,0.08);padding:2px 6px;border-radius:99px}
  .sit-tab.active .num{background:rgba(255,255,255,0.22)}

  /* SITUATION CARD */
  .sit-card{
    background:linear-gradient(160deg,#FFFDF7 0%,#FBF3E2 100%);
    border:1.5px solid var(--line);border-radius:24px;padding:32px;
    box-shadow:0 24px 60px -28px rgba(58,42,82,0.18);margin-bottom:24px;
  }
  .sit-emoji{font-size:56px;line-height:1;margin-bottom:14px}
  .sit-title{font-size:28px;font-weight:900;letter-spacing:-0.022em;line-height:1.25;color:var(--ink);margin-bottom:16px}
  .sit-meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .sit-pill{
    display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;
    background:var(--lilac-bg);color:var(--lilac-dark);font-size:11.5px;font-weight:700;letter-spacing:-0.005em;
  }
  .sit-pill.orange{background:var(--orange-bg);color:var(--orange-dark)}
  .sit-pill.gold{background:rgba(252,232,178,0.5);color:#8A5B0E}
  .sit-setting{
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px;
    font-size:15px;line-height:1.65;color:var(--ink);letter-spacing:-0.005em;
  }
  .sit-setting b{color:var(--orange-dark);font-weight:700}
  .sit-hint{
    font-size:13px;color:var(--muted);line-height:1.6;padding:10px 14px;
    background:rgba(252,232,178,0.4);border-radius:10px;margin-bottom:18px;
  }
  .sit-hint b{color:var(--ink-soft);font-weight:700}

  /* PICKER */
  .picker-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .picker-btn{
    padding:12px 18px;border-radius:14px;background:var(--ink);color:#fff;border:none;
    font-size:14px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:8px;letter-spacing:-0.005em;
  }
  .picker-btn:hover{background:#1a1109}
  .picker-btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:700}
  .picker-result{
    flex:1;min-width:240px;padding:14px 18px;border-radius:14px;
    background:linear-gradient(135deg,var(--gold) 0%,#FFC773 100%);
    color:#5A3B12;font-size:15px;font-weight:800;letter-spacing:-0.01em;
    display:none;align-items:center;gap:10px;
  }
  .picker-result.on{display:flex}
  .picker-result .arrow{margin:0 8px;color:#A2752E;font-weight:700}

  /* VOCAB POOL */
  .pool-h{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .pool-title{font-size:18px;font-weight:800;letter-spacing:-0.015em;color:var(--ink)}
  .pool-sub{font-size:12.5px;color:var(--muted);font-weight:500}
  .pool-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .pool-filter{
    padding:7px 13px;border-radius:99px;background:#fff;border:1px solid var(--line);
    font-size:12px;font-weight:700;cursor:pointer;color:var(--ink-soft);
  }
  .pool-filter:hover{border-color:var(--orange)}
  .pool-filter.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .pool-filter.bm.active{background:var(--lilac);border-color:var(--lilac)}

  .vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
  .vocab-card{
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;
    display:flex;flex-direction:column;gap:6px;position:relative;cursor:pointer;
    transition:all 0.15s ease;
  }
  .vocab-card:hover{border-color:var(--orange);transform:translateY(-1px);box-shadow:0 12px 24px -16px rgba(0,0,0,0.12)}
  .vocab-card.suggested{border-color:rgba(240,125,56,0.55);background:linear-gradient(135deg,#FFFDF7 0%,#FFF5E5 100%)}
  .vocab-card.bookmarked{background:linear-gradient(135deg,#FFFDF7 0%,#F4ECFA 100%)}
  .vocab-card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .vocab-day{
    font-size:10px;font-weight:800;letter-spacing:0.08em;color:var(--muted);
    background:var(--paper);padding:3px 7px;border-radius:99px;flex-shrink:0;
  }
  .vocab-card.suggested .vocab-day{background:var(--orange-bg);color:var(--orange-dark)}
  .bm-btn{
    background:transparent;border:none;cursor:pointer;font-size:18px;line-height:1;
    color:var(--line);transition:transform 0.15s ease;padding:2px 4px;
  }
  .bm-btn:hover{transform:scale(1.2)}
  .bm-btn.on{color:var(--lilac)}
  .vocab-en{font-size:16px;font-weight:800;letter-spacing:-0.01em;color:var(--ink);line-height:1.3}
  .vocab-kr{font-size:13px;color:var(--ink-soft);line-height:1.45;font-style:italic}
  .vocab-ex{
    font-size:11.5px;color:var(--muted);line-height:1.55;padding-top:6px;border-top:1px dashed var(--line);
    display:none;
  }
  .vocab-card.expanded .vocab-ex{display:block}
  .vocab-ex b{color:var(--ink-soft);font-weight:700}
  .vocab-suggest-pill{
    position:absolute;top:-6px;right:8px;font-size:9.5px;font-weight:800;letter-spacing:0.05em;
    background:var(--orange);color:#fff;padding:3px 8px;border-radius:99px;
  }

  /* SUGGESTED CHIPS */
  .sit-suggest{margin-top:14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .sit-suggest-label{font-size:11.5px;font-weight:700;color:var(--ink-soft);letter-spacing:-0.005em}
  .sit-suggest-chip{
    padding:6px 11px;border-radius:99px;background:var(--orange-bg);color:var(--orange-dark);
    font-size:12px;font-weight:700;
  }

  /* FOOTER NAV */
  .footer-nav{
    position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
    padding:12px 22px;display:flex;align-items:center;justify-content:center;gap:10px;z-index:30;
  }
  .footer-btn{
    padding:11px 18px;border-radius:99px;background:#fff;border:1px solid var(--line);
    font-size:13px;font-weight:700;cursor:pointer;color:var(--ink);
  }
  .footer-btn:hover{background:var(--paper);border-color:var(--orange)}
  .footer-btn.primary{background:var(--orange);color:#fff;border-color:var(--orange)}
  .footer-btn.primary:hover{background:var(--orange-dark)}
  .footer-status{font-size:11.5px;color:var(--muted);margin:0 6px}

  /* RESPONSIVE */
  @media (max-width:600px){
    .wrap{padding:16px}
    .sit-card{padding:20px}
    .sit-title{font-size:22px}
    .sit-emoji{font-size:42px}
    .names-input{min-width:auto;flex:1}
  }
</style>
</head>
<body>

<div class="proto-banner">
  🧪 PROTOTYPE v2 · Week 3 Live Practice — 상황 중심 + 단어 풀 + 북마크 동기화
</div>

<!-- MEETING INFO BANNER -->
<div class="meeting-info">
  <div class="mi-block">
    <div class="mi-title"><b>WEEK 3</b> · Small talk × Day 11~13</div>
    <div class="mi-date">📅 5월 14일 (목) · 21:00~22:00 <span class="tz">Asia/Seoul</span></div>
  </div>
  <div class="mi-spacer"></div>
  <button class="mi-copy" id="btnCopyMeet">📋 링크 복사</button>
  <a class="mi-meet" href="https://meet.google.com/swc-ritf-wec" target="_blank" rel="noopener">
    🎥 Google Meet 열기 →
  </a>
</div>

<!-- HEADER -->
<header class="hdr">
  <div class="hdr-title">⭐ <b>WEEK 3</b> · Live Practice</div>
  <div class="timer" id="timer">00:00</div>
  <button class="hdr-icon-btn" id="btnTimer">⏯</button>
  <button class="hdr-icon-btn" id="btnTimerReset">↻</button>
  <div class="hdr-spacer"></div>
  <input class="names-input" id="namesInput"
         placeholder="참가자 이름 (쉼표로 구분, 랜덤 뽑기에 사용돼요)"
         value="진송, 수진, Brad, Hera, Jess, Lin, Rachel" />
</header>

<div class="wrap">

  <!-- SITUATION TABS -->
  <div class="sit-nav" id="sitNav"></div>

  <!-- SITUATION CARD -->
  <div class="sit-card" id="sitCard"></div>

  <!-- VOCAB POOL -->
  <div class="pool-h">
    <div class="pool-title">📚 Day 1~13 단어 풀</div>
    <div class="pool-sub">대화에 끼워넣을 수 있는 표현들. 모르는 건 🔖 북마크 — '나' 탭에 자동 동기화</div>
  </div>
  <div class="pool-filters" id="poolFilters"></div>
  <div class="vocab-grid" id="vocabGrid"></div>

</div>

<!-- FOOTER -->
<div class="footer-nav">
  <button class="footer-btn" id="btnPrevSit">⏮ 이전 상황</button>
  <div class="footer-status" id="footerStatus">상황 1 / 4</div>
  <button class="footer-btn primary" id="btnNextSit">다음 상황 ⏭</button>
</div>

<script>
/* ====================================================================
   DATA
==================================================================== */
const ALL_VOCAB = [
  // Day 1
  { day: 1, idx: 0, en: 'Set the stage', kr: '판을 깔다 · 분위기 조성', ex: '오늘 회의는 분기 목표 정렬을 위한 판을 깔아두는 자리입니다.' },
  { day: 1, idx: 1, en: 'Anchor', kr: '기준점 잡다 · 흔들리지 않게 고정', ex: '이번 분기는 매출보다 retention 을 핵심 기준으로 잡읍시다.' },
  { day: 1, idx: 2, en: 'Key driver', kr: '핵심 동인 · 성과를 끌어올리는 진짜 이유', ex: '재방문율이 우리 매출의 진짜 핵심 동인이에요.' },
  // Day 2
  { day: 2, idx: 0, en: 'Gut check', kr: '직감 점검 · 빠른 현실성 체크', ex: '본격 분석 들어가기 전에 직감으로 한 번 점검해봅시다.' },
  { day: 2, idx: 1, en: 'Vetting process', kr: '검증 과정 · 깐깐한 심사', ex: '벤더 선정 전에 검증 절차부터 거쳐야 해요.' },
  { day: 2, idx: 2, en: 'Viability', kr: '실행 가능성 · 진짜 돈이 되나', ex: '이 아이디어는 가능성 있는데 사업성은 좀 더 따져봐야 해요.' },
  // Day 3
  { day: 3, idx: 0, en: 'First pass', kr: '초안 한 번 잡기 · 일단 빠르게', ex: '디테일은 나중에 — 일단 초안으로 한 번 잡아봅시다.' },
  { day: 3, idx: 1, en: 'Get it over the line', kr: '어렵사리 끝내다 · 마침내 넘기기', ex: '마지막 검토만 끝내고 어렵사리 마감 넘기죠.' },
  { day: 3, idx: 2, en: 'Front-load', kr: '초반에 몰아서 하다', ex: '리스크 큰 작업은 초반에 몰아서 처리합시다.' },
  // Day 4
  { day: 4, idx: 0, en: 'Unpack', kr: '풀어서 분석하다', ex: '이 데이터, 한 번 풀어서 분석해볼까요?' },
  { day: 4, idx: 1, en: 'Flesh out', kr: '디테일 채워 구체화', ex: '아이디어 좋아요 — 이번 주 안에 디테일 살을 붙여주세요.' },
  { day: 4, idx: 2, en: 'Drill down', kr: '깊이 파고들다', ex: '여기서 좀 더 깊이 파고들어볼까요?' },
  // Day 5
  { day: 5, idx: 0, en: 'Get buy-in', kr: '적극적 지지 얻기', ex: '진행 전에 임원 buy-in 부터 받아야 해요.' },
  { day: 5, idx: 1, en: 'Call the shots', kr: '결정권 쥐고 진두지휘', ex: '이 프로젝트는 누가 결정권 가지고 진두지휘해요?' },
  { day: 5, idx: 2, en: 'Move in lockstep', kr: '발맞춰 혼연일체', ex: '디자인이랑 엔지니어링이 발맞춰 혼연일체로 가야 해요.' },
  // Day 6
  { day: 6, idx: 0, en: 'Constructive criticism', kr: '건설적인 비판', ex: '이건 인신공격 아니라, 건설적인 비판이에요.' },
  { day: 6, idx: 1, en: 'Sugarcoat', kr: '듣기 좋게 포장', ex: '좋게 포장 안 할게요 — 이번 분기 목표 못 채웠어요.' },
  { day: 6, idx: 2, en: 'Take it offline', kr: '회의 밖에서 따로 얘기', ex: '좋은 포인트지만, 회의 끝나고 따로 얘기하시죠.' },
  // Day 7
  { day: 7, idx: 0, en: "Play devil's advocate", kr: '일부러 반대 입장 · 딴지', ex: '잠깐 딴지 좀 걸어볼게요 — 만약 서버 터지면요?' },
  { day: 7, idx: 1, en: 'Middle ground', kr: '타협점 · 절충안', ex: '속도랑 퀄리티 사이에서 타협점을 찾아야 해요.' },
  { day: 7, idx: 2, en: 'Meet halfway', kr: '서로 양보해서 합의', ex: '가격을 낮춰주시면 저희도 양보해서 물량을 늘리겠습니다.' },
  // Day 8
  { day: 8, idx: 0, en: 'Cut to the chase', kr: '본론으로 바로', ex: '우리 10분밖에 없으니까 본론으로 바로 갑시다.' },
  { day: 8, idx: 1, en: 'Timebox', kr: '제한 시간 두기', ex: '이 논의는 딱 15분으로 시간 박아둡시다.' },
  { day: 8, idx: 2, en: 'Give time back', kr: '남은 시간 돌려주기', ex: '안건 다 다뤘으니, 남은 10분은 돌려드릴게요.' },
  // Day 9
  { day: 9, idx: 0, en: 'Go-to person', kr: '핵심 담당 · 만능 해결사', ex: '데이터 분석 관련은 사라가 우리 만능 해결사예요.' },
  { day: 9, idx: 1, en: 'Heavy lifting', kr: '가장 빡센 핵심 작업', ex: '디자인 쪽 가장 빡센 작업은 에이전시가 맡을 거예요.' },
  { day: 9, idx: 2, en: "Step on someone's toes", kr: '남의 영역 침범', ex: '돕고 싶은데, 담당자 선 넘는 건 싫어요.' },
  // Day 10
  { day: 10, idx: 0, en: 'Elephant in the room', kr: '모두 알지만 꺼내기 꺼리는 문제', ex: '불편하지만 이 문제부터 짚고 갑시다 — 예산이 반토막 났어요.' },
  { day: 10, idx: 1, en: 'Read the room', kr: '분위기 파악 · 눈치', ex: '리스크 큰 아이디어는 분위기 보고 꺼내야 해요.' },
  { day: 10, idx: 2, en: 'Benefit of the doubt', kr: '일단 좋게 믿어주기', ex: '그분 평소 시간 약속 잘 지키니까, 일단 좋게 봐줍시다.' },
  // Day 11

  { day: 12, idx: 1, en: 'Competitive edge', kr: '경쟁 우위 · 우리만의 강점', ex: '빠른 배포 속도가 우리 진짜 경쟁 우위예요.' },
  { day: 12, idx: 2, en: 'Game changer', kr: '판도 뒤집는 혁신', ex: 'AI 자동 설정 기능이 진짜 판 뒤집을 거예요.' },
  // Day 13
  { day: 13, idx: 0, en: 'Pain point', kr: '핵심 불편 사항', ex: '고객이 가장 답답해하는 pain point 부터 잡읍시다.' },
  { day: 13, idx: 1, en: 'Bite the bullet', kr: '눈 딱 감고 정면 돌파', ex: '눈 딱 감고 인증 모듈부터 다시 짭시다.' },
  { day: 13, idx: 2, en: 'Stumbling block', kr: '진행 막는 걸림돌', ex: '예산 승인이 우리 가장 큰 걸림돌이에요.' },
];

const SITUATIONS = [
  {
    emoji: '☕',
    title: '탕비실에서 우연히 마주침',
    setting: '<b>탕비실</b>에서 옆 부서 동료가 커피 내리고 있어요. 가볍게 주말 얘기로 시작해서, "By the way…" 로 자연스럽게 신규 프로젝트 얘기로 흘러가보세요.',
    hint: '<b>Opener</b> (주말 어땠어요?) → <b>By the way</b> → 신규 프로젝트 얘기 → <b>Closer</b> (이따 커피 한 잔)',
    duration: '3~5분',
    role: '2명 (옆 부서 동료끼리)',
    suggested: ['Blank canvas', 'Reinvent the wheel', 'Scratch the surface'],
  },
  {
    emoji: '🎥',
    title: 'Zoom 스탠드업 대기 5분',
    setting: '해외 팀과 Zoom 연결했는데 본인 + 1명만 들어와 있고 나머지 5명 아직 안 들어옴. 어색한 <b>5분 pause</b> 를 small talk 으로 채워보세요. "Quick question for you…" 로 시작하면 자연스러워요.',
    hint: '<b>Quick question</b> → 비즈 화제 하나 → <b>Speaking of</b> → 같은 주제 확장 → <b>Closer</b> (다 들어오셨네요)',
    duration: '5분',
    role: '2명 (같은 팀 동료끼리)',
    suggested: ['Value proposition', 'Competitive edge', 'Game changer'],
  },
  {
    emoji: '✈️',
    title: '컨퍼런스 라운지 재회',
    setting: '업계 컨퍼런스 라운지에서 작년에 잠깐 본 거래처 PM 마주침. <b>flight 30분</b> 남았어요. 가볍게 안부 묻고 본인 팀 근황 얘기하면서 관계 쌓아보세요.',
    hint: '<b>Glad we ran into each other</b> → 팀 근황 → 본인 pain point 한 마디 → <b>Let\'s catch up properly</b>',
    duration: '5분',
    role: '2명 (거래처 PM끼리)',
    suggested: ['Pain point', 'Bite the bullet', 'Stumbling block'],
  },
  {
    emoji: '🎯',
    title: '자유 — Day 1~13 전체 mix',
    setting: '본인이 자주 만나는 <b>실제 비즈 상황</b> 하나를 골라 2-3분 짧게 풀어보세요. 4주간 배운 단어 중에서 자연스럽게 끼울 수 있는 거 1-3개만 골라 써보면 OK.',
    hint: '본인 상황 1줄 설정 → 단어 풀에서 쓸 단어 미리 1-3개 픽 → 자유롭게 대화',
    duration: '2~3분',
    role: '1~3명',
    suggested: [], // 자유 — 다 추천
  },
];

/* ====================================================================
   STATE
==================================================================== */
const state = {
  sit: 0,
  filter: 'all', // 'all' | 'thisweek' | 'lastweek' | 'bookmarks'
  bookmarks: {}, // {'d11-0': true}
  expanded: {},  // {'d11-0': true}
  timer: { start: null, elapsed: 0, running: false },
  pickerResult: null,
};

/* Read bookmarks from main app (yb5_state_cache_v2) */
const LS_KEY = 'yb5_state_cache_v2';
function loadBookmarks() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return {};
    const parsed = JSON.parse(raw);
    const st = parsed.state || parsed || {};
    return st.bookmarks || {};
  } catch(_) { return {}; }
}
function saveBookmarks(bm) {
  try {
    const raw = localStorage.getItem(LS_KEY) || '{}';
    const parsed = JSON.parse(raw);
    const st = parsed.state || parsed || {};
    st.bookmarks = bm;
    if (parsed.state) parsed.state = st;
    else Object.assign(parsed, st);
    localStorage.setItem(LS_KEY, JSON.stringify(parsed));
  } catch(_) {}
}
state.bookmarks = loadBookmarks();

/* ====================================================================
   HELPERS
==================================================================== */
function vkey(v) { return `d${v.day}-${v.idx}`; }
function escapeHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function getNames() {
  return (document.getElementById('namesInput').value || '')
    .split(',').map(s => s.trim()).filter(Boolean);
}

/* ====================================================================
   RENDER — Situation Tabs
==================================================================== */
function renderTabs() {
  const nav = document.getElementById('sitNav');
  nav.innerHTML = '';
  SITUATIONS.forEach((s, i) => {
    const tab = document.createElement('button');
    tab.className = 'sit-tab' + (i === state.sit ? ' active' : '');
    tab.innerHTML = `<span>${s.emoji}</span><span>${escapeHtml(s.title)}</span><span class="num">${i+1}</span>`;
    tab.onclick = () => { state.sit = i; state.pickerResult = null; renderAll(); };
    nav.appendChild(tab);
  });
  document.getElementById('footerStatus').textContent = `상황 ${state.sit + 1} / ${SITUATIONS.length}`;
}

/* ====================================================================
   RENDER — Situation Card
==================================================================== */
function renderCard() {
  const sit = SITUATIONS[state.sit];
  const card = document.getElementById('sitCard');
  const suggestPills = sit.suggested.length
    ? `<div class="sit-suggest">
        <span class="sit-suggest-label">💡 이 상황에 자연스러운 표현:</span>
        ${sit.suggested.map(s => `<span class="sit-suggest-chip">${escapeHtml(s)}</span>`).join('')}
      </div>`
    : `<div class="sit-suggest">
        <span class="sit-suggest-label">💡 단어 풀 전체에서 자유롭게 골라 쓰세요</span>
      </div>`;
  const resultHtml = state.pickerResult
    ? `<div class="picker-result on">🎯 시작 <span class="arrow">→</span> ${escapeHtml(state.pickerResult)}</div>`
    : `<div class="picker-result"></div>`;
  card.innerHTML = `
    <div class="sit-emoji">${sit.emoji}</div>
    <div class="sit-title">${escapeHtml(sit.title)}</div>
    <div class="sit-meta">
      <span class="sit-pill orange">⏱ ${sit.duration}</span>
      <span class="sit-pill">👥 ${sit.role}</span>
      <span class="sit-pill gold">상황 ${state.sit + 1} / ${SITUATIONS.length}</span>
    </div>
    <div class="sit-setting">${sit.setting}</div>
    <div class="sit-hint">💡 진행 힌트: ${sit.hint}</div>
    <div class="picker-row">
      <button class="picker-btn" id="btnPick">🎲 누가 시작?</button>
      <button class="picker-btn secondary" id="btnPickAgain">↻ 다시</button>
      ${resultHtml}
    </div>
    ${suggestPills}
  `;
  document.getElementById('btnPick').onclick = pickRandom;
  document.getElementById('btnPickAgain').onclick = pickRandom;
}

function pickRandom() {
  const names = getNames();
  const sit = SITUATIONS[state.sit];
  // role 에서 "2명" 같은 숫자 추출
  const m = /(\d+)/.exec(sit.role);
  const need = m ? parseInt(m[1], 10) : 2;
  if (names.length < need) {
    state.pickerResult = `이름이 부족해요 (헤더에서 ${need}명 이상 입력)`;
    renderCard();
    return;
  }
  const shuffled = [...names].sort(() => Math.random() - 0.5);
  const picked = shuffled.slice(0, need);
  state.pickerResult = picked.join('  ·  ');
  renderCard();
}

/* ====================================================================
   RENDER — Vocab Pool
==================================================================== */
function renderFilters() {
  const root = document.getElementById('poolFilters');
  const bmCount = Object.values(state.bookmarks).filter(Boolean).length;
  const filters = [
    { id: 'all',       label: '전체',          count: ALL_VOCAB.length },
    { id: 'thisweek',  label: 'Day 11~13',    count: ALL_VOCAB.filter(v => v.day >= 11).length },
    { id: 'lastweek',  label: 'Day 1~10',     count: ALL_VOCAB.filter(v => v.day <= 10).length },
    { id: 'bookmarks', label: `🔖 내 북마크`,   count: bmCount },
  ];
  root.innerHTML = filters.map(f =>
    `<button class="pool-filter ${state.filter === f.id ? 'active' : ''} ${f.id === 'bookmarks' ? 'bm' : ''}"
             data-id="${f.id}">${escapeHtml(f.label)} <span style="opacity:0.55;font-weight:500">${f.count}</span></button>`
  ).join('');
  root.querySelectorAll('[data-id]').forEach(btn => {
    btn.onclick = () => { state.filter = btn.dataset.id; renderAll(); };
  });
}

function renderGrid() {
  const grid = document.getElementById('vocabGrid');
  const sit = SITUATIONS[state.sit];
  const suggested = new Set(sit.suggested);
  let list = ALL_VOCAB;
  if (state.filter === 'thisweek')      list = list.filter(v => v.day >= 11);
  else if (state.filter === 'lastweek') list = list.filter(v => v.day <= 10);
  else if (state.filter === 'bookmarks')list = list.filter(v => state.bookmarks[vkey(v)]);

  // 상황 추천 단어 먼저 정렬
  list = [...list].sort((a, b) => {
    const aS = suggested.has(a.en) ? 0 : 1;
    const bS = suggested.has(b.en) ? 0 : 1;
    if (aS !== bS) return aS - bS;
    return a.day - b.day || a.idx - b.idx;
  });

  if (!list.length) {
    grid.innerHTML = `<div style="grid-column:1/-1;padding:32px;text-align:center;color:var(--muted);font-size:13px;">
      ${state.filter === 'bookmarks' ? '🔖 아직 북마크한 단어가 없어요. 카드 우측 상단 북마크 아이콘 눌러보세요.' : '단어가 없어요.'}
    </div>`;
    return;
  }

  grid.innerHTML = list.map(v => {
    const k = vkey(v);
    const bm = !!state.bookmarks[k];
    const sg = suggested.has(v.en);
    const ex = !!state.expanded[k];
    return `
      <div class="vocab-card ${sg?'suggested':''} ${bm?'bookmarked':''} ${ex?'expanded':''}" data-k="${k}">
        ${sg ? '<span class="vocab-suggest-pill">이 상황에 추천</span>' : ''}
        <div class="vocab-card-h">
          <span class="vocab-day">DAY ${v.day}</span>
          <button class="bm-btn ${bm?'on':''}" data-bm="${k}" title="${bm?'북마크 해제':'북마크'}">${bm?'🔖':'🤍'}</button>
        </div>
        <div class="vocab-en">${escapeHtml(v.en)}</div>
        <div class="vocab-kr">${escapeHtml(v.kr)}</div>
        <div class="vocab-ex"><b>예:</b> ${escapeHtml(v.ex)}</div>
      </div>
    `;
  }).join('');

  // wire bookmark + expand
  grid.querySelectorAll('.bm-btn').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const k = btn.dataset.bm;
      state.bookmarks[k] = !state.bookmarks[k];
      if (!state.bookmarks[k]) delete state.bookmarks[k];
      saveBookmarks(state.bookmarks);
      renderFilters();
      renderGrid();
    };
  });
  grid.querySelectorAll('.vocab-card').forEach(card => {
    card.onclick = () => {
      const k = card.dataset.k;
      state.expanded[k] = !state.expanded[k];
      renderGrid();
    };
  });
}

/* ====================================================================
   TIMER
==================================================================== */
function tickTimer() {
  if (!state.timer.running) return;
  const el = state.timer.elapsed + (Date.now() - state.timer.start);
  const sec = Math.floor(el / 1000);
  const mm = String(Math.floor(sec / 60)).padStart(2,'0');
  const ss = String(sec % 60).padStart(2,'0');
  document.getElementById('timer').textContent = `${mm}:${ss}`;
}
setInterval(tickTimer, 250);
document.getElementById('btnTimer').onclick = () => {
  if (state.timer.running) {
    state.timer.elapsed += Date.now() - state.timer.start;
    state.timer.running = false;
  } else {
    state.timer.start = Date.now();
    state.timer.running = true;
  }
};
document.getElementById('btnTimerReset').onclick = () => {
  state.timer.elapsed = 0; state.timer.running = false;
  document.getElementById('timer').textContent = '00:00';
};

/* ====================================================================
   NAV
==================================================================== */
document.getElementById('btnNextSit').onclick = () => {
  state.sit = (state.sit + 1) % SITUATIONS.length;
  state.pickerResult = null;
  renderAll();
  window.scrollTo({ top: 0, behavior: 'smooth' });
};
document.getElementById('btnPrevSit').onclick = () => {
  state.sit = (state.sit - 1 + SITUATIONS.length) % SITUATIONS.length;
  state.pickerResult = null;
  renderAll();
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

/* ====================================================================
   MEET LINK COPY
==================================================================== */
document.getElementById('btnCopyMeet').onclick = async () => {
  const url = 'https://meet.google.com/swc-ritf-wec';
  try {
    await navigator.clipboard.writeText(url);
    const btn = document.getElementById('btnCopyMeet');
    const original = btn.innerHTML;
    btn.innerHTML = '✓ 복사됨!';
    setTimeout(() => { btn.innerHTML = original; }, 1400);
  } catch(_) {
    alert(url);
  }
};

/* ====================================================================
   INIT
==================================================================== */
function renderAll() {
  renderTabs();
  renderCard();
  renderFilters();
  renderGrid();
}
renderAll();
</script>
