<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YOUBUDDY · 비즈니스 영어 챌린지 5기</title>
<link rel="canonical" href="https://youbuddy.co.kr/" />
<!-- No auto-redirect: auto-redirect caused an infinite loop when the
     browser still had the old root index.html (which bounced to /5th/)
     cached. Static link-only page breaks the cycle. -->
<style>
  html, body { margin:0; padding:0; background:#FFFDF7; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif; color:#2A1F14; }
  .wrap { min-height:100vh; display:grid; place-items:center; text-align:center; padding:24px; }
  .card { padding:32px 28px; border:1px solid #E7DDC8; border-radius:22px; background:#fff; max-width:380px; box-shadow: 0 8px 28px rgba(42,31,20,0.06); }
  .badge { display:inline-block; padding:6px 12px; border-radius:999px; background:#FCE4D0; color:#C95721; font-size:11px; font-weight:700; letter-spacing:0.1em; }
  h1 { margin:16px 0 6px; font-size:22px; letter-spacing:-0.02em; }
  p { margin:6px 0 0; font-size:13px; color:#6B5A40; line-height:1.55; }
  a.cta { margin-top:20px; display:inline-block; padding:13px 24px; background:#F07D38; color:#FFFDF7; text-decoration:none; border-radius:999px; font-weight:700; font-size:14px; }
  a.cta:hover { background:#E06A25; }
  .hint { margin-top:16px; font-size:11px; color:#9C8A63; font-family: "JetBrains Mono", monospace; letter-spacing:0.04em; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="badge">YOUBUDDY · 5기 챌린지</div>
    <h1>페이지가 메인으로 이동했어요</h1>
    <p>5기 챌린지는 이제 <b>youbuddy.co.kr</b> 루트 주소에서 바로 열 수 있어요.</p>
    <a class="cta" href="/">메인으로 이동 →</a>
    <div class="hint">youbuddy.co.kr</div>
  </div>
</div>
</body>
</html>
