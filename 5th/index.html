<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YouBuddy · 비즈니스 영어 챌린지 5기 학습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
<style>
:root {
  --ivory: #FBF7F0;
  --cream: #FFFDF7;
  --paper: #F5EEE0;
  --ink: #2A1F14;
  --ink-soft: #5A4A36;
  --muted: #9A8B73;
  --line: #E7DDC8;
  --line-soft: #EFE7D4;
  --orange: #E8743C;
  --orange-dark: #C95721;
  --orange-soft: #FAE3D1;
  --orange-ghost: #FDF0E2;
  --green: #6B8E4E;
  --green-soft: #DFEAD0;
  --lilac: #A98BB8;
  --lilac-soft: #EEE6F3;
  --gold: #C89B3C;
  --radius-s: 8px;
  --radius-m: 14px;
  --radius-l: 22px;
  --radius-xl: 32px;
  --font-sans: 'Pretendard Variable', Pretendard, 'Noto Sans KR', system-ui, -apple-system, sans-serif;
  --font-kor: 'Pretendard Variable', Pretendard, 'Noto Sans KR', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  --font-serif: 'Pretendard Variable', Pretendard, 'Noto Sans KR', system-ui, -apple-system, sans-serif;
  --shadow-s: 0 1px 0 rgba(42,31,20,0.04), 0 2px 6px -3px rgba(42,31,20,0.08);
  --shadow-m: 0 2px 0 rgba(42,31,20,0.03), 0 10px 24px -12px rgba(42,31,20,0.15);
  --shadow-l: 0 30px 60px -28px rgba(42,31,20,0.24);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--ivory);
  color: var(--ink);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  overflow-x: hidden;
}
button { font-family: inherit; cursor: pointer; }
input, textarea, select { font-family: inherit; }

.app {
  min-height: 100vh;
  max-width: 480px;
  margin: 0 auto;
  background: var(--ivory);
  position: relative;
  box-shadow: 0 0 0 1px var(--line-soft), 0 40px 80px -30px rgba(42,31,20,0.18);
  padding-bottom: 110px;
}
@media (min-width: 900px) {
  body { padding: 24px 0 48px; }
  .app { border-radius: 36px; min-height: calc(100vh - 72px); }
}
.page { padding: 20px 20px 24px; }

/* typography */
.kicker { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.serif { font-family: var(--font-serif); font-style: normal; font-weight: 700; letter-spacing: -0.01em; }
.h1 { font-size: 24px; font-weight: 700; line-height: 1.25; letter-spacing: -0.02em; margin: 0; word-break: keep-all; }
.h2 { font-size: 19px; font-weight: 700; line-height: 1.25; letter-spacing: -0.015em; margin: 0; word-break: keep-all; }
.h3 { font-size: 15px; font-weight: 700; margin: 0; word-break: keep-all; }
.t-body { font-size: 14px; line-height: 1.55; color: var(--ink-soft); margin: 0; word-break: keep-all; }
.t-small { font-size: 12px; color: var(--muted); word-break: keep-all; }
.mono { font-family: var(--font-mono); }

/* topbar */
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 4px 16px; }
.brand { display: flex; align-items: center; gap: 10px; }
.logo-mark {
  width: 32px; height: 32px; border-radius: 10px;
  background: var(--ink); color: var(--ivory);
  display: grid; place-items: center;
  font-weight: 800; font-family: var(--font-serif); font-style: normal;
}
.brand-name { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
.brand-name small { font-family: var(--font-mono); font-size: 10px; color: var(--muted); margin-left: 6px; font-weight: 500; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 12px;
  background: var(--cream); border: 1px solid var(--line);
  display: grid; place-items: center; color: var(--ink);
  transition: all 120ms;
}
.icon-btn:hover { background: var(--paper); border-color: var(--ink-soft); }

/* cards */
.card {
  background: var(--cream);
  border: 1px solid var(--line);
  border-radius: var(--radius-l);
  padding: 18px;
}
.card-flat { background: var(--paper); border: none; }
.card-ink { background: var(--ink); color: var(--cream); border-color: var(--ink); }
.card-ink .t-body, .card-ink .t-small { color: rgba(251,247,240,0.7); }
.card-lilac { background: linear-gradient(155deg, #C2A9D1 0%, #A98BB8 100%); color: #fff; border: none; }
.card-lilac .t-body, .card-lilac .t-small { color: rgba(255,255,255,0.82); }
.card-orange { background: linear-gradient(155deg, #F08B56, #E8743C 55%, #D45F23); color: #fff; border: none; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 18px; border-radius: 999px;
  font-weight: 600; font-size: 14px; letter-spacing: -0.005em;
  border: none; transition: transform 120ms, background 150ms, color 150ms;
}
.btn:active { transform: none; }
.btn-primary { background: var(--orange); color: #fff; }
.btn-primary:hover { background: var(--orange-dark); }
.btn-primary:disabled { background: var(--paper); color: var(--muted); cursor: not-allowed; }
.btn-ink { background: var(--ink); color: var(--cream); }
.btn-ghost { background: var(--cream); color: var(--ink); border: 1px solid var(--line); }
.btn-ghost:hover { background: var(--paper); }
.btn-lilac { background: var(--lilac); color: #fff; }
.btn-lilac:hover { background: #8f6ea3; }
.btn-lg { padding: 15px 22px; font-size: 15px; }
.btn-sm { padding: 8px 14px; font-size: 12.5px; }
.btn-full { width: 100%; }

/* badges */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 999px;
  font-family: var(--font-mono); font-size: 10px; font-weight: 500;
  letter-spacing: 0.04em; text-transform: uppercase;
  background: var(--paper); color: var(--ink-soft);
}
.badge-orange { background: var(--orange-ghost); color: var(--orange-dark); }
.badge-green { background: var(--green-soft); color: var(--green); }
.badge-lilac { background: var(--lilac-soft); color: #7b5ea7; }
.badge-ink { background: var(--ink); color: var(--cream); }

/* bars */
.bar { height: 6px; background: var(--line-soft); border-radius: 999px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--ink); border-radius: 999px; transition: width 600ms cubic-bezier(.2,.9,.3,1); }
.bar.orange > span { background: var(--orange); }
.bar.lilac > span { background: var(--lilac); }

/* tabbar */
.tabbar {
  position: fixed; bottom: 14px; left: 0; right: 0;
  display: flex; justify-content: center;
  z-index: 40; pointer-events: none;
}
.tabbar-inner {
  display: flex; gap: 2px;
  background: var(--ink); color: var(--cream);
  padding: 6px; border-radius: 999px;
  box-shadow: var(--shadow-l);
  pointer-events: auto;
  justify-content: center;
}
@media (max-width: 640px) {
  .tabbar-inner {
    width: min(92vw, 420px);
  }
}
.tab {
  padding: 10px 14px; border-radius: 999px;
  background: transparent; color: rgba(251,247,240,0.6); border: none;
  font-weight: 600; font-size: 12px;
  display: flex; align-items: center; gap: 6px;
  transition: all 180ms;
  position: relative;
  white-space: nowrap;
  flex-shrink: 0;
}
.tab > span { white-space: nowrap; }
.tab.active { background: var(--cream); color: var(--ink); }
.tab:hover { color: var(--cream); }
.tab.active:hover { color: var(--ink); }
.tab.locked { opacity: 0.55; }
@media (max-width: 400px) {
  .tabbar-inner { padding: 5px; gap: 0; }
  .tab { padding: 9px 10px; font-size: 11px; gap: 4px; }
}
@media (max-width: 340px) {
  .tab { padding: 8px 8px; font-size: 10.5px; gap: 3px; }
}
.tab .lock-dot {
  position: absolute; top: 2px; right: 4px;
  width: 6px; height: 6px; border-radius: 50%; background: var(--lilac);
}

/* progress dots — same palette as the tile grid */
.progress-dots { display: grid; grid-template-columns: repeat(20, 1fr); gap: 2px; }
.progress-dots span { aspect-ratio: 1; border-radius: 2px; background: var(--line-soft); min-width: 10px; min-height: 10px; }
.progress-dots span.on { background: var(--orange); }
.progress-dots span.on.late { background: var(--ink); }
.progress-dots span.today { background: var(--orange); box-shadow: 0 0 0 2px var(--orange-ghost); }
.progress-dots span.missed { background: rgba(154,139,115,0.32); }
.progress-dots span.locked { background: rgba(231,221,200,0.45); }
.card-ink .progress-dots span { background: rgba(251,247,240,0.12); }
.card-ink .progress-dots span.on { background: var(--orange); }
.card-ink .progress-dots span.on.late { background: var(--cream); }
.card-ink .progress-dots span.today { background: var(--orange); }
.card-ink .progress-dots span.missed { background: rgba(251,247,240,0.22); }
.card-ink .progress-dots span.locked { background: rgba(251,247,240,0.06); }

/* correct-answer green flash — contained to the quiz card */
.correct-flash {
  position: absolute; inset: 0; z-index: 5;
  background: rgba(39, 179, 126, 0.92);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 96px; font-weight: 900;
  pointer-events: none;
  border-radius: inherit;
  animation: correctFlashFade 600ms cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
}
/* Fallback when no quiz card is found — still constrained to center, not full-screen */
.correct-flash.correct-flash-floating {
  position: fixed; inset: auto;
  top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: min(80vw, 320px); height: min(80vw, 320px);
  border-radius: 32px;
}
@keyframes correctFlashFade {
  0%   { opacity: 0; transform: scale(0.85); }
  25%  { opacity: 1; transform: scale(1); }
  70%  { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(1.05); }
}

/* leaderboard */
.rank-row {
  display: grid; grid-template-columns: 28px 36px 1fr auto;
  gap: 12px; align-items: center;
  padding: 10px 12px; border-radius: var(--radius-m);
  transition: background 180ms;
}
.rank-row.me { background: var(--orange-ghost); box-shadow: inset 0 0 0 1px var(--orange-soft); }
.rank-num { font-family: var(--font-serif); font-style: normal; font-size: 17px; color: var(--ink-soft); text-align: right; }
.rank-num.top1 { color: var(--orange); font-weight: 600; }
.avatar {
  width: 36px; height: 36px; border-radius: 12px;
  background: var(--paper); color: var(--ink);
  display: grid; place-items: center; font-weight: 700; font-size: 12px;
  flex-shrink: 0;
}
.avatar.orange { background: var(--orange); color: #fff; }
.avatar.ink { background: var(--ink); color: var(--cream); }
.avatar.cream { background: var(--cream); color: var(--ink); border: 1px solid var(--line); }
.streak-pill { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--ink-soft); }

/* weeks */
.week-card {
  background: var(--cream); border: 1px solid var(--line);
  border-radius: var(--radius-l); padding: 16px;
  transition: all 180ms; cursor: pointer;
}
.week-card:hover { transform: none; box-shadow: var(--shadow); }
.week-card.current { background: var(--ink); color: var(--cream); border-color: var(--ink); }
.week-card.current .t-small, .week-card.current .t-body { color: rgba(251,247,240,0.65); }
.week-card.current .bar { background: rgba(251,247,240,0.15); }
.week-card.current .bar > span { background: var(--orange); }
.day-chip-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.day-chip {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--paper); color: var(--ink);
  display: grid; place-items: center;
  font-family: var(--font-mono); font-size: 11px; font-weight: 600;
  border: 1px solid transparent; transition: all 140ms;
  cursor: pointer; position: relative;
}
.day-chip:hover:not(.locked) { transform: none; }
.day-chip.done { background: var(--ink); color: var(--cream); }
.day-chip.today { background: var(--orange); color: #fff; box-shadow: 0 0 0 3px var(--orange-ghost); }
.day-chip.locked { background: transparent; color: var(--muted); border-color: var(--line); cursor: not-allowed; }
.week-card.current .day-chip { background: rgba(251,247,240,0.08); color: var(--cream); }
.week-card.current .day-chip.done { background: var(--cream); color: var(--ink); }
.week-card.current .day-chip.today { background: var(--orange); color: #fff; }
.week-card.current .day-chip.locked { background: transparent; color: rgba(251,247,240,0.3); border-color: rgba(251,247,240,0.12); }

/* day note */
.step-head { display: flex; align-items: center; gap: 10px; }
.step-num {
  width: 26px; height: 26px; border-radius: 9px;
  background: var(--ink); color: var(--cream);
  display: grid; place-items: center;
  font-family: var(--font-serif); font-style: normal; font-size: 13px; font-weight: 600;
}
.vocab-card {
  background: var(--cream); border: 1px solid var(--line);
  border-radius: var(--radius-l); padding: 18px; position: relative;
}
.vocab-num { position: absolute; top: 14px; right: 16px; font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
.eng-word {
  font-family: var(--font-sans); font-style: normal;
  font-size: 26px; color: var(--orange); line-height: 1.12; letter-spacing: -0.015em;
  font-weight: 800;
  margin: 0 0 6px;
}
.kor-def { font-size: 13px; color: var(--ink-soft); margin: 0; }
.vocab-example {
  background: var(--paper); border-radius: var(--radius-m);
  padding: 12px 14px; margin-top: 12px;
  font-size: 13.5px; line-height: 1.55; color: var(--ink);
}
.vocab-example b { color: var(--orange-dark); font-weight: 600; }
.vocab-example .translate { display: block; margin-top: 6px; color: var(--ink-soft); font-size: 12.5px; }
.syn-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.syn-chip { font-family: var(--font-mono); font-size: 11px; padding: 3px 9px; border-radius: 999px; background: var(--orange-ghost); color: var(--orange-dark); }

.target-banner {
  background: var(--paper); border-radius: var(--radius-l);
  padding: 18px; position: relative; overflow: hidden;
}
.target-banner::before {
  content: ""; position: absolute; right: -30px; top: -30px;
  width: 120px; height: 120px; border-radius: 50%;
  background: radial-gradient(circle, rgba(232,116,60,0.15), transparent 70%);
}
.quote-mark { font-family: var(--font-serif); font-style: normal; font-size: 44px; color: var(--orange); line-height: 0.5; height: 18px; }

.sentence-input {
  width: 100%; background: var(--cream);
  border: 1px solid var(--line); border-radius: var(--radius-m);
  padding: 12px 14px; font-size: 14px; line-height: 1.5;
  resize: vertical; min-height: 60px; color: var(--ink);
  transition: border-color 160ms, background 160ms;
}
.sentence-input:focus { outline: none; border-color: var(--orange); background: #fff; box-shadow: 0 0 0 3px var(--orange-ghost); }
.sentence-input::placeholder { color: var(--muted); }
.ai-feedback {
  margin-top: 14px;
  background: linear-gradient(135deg, #FFF3E3 0%, #FDE2C6 100%);
  border: 1px solid var(--orange-soft);
  border-radius: var(--radius-m);
  padding: 14px;
  font-size: 13px;
  line-height: 1.55;
  color: var(--ink);
}
.ai-head {
  display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--orange-dark); font-weight: 600;
}
.ai-corrected {
  font-family: var(--font-serif); font-style: normal; font-size: 18px;
  color: var(--ink); margin: 4px 0 8px; line-height: 1.35;
}
.ai-feedback ins { background: var(--green-soft); color: var(--green); text-decoration: none; padding: 1px 3px; border-radius: 3px; }
.ai-feedback del { background: #F5D8CE; color: var(--orange-dark); text-decoration: line-through; padding: 1px 3px; border-radius: 3px; }

/* verify */
.verify-step {
  background: var(--cream); border: 1px solid var(--line);
  border-radius: var(--radius-l); padding: 14px;
  display: flex; align-items: center; gap: 12px;
  transition: all 200ms;
}
.verify-step.done { background: var(--green-soft); border-color: var(--green-soft); }
.vs-icon {
  width: 40px; height: 40px; border-radius: 12px;
  background: var(--paper); display: grid; place-items: center; flex-shrink: 0;
  font-size: 18px;
}
.verify-step.done .vs-icon { background: var(--green); color: #fff; }

.check-toggle {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--cream); border: 1.5px solid var(--line);
  display: grid; place-items: center; cursor: pointer;
  flex-shrink: 0; transition: all 140ms;
}
.check-toggle.on { background: var(--green); border-color: var(--green); color: #fff; }

/* premium */
.premium-banner {
  background: linear-gradient(155deg, #C2A9D1, #A98BB8 55%, #8F6EA3);
  color: #fff; border-radius: var(--radius-l);
  padding: 20px; position: relative; overflow: hidden;
}
.premium-banner::before {
  content: ""; position: absolute; right: -40px; top: -40px;
  width: 160px; height: 160px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.22), transparent 65%);
}
.locked-panel {
  background: var(--cream); border: 1.5px dashed var(--lilac);
  border-radius: var(--radius-l); padding: 24px 20px;
  text-align: center;
}
.locked-panel .lock-icon {
  width: 60px; height: 60px; border-radius: 18px;
  background: var(--lilac-soft); color: var(--lilac);
  display: grid; place-items: center; margin: 0 auto 14px;
  font-size: 28px;
}

.meeting-card {
  background: var(--cream); border: 1px solid var(--line);
  border-radius: var(--radius-l); padding: 16px;
  display: flex; gap: 14px; align-items: flex-start;
}
.meeting-card.upcoming { border-color: var(--lilac); background: linear-gradient(145deg, #fff 55%, var(--lilac-soft)); }
.meeting-card.done { opacity: 0.65; }
.meeting-date {
  width: 52px; flex-shrink: 0; text-align: center;
  background: var(--paper); border-radius: var(--radius-m);
  padding: 8px 4px;
}
.meeting-date .md-mon { font-family: var(--font-mono); font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.meeting-date .md-day { font-family: var(--font-serif); font-style: normal; font-size: 22px; color: var(--ink); }
.meeting-card.upcoming .meeting-date { background: #fff; }
.meeting-card.upcoming .meeting-date .md-day { color: var(--lilac); }
.premium-calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 6px;
}
.premium-calendar-cell {
  min-width: 0;
  aspect-ratio: 1;
  border-radius: 14px;
  padding: 10px 6px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
@media (max-width: 480px) {
  .premium-calendar-grid { gap: 4px; }
  .premium-calendar-cell {
    border-radius: 11px;
    padding: 7px 4px;
  }
}

/* quiz */
.quiz-card {
  background: var(--cream); border: 1px solid var(--line);
  border-radius: var(--radius-l); padding: 18px;
}
.quiz-question {
  font-family: var(--font-serif); font-style: normal;
  font-size: 22px; color: var(--ink); line-height: 1.3; margin: 0 0 14px;
}
.quiz-option {
  display: block; width: 100%; text-align: left;
  padding: 12px 14px; border-radius: var(--radius-m);
  background: var(--paper); border: 1.5px solid transparent;
  font-size: 14px; color: var(--ink); margin-top: 8px;
  transition: all 140ms; font-family: inherit;
}
.quiz-option:hover { background: var(--orange-ghost); }
.quiz-option.selected { background: var(--orange-ghost); border-color: var(--orange); }
.quiz-option.correct { background: var(--green-soft); border-color: var(--green); }
.quiz-option.wrong { background: #F5D8CE; border-color: var(--orange-dark); }

/* cert */
.cert-wrap {
  background: linear-gradient(165deg, #FFFDF7 0%, #FAE3D1 100%);
  border: 2px solid var(--orange-soft);
  border-radius: var(--radius-xl); padding: 28px 22px;
  text-align: center; position: relative; overflow: hidden;
}
.cert-seal {
  width: 72px; height: 72px; border-radius: 50%;
  background: var(--orange); color: #fff;
  display: grid; place-items: center;
  font-family: var(--font-serif); font-style: normal;
  font-size: 28px; margin: 0 auto 16px;
  box-shadow: 0 8px 20px -6px rgba(232,116,60,0.4);
}
.cert-title { font-family: var(--font-serif); font-style: normal; font-size: 28px; color: var(--ink); margin: 0 0 6px; }
.cert-name { font-size: 20px; font-weight: 700; color: var(--orange-dark); margin: 8px 0; }
.cert-progress-text { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-top: 12px; }

/* checkboard — horizontal scroll so days 1-20 stay uniform size regardless of
   viewport width. The name column is sticky so the left side stays pinned while
   the learner swipes the day cells. */
.checkboard-wrap {
  background: var(--cream); border: 1px solid var(--line);
  border-radius: var(--radius-l); padding: 14px 10px 14px 14px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
}
.checkboard {
  display: grid;
  /* Fixed-width day cells keep 1-20 visually identical at any screen width. */
  grid-template-columns: 96px repeat(20, 24px);
  gap: 3px;
  align-items: center;
  font-family: var(--font-mono);
  font-size: 10px;
  min-width: max-content;
}
.cb-header { color: var(--muted); font-weight: 500; text-align: center; padding: 4px 0; letter-spacing: 0.04em; }
.cb-header.today-col { color: var(--orange); font-weight: 700; }
.cb-name {
  display: flex; align-items: center; gap: 6px;
  font-family: var(--font-sans); font-size: 10.5px; font-weight: 500; color: var(--ink);
  /* padding-right keeps the name + P badge from visually touching the Day 1 cell. */
  padding-right: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
  position: sticky; left: 0; z-index: 1;
  background: var(--cream);
}
.cb-header-name {
  position: sticky; left: 0; z-index: 2;
  background: var(--cream);
  padding-right: 10px;
}
.cb-name .tiny-av { width: 18px; height: 18px; border-radius: 5px; background: var(--paper); display: grid; place-items: center; font-size: 8px; font-weight: 700; flex-shrink: 0; }
.cb-name .tiny-av.orange { background: var(--orange); color: #fff; }
.cb-name .tiny-av.ink { background: var(--ink); color: var(--cream); }
/* Checkboard tiles — palette synced with dayStatus():
   .on        = 정상 인증 (주황)
   .on.late   = 지각 인증 (까망)
   .today     = 오늘 미인증 (주황 링)
   .missed    = 놓친 Day (무톤 베이지 실선)
   .locked    = 아직 안 열림 (연한 실선, 거의 비어보임)
   (default)  = 'open' = 내일 미리 풀기 슬롯 (페이퍼 크림) */
.cb-cell { width: 24px; height: 24px; border-radius: 4px; background: var(--paper); border: 1px solid rgba(231,221,200,0.7); }
.cb-cell.on { background: var(--orange); border-color: var(--orange); }
.cb-cell.on.late { background: var(--ink); border-color: var(--ink); }
.cb-cell.today { background: var(--orange); box-shadow: 0 0 0 2px var(--orange-ghost); border-color: var(--orange); }
.cb-cell.missed { background: rgba(154,139,115,0.18); border: 1px solid rgba(154,139,115,0.34); }
.cb-cell.locked { background: var(--cream); border: 1px solid rgba(231,221,200,0.45); }
.cb-row-me .cb-name { background: var(--orange-ghost); }
.cb-row-me { background: var(--orange-ghost); border-radius: 6px; padding: 0 2px; margin: 0 -2px; }
/* Overrides so the sticky "me" name cell keeps its right padding (was bleeding into Day 1). */
.cb-name.cb-row-me { padding: 0 10px 0 2px; margin-right: 0; }

/* modal */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(42,31,20,0.48);
  display: grid; place-items: center; z-index: 100; padding: 20px;
  animation: fadeIn 200ms;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--ivory); border-radius: var(--radius-xl);
  max-width: 420px; width: 100%; padding: 24px;
  box-shadow: var(--shadow-l);
  animation: popIn 260ms cubic-bezier(.2,.9,.3,1.1);
}
@keyframes popIn { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
.input {
  width: 100%; background: var(--cream);
  border: 1px solid var(--line); border-radius: var(--radius-m);
  padding: 12px 14px; font-size: 14px; color: var(--ink);
}
.input:focus { outline: none; border-color: var(--orange); background: #fff; }

/* toast */
.toast {
  position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--cream);
  padding: 12px 18px; border-radius: 999px;
  font-size: 13px; font-weight: 500; z-index: 80;
  box-shadow: var(--shadow-l);
  max-width: 360px; text-align: center;
}

  position: relative; overflow: hidden;
  padding: 22px 22px 20px; border-radius: 26px;
  background: linear-gradient(165deg, #F4ECFA 0%, #FEF3E2 55%, #FFFDF7 100%);

}
.mn-hero::before {

  pointer-events: none;
}
.mn-hero::after {
  content: ''; position: absolute; right: 30px; bottom: -40px;
  width: 120px; height: 120px; border-radius: 50%;
  background: radial-gradient(circle, rgba(236,112,42,0.14) 0%, transparent 70%);
  pointer-events: none;
}
.mn-date-tile {
  flex-shrink: 0; width: 64px; padding: 10px 8px;
  border-radius: 16px; color: #fff; text-align: center;
  background: linear-gradient(160deg, #C9A8DD 0%, #A98BB8 100%);
  box-shadow: 0 10px 22px -12px rgba(169,139,184,0.85);
}
.mn-date-mon { font-size: 10px; letter-spacing: 0.14em; opacity: 0.9; font-weight: 600; }
.mn-date-day { font-size: 28px; font-weight: 800; line-height: 1; margin-top: 3px; letter-spacing: -0.02em; }
.mn-date-tag { font-size: 10px; letter-spacing: 0.1em; margin-top: 5px; opacity: 0.9; font-weight: 600; }

.mn-seg {
  display: inline-flex; gap: 4px; padding: 4px;
  background: rgba(236,220,200,0.38); border-radius: 14px;
  margin-top: 20px;
}
.mn-seg button {
  appearance: none; border: none; background: transparent;
  padding: 8px 14px; border-radius: 11px; cursor: pointer;
  font-family: inherit; font-size: 13px; font-weight: 600; color: var(--muted);
  transition: all 180ms;
}
.mn-seg button.active {
  background: #fff; color: var(--ink);
  box-shadow: 0 6px 14px -8px rgba(52,34,22,0.22), 0 1px 2px rgba(52,34,22,0.04);
}

.mn-section-label {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px; border-radius: 999px;
  background: rgba(255,253,247,0.9); border: 1px solid rgba(231,221,200,0.7);
  font-size: 11px; letter-spacing: 0.12em; font-weight: 700; color: var(--orange-dark);
  text-transform: uppercase;
}

.mn-editor {
  width: 100%; background: #fff;

}
.mn-editor:focus { outline: none; border-color: var(--lilac); box-shadow: 0 0 0 4px rgba(169,139,184,0.12); }
.mn-editor::placeholder { color: #B9A890; font-style: normal; }

.mn-quick-row { display: flex; flex-wrap: wrap; gap: 8px; }
.mn-chip {
  appearance: none; border: 1px solid rgba(236,112,42,0.25);
  background: rgba(253,226,198,0.35); color: var(--orange-dark);
  padding: 6px 11px; border-radius: 999px; cursor: pointer;
  font-family: inherit; font-size: 12px; font-weight: 600;

}
.mn-chip:hover { background: var(--orange-ghost); transform: none; }

.mn-ai-card {
  position: relative;
  border-radius: 22px; padding: 18px;
  background: linear-gradient(160deg, #FFF3E3 0%, #FDE2C6 60%, #F4ECFA 100%);

  box-shadow: 0 12px 30px -20px rgba(236,112,42,0.35);
}
.mn-ai-head {
  display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
}
.mn-ai-badge {

.mn-ai-title { font-size: 14px; font-weight: 700; color: var(--ink); }

}

.peer-ticker {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);

  -webkit-backdrop-filter: saturate(140%) blur(6px);

  padding: 7px 12px 7px 10px; border-radius: 999px;

  box-shadow: 0 8px 22px -14px rgba(52,34,22,0.25);
  border: 1px solid rgba(231,221,200,0.75);

  cursor: pointer;
}
.peer-ticker.out { animation: peerSlideOut 240ms ease forwards; }
.peer-ticker .pt-avatar {
  width: 22px; height: 22px; border-radius: 50%;

.peer-ticker .pt-text { min-width: 0; flex: 1; display: flex; align-items: center; gap: 6px; }

.peer-ticker .pt-body { font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; color: var(--ink); }
.peer-ticker .pt-pulse {

  animation: pulseDot 1.6s ease-in-out infinite;

@keyframes peerSlideIn {
  from { transform: translateX(-50%) translateY(-24px); opacity: 0; }
  to { transform: translateX(-50%) translateY(0); opacity: 1; }
}
@keyframes peerSlideOut {
  from { transform: translateX(-50%) translateY(0); opacity: 1; }
  to { transform: translateX(-50%) translateY(-24px); opacity: 0; }
}
@keyframes pulseDot {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.35); opacity: 0.5; }
}

/* utils */
.stack > * + * { margin-top: 12px; }

@keyframes fall { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 100% { transform: translate(var(--x, 0), 110vh) rotate(var(--r, 360deg)); opacity: 0.3; } }

/* Bind the logged-in user to the correct MEMBERS identity.
   - If state.name matches a roster entry by name → that roster entry becomes "me" (me: true),
     and the placeholder me slot is marked hidden so we don't duplicate rows.
   - Otherwise (generic code user not in roster) → keep the placeholder as the me slot,
     renamed to state.name.
   Call this after state hydration and after __finishOnboarding. */
function bindMeToMembers() {
  const placeholder = MEMBERS.find((m) => m.id === 'me');
  if (!placeholder) return;
  const myProgress = completedCount();
  const myStreak = localStreakCount();
  // reset transient flags
  MEMBERS.forEach((m) => { if (m.id !== 'me') m.me = false; });
  placeholder.hidden = false;
  placeholder.isOperator = false;

  const nm = (state.name || '').trim();
  if (!nm) {

    placeholder.progress = myProgress;
    placeholder.streak = myStreak;

  }

  const real = MEMBERS.find((m) => m.id !== 'me' && m.name === nm);
  if (real) {
    // Existing roster member logged in → promote that row to "me", hide placeholder
    real.me = true;

    real.streak = myStreak;
    placeholder.me = false;
    placeholder.hidden = true;
    placeholder.name = nm;

  placeholder.me = true;
  placeholder.progress = myProgress;
  placeholder.streak = myStreak;

/* Demo seed — pre-fills a few days (1, 3, 5 late, 7) so the design can be previewed
   with visible progress. Only applied if nothing persisted yet (first visit). */
function seedDemoState(s) {
  const mark = (d, lateOffset = 0) => {
    s.verified = s.verified || {};
    s.verified_at = s.verified_at || {};
    s.submitted = s.submitted || {};
    s.sentences = s.sentences || {};
    s.verified['d' + d] = true;
    // Compute scheduled date
    const scheduled = dayDate(d);
    const mark = new Date(scheduled);
    mark.setDate(mark.getDate() + lateOffset);
    const y = mark.getFullYear();
    const m = String(mark.getMonth() + 1).padStart(2, '0');
    const day = String(mark.getDate()).padStart(2, '0');
    s.verified_at['d' + d] = `${y}-${m}-${day}`;
    // Submit 3 sentences + sample sentences per word
    const d_ = typeof getDay === 'function' ? getDay(d) : null;
    if (d_ && d_.words) {
      d_.words.forEach((w, i) => {
        const key = `d${d}-${i}`;
        s.submitted[key] = true;
        // Seed with the day's own example sentence so demo content automatically follows
        // whatever CHALLENGE.weeks[].days[].words[].ex_en currently is.
        if (!s.sentences[key]) s.sentences[key] = w.ex_en || `I want to use ${w.en} in today's meeting.`;
      });
    }
  };
  mark(1, 0);         // 정시
  mark(3, 0);         // 정시
  mark(5, 2);         // 지각 (자정 넘어서)
  mark(7, 0);         // 정시
  s.currentDay = Math.max(s.currentDay || 1, 8);
  return s;
}

// Copy text to clipboard. Falls back to a temporary textarea for
// iOS Safari / old browsers where navigator.clipboard.writeText is blocked.
function copyToClipboard(text, sourceBtn) {
  const value = String(text || '');
  const flashOk = () => {
    if (sourceBtn) {
      const before = sourceBtn.innerHTML;
      sourceBtn.innerHTML = '✓ 복사됨';
      sourceBtn.disabled = true;
      setTimeout(() => {
        sourceBtn.innerHTML = before;
        sourceBtn.disabled = false;
      }, 1400);
    }
    try { showToast('📋 문장이 복사됐어요'); } catch (e) {}
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(value).then(flashOk).catch(() => fallbackCopy(value, flashOk));
  } else {
    fallbackCopy(value, flashOk);
  }
}
function fallbackCopy(text, cb) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '-9999px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    if (cb) cb();
  } catch (e) { console.warn('copy fallback failed', e); }
}

function escapeHtml(str='') {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Word-level diff. Produces inline <del>/<ins> spans for only the tokens that
// changed, instead of striking through the entire original sentence. Uses a
// classic LCS walk so the unchanged words stay black/neutral.
function buildWordDiffHtml(original, corrected) {
  const a = String(original || '').trim();
  const b = String(corrected || '').trim();
  if (!a) return escapeHtml(b);
  if (!b) return `<del>${escapeHtml(a)}</del>`;
  if (a === b) return escapeHtml(b);

  // Split into tokens but keep whitespace + punctuation as separate units so
  // "we'll" vs "we will" shows the right piece as changed.
  const tokenize = (s) => s.match(/[A-Za-z0-9'’]+|[^A-Za-z0-9\s]|\s+/g) || [];
  const A = tokenize(a);
  const B = tokenize(b);

  // Normalize (case + smart-quote + whitespace) for matching only; render original casing.
  const norm = (t) => {
    if (/^\s+$/.test(t)) return ' ';
    return t.toLowerCase().replace(/[’]/g, "'");
  };

  const m = A.length, n = B.length;
  // LCS table
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--) {
    for (let j = n - 1; j >= 0; j--) {
      if (norm(A[i]) === norm(B[j])) dp[i][j] = dp[i + 1][j + 1] + 1;
      else dp[i][j] = Math.max(dp[i + 1][j], dp[i][j + 1]);
    }
  }

  const parts = [];
  let i = 0, j = 0;
  let delBuf = '', insBuf = '';
  const flush = () => {
    if (delBuf) { parts.push(`<del>${escapeHtml(delBuf)}</del>`); delBuf = ''; }
    if (insBuf) { parts.push(`<ins>${escapeHtml(insBuf)}</ins>`); insBuf = ''; }
  };
  while (i < m && j < n) {
    if (norm(A[i]) === norm(B[j])) {
      flush();
      parts.push(escapeHtml(B[j])); // keep corrected casing
      i++; j++;
    } else if (dp[i + 1][j] >= dp[i][j + 1]) {
      delBuf += A[i++];
    } else {
      insBuf += B[j++];
    }
  }
  while (i < m) delBuf += A[i++];
  while (j < n) insBuf += B[j++];
  flush();
  return parts.join('');
}

function buildLocalCorrection(word, sentence) {
  const trimmed = (sentence || '').trim();
  if (!trimmed) {
    return {
      corrected: `Let's ${word.en} the details before we move forward.`,
      diff_html: `<ins>Let's ${escapeHtml(word.en)} the details before we move forward.</ins>`,
      why: '문장이 비어 있어서 업무에서 바로 쓸 수 있는 기본형 예문으로 먼저 잡아드렸어요.',
    };
  }

  const lower = trimmed.toLowerCase();
  let corrected = trimmed;
  if (!lower.includes(word.en.toLowerCase())) {
    corrected = `Let's ${word.en} on the next step before we wrap up.`;
  } else if (!/[.!?]$/.test(corrected)) {
    corrected += '.';
  }

  return {
    corrected,
    diff_html: escapeHtml(trimmed) === escapeHtml(corrected)
      ? escapeHtml(corrected)
      : `<del>${escapeHtml(trimmed)}</del> <ins>${escapeHtml(corrected)}</ins>`,
    why: '표현이 문장 안에서 자연스럽게 들리도록 조금 더 업무 영어답게 다듬었어요.',
  };
}

// Calls our Supabase Edge Function (ai-review) which proxies to Anthropic.
// The real API key lives only in Supabase Edge Function secrets — never in
// the browser. On any failure we fall back to the local rule-based correction
// so the UI never hard-breaks.
async function callAiReviewEdgeFunction(payload) {
  if (!hasSupabase()) throw new Error('no supabase');
  const res = await fetch(`${SUPABASE_URL}/functions/v1/ai-review`, {
    method: 'POST',
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(payload),
  });
  if (!res.ok) {
    const errText = await res.text().catch(() => '');
    throw new Error(`ai-review ${res.status}: ${errText.slice(0, 200)}`);
  }
  const data = await res.json();
  if (!data || typeof data.corrected !== 'string') {
    throw new Error('ai-review bad shape');
  }
  return {
    corrected: data.corrected,
    diff_html: data.diff_html || escapeHtml(data.corrected),
    why: data.why || '표현이 더 자연스럽게 들리도록 다듬었어요.',
  };
}

async function requestSentenceCorrection(word, sentence, koreanContext) {
  try {
    const result = await callAiReviewEdgeFunction({
      mode: 'sentence',
      word: { en: word.en, def: word.def },
      text: sentence,
      // Korean intent sentence (한국어 문장) so the model can match the
      // learner's actual meaning instead of guessing from English alone.
      korean: (koreanContext || '').trim() || undefined,
    });
    // Always recompute diff client-side so we can show WORD-level changes
    // (server returns whole-sentence <del>/<ins>, which looks too aggressive).
    return {
      ...result,
      diff_html: buildWordDiffHtml(sentence, result.corrected),
    };
  } catch (e) {
    console.warn('[ai-review] sentence fallback:', e);
    const local = buildLocalCorrection(word, sentence);
    return { ...local, diff_html: buildWordDiffHtml(sentence, local.corrected) };
  }
}

function buildLocalStoryCorrection(words, text) {
  const trimmed = (text || '').trim();
  const wordList = (words || []).map((w) => w.en).join(', ');
  if (!trimmed) {
    return {
      corrected: '',
      diff_html: '',
      why: '아직 문장이 비어 있어요. 세 표현을 자연스럽게 이어 한 흐름으로 써보세요.',
    };
  }
  let corrected = trimmed;
  if (!/[.!?]$/.test(corrected)) corrected += '.';
  return {
    corrected,
    diff_html: escapeHtml(trimmed) === escapeHtml(corrected)
      ? escapeHtml(corrected)
      : `<del>${escapeHtml(trimmed)}</del> <ins>${escapeHtml(corrected)}</ins>`,
    why: `세 표현(${wordList})이 하나의 흐름에서 자연스럽게 들리도록 최소한만 다듬었어요.`,
  };
}

async function requestStoryCorrection(words, text, koreanContext) {
  try {
    const result = await callAiReviewEdgeFunction({
      mode: 'story',
      words: (words || []).map((w) => ({ en: w.en, def: w.def })),
      text,
      korean: (koreanContext || '').trim() || undefined,

    return {
      ...result,
      diff_html: buildWordDiffHtml(text, result.corrected),

    console.warn('[ai-review] story fallback:', e);

  }
}

const memberKey = () => (state.accountKey || state.email || [state.accessCode, state.name].filter(Boolean).join(':') || state.name || 'anonymous').trim();

async function supabaseRpc(fn, payload={}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(payload),
  });
  if (!res.ok) throw new Error(`supabase rpc failed: ${fn}`);
  return res.json();
}

const communityFeedCache = {};
const communityFeedInFlight = {};
const COMMUNITY_REFRESH_MS = 15000;
let memberSummaryCache = { loadedAt: 0, rows: [] };
let memberSummaryInFlight = null;
let memberSummaryRpcUnavailable = false;

function myTeam() {
  return meMember()?.team || 'A';
}

function myCommunityPostId(sourceKey) {
  return `${memberKey()}::${sourceKey}`;
}

function communityCommentsFor(postId) {
  return state.community_comments?.[postId] || [];
}

function applyRemoteMemberSummaries(rows = []) {
  const byName = new Map((rows || [])
    .filter((row) => row && row.member_name)
    .map((row) => [String(row.member_name).trim(), row]));
  let changed = false;
  MEMBERS.forEach((member) => {
    if (!member || !member.name) return;
    const summary = byName.get(String(member.name).trim());
    if (!summary) return;
    const nextProgress = Number(summary.progress || 0);
    const nextStreak = Number(summary.streak || 0);
    if (Number(member.progress || 0) !== nextProgress) {
      member.progress = nextProgress;
      changed = true;
    }
    if (Number(member.streak || 0) !== nextStreak) {
      member.streak = nextStreak;
      changed = true;
    }
    if (summary.tier && member.tier !== summary.tier) {
      member.tier = summary.tier;
      changed = true;
    }
    if (summary.role && member.role !== summary.role) {
      member.role = summary.role;
      changed = true;
    }
    if (summary.timezone_text && member.timezoneOffsetText !== summary.timezone_text) {
      member.timezoneOffsetText = summary.timezone_text;
      changed = true;
    }
    // Goal + motive from server (nullable) so 동료 카드가 실제 온보딩 데이터를 반영하도록.
    // Keep last known value if server returns empty — avoid wiping a value we already have.
    const nextGoal = (summary.goal || '').toString().trim();
    if (nextGoal && member.goal !== nextGoal) {
      member.goal = nextGoal;
      changed = true;
    }
    const nextMotive = (summary.motive || '').toString().trim();
    if (nextMotive && member.motive !== nextMotive) {
      member.motive = nextMotive;
      changed = true;
    }
  });
  return changed;
}

async function loadMemberSummaries(opts = {}) {
  if (!hasSupabase() || memberSummaryRpcUnavailable) return memberSummaryCache.rows || [];
  const { force = false } = opts;
  if (!force && memberSummaryCache.rows.length && (Date.now() - memberSummaryCache.loadedAt) < COMMUNITY_REFRESH_MS) {
    return memberSummaryCache.rows;
  }
  if (memberSummaryInFlight) return memberSummaryInFlight;
  memberSummaryInFlight = (async () => {
    try {
      const payload = await supabaseRpc('get_cohort_member_summaries', {
        p_cohort: CHALLENGE.cohort,
      });
      const rows = Array.isArray(payload) ? payload : [];
      memberSummaryCache = { loadedAt: Date.now(), rows };
      applyRemoteMemberSummaries(rows);
      return rows;
    } catch (e) {
      if (/supabase rpc failed: get_cohort_member_summaries/i.test(String(e && e.message || ''))) {
        memberSummaryRpcUnavailable = true;
      }
      return memberSummaryCache.rows || [];
    } finally {
      memberSummaryInFlight = null;
    }
  })();
  return memberSummaryInFlight;
}

function requestMemberSummaries(opts = {}) {
  const stale = !memberSummaryCache.loadedAt || (Date.now() - memberSummaryCache.loadedAt) >= COMMUNITY_REFRESH_MS;
  if (hasSupabase() && !memberSummaryRpcUnavailable && (opts.force || stale)) {
    const before = JSON.stringify(memberSummaryCache.rows || []);
    loadMemberSummaries({ force: true }).then((rows) => {
      const after = JSON.stringify(rows || []);
      if (before !== after && (currentPage === 'home' || currentPage === 'community' || currentPage === 'profile')) render();
    });
  }
  return memberSummaryCache.rows || [];
}

function patchCachedCommunityPost(postId, updater) {
  // communityFeedCache[day] shape is { loadedAt, rows: [] }.
  // 이전 구현이 배열로 가정하고 .map 을 돌려서 TypeError 가 나면
  // 좋아요·댓글 RPC 의 try 블록이 catch 로 빠져 "동기화에 실패" 토스트가 잘못 떴어요.
  // 이제 rows 만 치환하도록 수정.
  Object.keys(communityFeedCache).forEach((day) => {
    const entry = communityFeedCache[day];
    if (!entry || !Array.isArray(entry.rows)) return;
    entry.rows = entry.rows.map((post) => {
      if (post.id !== postId) return post;
      const next = updater(post);
      return next || post;
    });
  });
}

async function loadCommunityPosts(dayN, opts = {}) {
  if (!hasSupabase()) return [];
  const { force = false } = opts;
  const cached = communityFeedCache[dayN];
  if (!force && cached && (Date.now() - (cached.loadedAt || 0)) < COMMUNITY_REFRESH_MS) {
    return cached.rows || [];
  }
  if (communityFeedInFlight[dayN]) return communityFeedInFlight[dayN];
  communityFeedInFlight[dayN] = (async () => {
    try {
      const payload = await supabaseRpc('get_community_posts', {
        p_cohort: CHALLENGE.cohort,
        p_day: dayN,
        p_viewer_key: memberKey(),
      });
      const rows = Array.isArray(payload) ? payload : [];
      communityFeedCache[dayN] = { loadedAt: Date.now(), rows };
      return rows;
    } catch (e) {
      return communityFeedCache[dayN]?.rows || [];
    } finally {
      delete communityFeedInFlight[dayN];
    }
  })();
  return communityFeedInFlight[dayN];
}

function requestCommunityPosts(dayN, opts = {}) {
  const cached = communityFeedCache[dayN];
  const stale = !cached || (Date.now() - (cached.loadedAt || 0)) >= COMMUNITY_REFRESH_MS;
  if (hasSupabase() && (opts.force || stale)) {
    loadCommunityPosts(dayN, { force: true }).then(() => {
      if (currentPage === 'community' || currentPage === 'day') render();
    });
  }
  return cached?.rows || [];
}

async function upsertCommunityPost(dayN, idx) {
  if (!hasSupabase()) return false;
  const day = getDay(dayN);
  const word = day?.words?.[idx];
  if (!word) return false;
  const sourceKey = `d${dayN}-${idx}`;
  const sentence = (state.community_edits?.[`me-${sourceKey}`]?.sentence || state.sentences[sourceKey] || '').trim();
  if (!sentence || !state.submitted?.[sourceKey]) return false;
  await supabaseRpc('upsert_community_post', {
    p_cohort: CHALLENGE.cohort,
    p_post_id: myCommunityPostId(sourceKey),
    p_member_key: memberKey(),
    p_member_name: state.name || '익명',
    p_member_role: state.role || '',
    p_member_tier: state.tier || 'basic',
    p_member_team: myTeam(),
    p_member_timezone: state.timezoneOffsetText || '+0h',
    p_day_n: dayN,
    p_word: (word.en || '').toUpperCase(),
    p_sentence: sentence,
    p_translation: (state.community_edits?.[`me-${sourceKey}`]?.translation || state.sentence_notes?.[sourceKey] || '').trim(),
    p_source_key: sourceKey,
  });
  await loadCommunityPosts(dayN, { force: true });
  return true;
}

async function deleteCommunityPost(dayN, idx) {
  if (!hasSupabase()) return false;
  const sourceKey = `d${dayN}-${idx}`;
  await supabaseRpc('delete_community_post', {
    p_cohort: CHALLENGE.cohort,
    p_post_id: myCommunityPostId(sourceKey),
    p_member_key: memberKey(),
  });
  await loadCommunityPosts(dayN, { force: true });
  return true;
}

async function refreshRemoteStateAndCommunity(opts = {}) {
  if (!hasSupabase() || !state.onboarded) return false;
  const { force = false } = opts;
  let changed = false;
  try {
    const remote = await loadRemoteState();
    if (remote && typeof remote === 'object') {
      const localJson = JSON.stringify(persistedStateSnapshot());
      const remoteJson = JSON.stringify(remote);
      if (force || (remoteJson && remoteJson !== localJson)) {
        mergePersistedState(remote);
        bindMeToMembers();
        changed = true;
      }
    }
  } catch (e) {}
  try {
    const before = JSON.stringify(memberSummaryCache.rows || []);
    const summaries = await loadMemberSummaries({ force });
    const after = JSON.stringify(summaries || []);
    if (before !== after) changed = true;
  } catch (e) {}
  const dayToRefresh = state.communityDay || state.currentDay;
  if (hasSupabase() && dayToRefresh) {
    // Only force-fetch + re-render if the user is actively on a community-aware page.
    // This prevents the app from flashing every 15 seconds on Home/Profile/etc.
    const isOnCommunityPage = currentPage === 'community' || currentPage === 'day';
    if (force || isOnCommunityPage) {
      const before = communityFeedCache[dayToRefresh]?.rows || [];
      const beforeJson = JSON.stringify(before.map((p) => p.id + ':' + (p.updated_at || '') + ':' + (p.likes_count || 0)));
      await loadCommunityPosts(dayToRefresh, { force: true });
      const after = communityFeedCache[dayToRefresh]?.rows || [];
      const afterJson = JSON.stringify(after.map((p) => p.id + ':' + (p.updated_at || '') + ':' + (p.likes_count || 0)));
      if (afterJson !== beforeJson) changed = true;
    }
  }
  if (changed) render();
  return changed;
}

function formatComparisonLabel(data) {
  if (!data) return '어제 이 시간 데이터 없음';
  const diff = Number(data.delta_rate_pct || 0);
  if (!Number.isFinite(diff) || diff === 0) return '어제 이 시간과 동일';
  return `어제 이 시간보다 ${diff > 0 ? '↑' : '↓'} ${Math.abs(diff)}%`;
}

async function refreshDashboardStats() {
  if (!hasSupabase()) return;
  try {
    const data = await supabaseRpc('get_hourly_completion_delta', {
      p_cohort: CHALLENGE.cohort,
      p_verified_day: state.currentDay,
      p_total_members: visibleMembers().length,
    });
    const row = Array.isArray(data) ? data[0] : data;
    dashboardStats = {
      todayRate: row?.current_rate_pct ?? null,
      comparisonLabel: formatComparisonLabel(row),
    };
    if (currentPage === 'home') render();
  } catch (e) {
    dashboardStats = {
      todayRate: null,
      comparisonLabel: '어제 이 시간 데이터 연결 전',
    };
  }
}

async function recordVerificationEvent(day) {
  if (!hasSupabase()) return;
  try {
    await supabaseRpc('record_verification_event', {
      p_cohort: CHALLENGE.cohort,
      p_member_key: memberKey(),
      p_verified_day: day,
    });

/* Peer verification time cache — keyed by day → { memberKey: 'HH:mm' }.
   Populated from public.list_verification_times_for_day RPC (see
   supabase_hourly_completion.sql). On failure, silently no-ops — the UI
   just doesn't show peer times (graceful degradation). */
window.__peerVerifyTimes = window.__peerVerifyTimes || {};
window.__peerVerifyLoads  = window.__peerVerifyLoads  || {}; // dayN → Promise (dedupe)
let listVerificationTimesRpcUnavailable = false;
async function loadPeerVerificationTimes(day, opts = {}) {
  if (!hasSupabase() || listVerificationTimesRpcUnavailable) return {};
  const force = !!opts.force;
  if (!force && window.__peerVerifyTimes[day]) return window.__peerVerifyTimes[day];
  if (window.__peerVerifyLoads[day]) return window.__peerVerifyLoads[day];
  const tzMinutes = Number(state.timezoneOffsetMinutes || 540);
  window.__peerVerifyLoads[day] = (async () => {
    try {
      const rows = await supabaseRpc('list_verification_times_for_day', {
        p_cohort: CHALLENGE.cohort,
        p_day: day,
        p_tz_offset_minutes: tzMinutes,
      });
      const out = {};
      (Array.isArray(rows) ? rows : []).forEach((r) => {
        if (!r) return;
        // Key by both member_key and member_name so the board row lookup works
        // regardless of which identifier the client has on hand (MEMBERS[].name).
        const hhmm = r.verified_hhmm || '';
        if (r.member_key) out[r.member_key] = hhmm;
        if (r.member_name) out[String(r.member_name).trim()] = hhmm;
      });
      window.__peerVerifyTimes[day] = out;
      return out;
    } catch (e) {
      if (/supabase rpc failed: list_verification_times_for_day/i.test(String(e && e.message || ''))) {
        listVerificationTimesRpcUnavailable = true;
      }
      return window.__peerVerifyTimes[day] || {};
    } finally {
      window.__peerVerifyLoads[day] = null;
    }
  })();
  return window.__peerVerifyLoads[day];
}
// Curated community posts — empty for beta launch. Real participants populate the feed.
const COMMUNITY_POSTS = [];

// Peer sentences per day — empty for beta launch. Real participants populate as they post.
const PEER_SENTENCES = {};

/* Peer sentences — only return curated/real posts. No fake fallback for beta. */
function peerSentencesFor(day) {
  if (hasSupabase()) {
    const remote = requestCommunityPosts(day);
    const dayData = getDay(day);
    return remote
      .filter((post) => post.member_key !== memberKey())
      .map((post) => {
        const wordIdx = Math.max(0, dayData?.words?.findIndex((w) => (w.en || '').toUpperCase() === (post.word || '').toUpperCase()) ?? 0);
        return {
          user: post.user,
          team: post.team || 'A',
          avatar: (post.user || '').slice(0, 2),
          wordIdx,
          sentence: post.sentence,
          translation: post.translation || '',
          time: '방금',
          likes: Number(post.likes_count || 0),
        };
      });
  }
  const curated = PEER_SENTENCES['d' + day];
  return curated && curated.length ? curated : [];
}

/* ============================================================
   RENDER — main dispatcher
   ============================================================ */
// Pending-render queue for when focus needs to be preserved (fixes Android Chrome keyboard dismissal
// while typing into 내 한국어 메모 / 영어 문장 textareas).
window.__renderDeferred = window.__renderDeferred || false;
function isTypingFocus() {
  try {
    const a = document.activeElement;
    if (!a) return false;
    // Inputs that opt out (quiz blank, etc.) — we want re-render to fire
    // immediately on advance so the stale value/placeholder is cleared.
    if (a.dataset && a.dataset.noTypingGuard === '1') return false;
    const tag = (a.tagName || '').toUpperCase();
    if (tag === 'TEXTAREA') return true;
    if (tag === 'INPUT') {
      const type = (a.type || 'text').toLowerCase();
      // Treat text-like inputs as typing focus; buttons/checkboxes/etc. don't need protection.
      return ['text', 'search', 'email', 'url', 'tel', 'password', 'number', ''].includes(type);
    }
    if (a.isContentEditable) return true;
  } catch (e) {}
  return false;
}
function installTypingBlurRerender(target) {
  try {
    if (!target || target.__rerenderBound) return;
    target.__rerenderBound = true;
    const handler = () => {
      target.removeEventListener('blur', handler);
      target.__rerenderBound = false;
      if (window.__renderDeferred) {
        window.__renderDeferred = false;
        // Next tick so the blur event finishes propagating first.
        setTimeout(() => { try { render(); } catch (e) {} }, 0);
      }
    };
    target.addEventListener('blur', handler, { once: true });
  } catch (e) {}
}
function render() {
  // Keyboard stays open on mobile as long as the focused textarea/input stays in the DOM.
  // If a typing field is focused right now, defer the re-render until blur — otherwise
  // the wholesale innerHTML replacement below tears down the focused node and dismisses
  // the Android Chrome soft keyboard mid-word.
  if (isTypingFocus()) {
    window.__renderDeferred = true;
    installTypingBlurRerender(document.activeElement);
    return;
  }
  window.__renderDeferred = false;
  // Daily rollover safety net: if midnight has passed while the app was open
  // (or we hydrated with a stale cached currentDay), recompute against today.
  try {
    if (!__DEMO_MODE__) {
      const real = computeCurrentDay();
      if (real && real !== state.currentDay) {
        state.currentDay = real;
        // Persist silently — no need to block render on a save.
        try { cacheState(); } catch (e) {}
      }
    }
  } catch (e) {}
  const root = $('#root');
  root.innerHTML = '';
  try {
    const app = el('div', { class: 'app' });

    let page;
    // Force onboarding for first-visit users. Demo mode bypasses.
    if (!state.onboarded && !__DEMO_MODE__) {
      page = OnboardingPage();
      app.appendChild(page);
      root.appendChild(app);
      if (toast) root.appendChild(el('div', { class: 'toast' }, toast));
      return;
    }
    if (currentPage === 'home') page = HomePage();
    else if (currentPage === 'weeks') page = WeeksPage();
    else if (currentPage === 'day') page = DayPage(currentDay);
    else if (currentPage === 'verify') page = VerifyPage(currentDay);
    else if (currentPage === 'premium') page = PremiumPage();
    else if (currentPage === 'meeting-notes') page = MeetingNotesPage(window.__currentMeetingId);
    else if (currentPage === 'quiz') page = QuizPage();
    else if (currentPage === 'certification') page = CertPage();
    else if (currentPage === 'community') page = CommunityPage();
    else if (currentPage === 'profile') page = ProfilePage();
    else if (currentPage === 'scripts') page = ScriptsPage();
    else if (currentPage === 'export') page = ExportPage();
    else page = HomePage();

    app.appendChild(page);
    app.appendChild(TabBar());
    root.appendChild(app);

    if (toast) root.appendChild(el('div', { class: 'toast' }, toast));
    if (showPremiumGate) root.appendChild(PremiumGateModal());
    if (activeMemberCard) root.appendChild(MemberCardModal(activeMemberCard));
    if (showSettings) root.appendChild(SettingsModal());
    if (verificationReviewDay) root.appendChild(VerificationReviewModal(verificationReviewDay));

    stopPeerTicker();
  } catch (error) {
    console.error('render failed', error);
    stopPeerTicker();
    currentPage = 'home';
    saveRoute();
    const app = el('div', { class: 'app' });
    const fallback = el('div', { class: 'page' });
    fallback.innerHTML = `
      <div class="card" style="margin-top:24px;padding:24px;border-radius:24px;">
        <div class="kicker">RECOVERED</div>
        <h2 class="h2" style="margin-top:8px;">일부 화면 데이터를 불러오는 중 문제가 있었어요.</h2>
        <p class="t-body" style="margin-top:10px;">최근 열던 화면 대신 홈으로 복구했어요. 계속 같은 문제가 나면 새로고침해서 다시 확인해보세요.</p>
        <button class="btn btn-primary btn-full" style="margin-top:16px;" onclick="location.reload()">새로고침</button>
      </div>
    `;
    app.appendChild(fallback);
    app.appendChild(TabBar());
    root.appendChild(app);
  }
}

/* ============================================================
   PEER TICKER — floating "방금 문장이 추가됐어요" notification
   Lightweight: single setInterval, pauses when tab hidden, stops on nav away
   ============================================================ */
window.__peerTickerTimer = window.__peerTickerTimer || null;
// Track sentences already shown as notifications (lifetime, per post id).
window.__peerTickerSeen = window.__peerTickerSeen || new Set();
// Snapshot of peer post IDs present at ticker start — these are NOT considered "new arrivals".
window.__peerTickerBaseline = window.__peerTickerBaseline || null;

function peerTickerKey(dayN, peer) {
  // Prefer a stable post id if available; fall back to user+sentence.
  return 'd' + dayN + ':' + (peer.id || (peer.user + '::' + (peer.sentence || '').slice(0, 60)));
}

function stopPeerTicker() {
  if (window.__peerTickerTimer) {
    clearInterval(window.__peerTickerTimer);
    window.__peerTickerTimer = null;
  }
  window.__peerTickerBaseline = null;
  const existing = document.querySelector('.peer-ticker');
  if (existing) existing.remove();
}

function startPeerTicker(dayN) {
  stopPeerTicker();
  // Baseline: everything already posted when the user opened this day is NOT a "new" arrival.
  // Mark those as seen so we never notify about them.
  const existing = peerSentencesFor(dayN) || [];
  const baseline = new Set(existing.map((p) => peerTickerKey(dayN, p)));
  window.__peerTickerBaseline = baseline;
  existing.forEach((p) => window.__peerTickerSeen.add(peerTickerKey(dayN, p)));

  const tick = () => {
    if (document.hidden) return;
    if (currentPage !== 'day') { stopPeerTicker(); return; }
    const peers = peerSentencesFor(dayN);
    if (!peers || !peers.length) return;
    // Only notify about peers that were NOT in the baseline and we haven't shown yet.
    const fresh = peers.filter((p) => {
      const key = peerTickerKey(dayN, p);
      return !window.__peerTickerSeen.has(key);
    });
    if (!fresh.length) return; // nothing new — stay quiet
    // Oldest-first so notifications fire in arrival order
    const pick = fresh[0];
    window.__peerTickerSeen.add(peerTickerKey(dayN, pick));
    showPeerTicker(pick);
  };
  // Gentle cadence: first check after 30s, then every 60s.
  window.__peerTickerTimer = setInterval(tick, 60000);
  setTimeout(tick, 30000);
}

function showPeerTicker(peer) {
  // Remove any existing ticker first
  const existing = document.querySelector('.peer-ticker');
  if (existing) existing.remove();

  const node = el('div', { class: 'peer-ticker' });
  node.innerHTML = `
    <span class="pt-pulse"></span>
    <div class="pt-avatar">${(peer.avatar || peer.user || '').slice(0,1)}</div>
    <div class="pt-text">
      <span class="pt-label">${escapeHtml(peer.user || '')}님 문장 올림</span>
    </div>`;
  node.addEventListener('click', () => {
    // Scroll to peer sentences section if present
    const sec = document.querySelector('[data-peer-section]');
    if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    node.classList.add('out');
    setTimeout(() => node.remove(), 280);
  });
  document.body.appendChild(node);
  setTimeout(() => {
    if (!node.isConnected) return;
    node.classList.add('out');
    setTimeout(() => node.remove(), 280);
  }, 4200);
}

function shouldIgnoreSwipeTarget(target) {
  if (!target || !(target instanceof Element)) return false;
  if (target.closest('input, textarea, select, button, a, [contenteditable="true"], .modal, .modal-backdrop')) return true;
  const scrollHost = target.closest('.hidden-scroll, .tabbar-inner, [data-no-swipe], [style*="overflow-x: auto"]');
  if (scrollHost) return true;
  return false;
}

function setupSwipeNavigation() {
  if (window.__ybSwipeInit) return;
  window.__ybSwipeInit = true;
  let startX = 0;
  let startY = 0;
  let startTime = 0;
  let tracking = false;
  let trackingPointerId = null;

  const beginSwipe = (target, clientX, clientY) => {
    if (shouldIgnoreSwipeTarget(target)) {
      tracking = false;
      trackingPointerId = null;
      return;
    }
    startX = clientX;
    startY = clientY;
    startTime = Date.now();
    tracking = true;
  };

  const finishSwipe = (clientX, clientY) => {
    if (!tracking) return;
    tracking = false;
    trackingPointerId = null;
    if (showPremiumGate || activeMemberCard || showSettings) return;
    const deltaX = clientX - startX;
    const deltaY = clientY - startY;
    const elapsed = Date.now() - startTime;
    const absX = Math.abs(deltaX);
    const absY = Math.abs(deltaY);
    if (elapsed > 650 || absX < 72 || absY > 56 || absX < absY * 1.35) return;
    if (deltaX > 0) {
      goBackRoute();
    } else {
      goForwardRoute();
    }
  };

  document.addEventListener('touchstart', (event) => {
    if (!event.touches || event.touches.length !== 1) return;
    const touch = event.touches[0];
    beginSwipe(event.target, touch.clientX, touch.clientY);
  }, { passive: true });

  document.addEventListener('touchend', (event) => {
    if (!event.changedTouches || !event.changedTouches.length) return;
    const touch = event.changedTouches[0];
    finishSwipe(touch.clientX, touch.clientY);
  }, { passive: true });

  document.addEventListener('pointerdown', (event) => {
    if (!event.isPrimary) return;
    if (event.pointerType === 'mouse' && event.button !== 0) return;
    trackingPointerId = event.pointerId;
    beginSwipe(event.target, event.clientX, event.clientY);
  }, { passive: true });

  document.addEventListener('pointerup', (event) => {
    if (!event.isPrimary) return;
    if (trackingPointerId !== null && event.pointerId !== trackingPointerId) return;
    finishSwipe(event.clientX, event.clientY);
  }, { passive: true });

  document.addEventListener('pointercancel', () => {
    tracking = false;
    trackingPointerId = null;
  }, { passive: true });
}

function setupScrollMemory() {
  if (window.__ybScrollMemoryInit) return;
  window.__ybScrollMemoryInit = true;
  let frame = null;
  const save = () => {
    frame = null;
    rememberCurrentScroll();
    saveRoute();
  };
  window.addEventListener('scroll', () => {
    if (frame) return;
    frame = requestAnimationFrame(save);
  }, { passive: true });
}

});

const ONBOARD_CODE_MAP = MEMBER_DIRECTORY.reduce((acc, member) => {
  acc[String(member.code)] = {
    name: member.name,
    role: member.role || '',
    tier: member.tier || 'basic',
    isOperator: !!member.isOperator,
  };
  return acc;
}, {

  'YB5': { generic: true },
  'YOUBUDDY5': { generic: true },
  '5기': { generic: true },
});
const lookupCode = (raw) => {
  const k = (raw || '').trim();
  if (!k) return null;
  return ONBOARD_CODE_MAP[k] || ONBOARD_CODE_MAP[k.toUpperCase()] || ONBOARD_CODE_MAP[k.toLowerCase()] || null;

async function __onboardAdvance() {
  if (__onboardStep === 0) {
    const name = (__onboardDraft.name || '').trim();
    const code = (__onboardDraft.code || '').trim();
    const timezone = parseTimezoneShift(__onboardDraft.timezoneOffsetText);
    if (!name) { showToast('이름을 입력해주세요'); return; }
    if (!timezone.ok) { showToast('시차 형식이 맞지 않아요. 예: +0h, -13h, +1:30h'); return; }
    const match = lookupCode(code);
    if (!match) {
      const hint = document.getElementById('__obCodeHint');
      if (hint) { hint.textContent = '코드가 맞지 않아요. 다시 확인해주세요.'; hint.style.color = 'var(--orange-dark)'; }
      return;
    }
    // Bound code (e.g., 00/1/2): auto-set role/tier. Name must match if code is personal.
    if (!match.generic && match.name) {
      if (name !== match.name) {
        const hint = document.getElementById('__obCodeHint');
        if (hint) { hint.textContent = `이 코드는 ${match.name} 님 전용이에요. 이름을 확인해주세요.`; hint.style.color = 'var(--orange-dark)'; }
        return;
      }
      if (match.role) __onboardDraft.role = match.role;
    }

    // === Returning-user shortcut ===
    // If the server already has an onboarded state for this (code+name), treat this as a login
    // and skip the goal/role steps entirely.
    if (hasSupabase()) {
      const hint = document.getElementById('__obCodeHint');
      if (hint) { hint.textContent = '기존 기록을 확인하고 있어요…'; hint.style.color = 'var(--muted)'; }
      const probeKey = [code || 'guest', name].filter(Boolean).join(':');
      // Stash a temp account key so memberKey() resolves correctly during the probe.
      const prevAccountKey = state.accountKey;
      state.accountKey = probeKey;
      let remote = null;
      try { remote = await loadRemoteState(); } catch (_) { remote = null; }
      state.accountKey = prevAccountKey;
      // 가입 판정: 아래 중 하나라도 참이면 "이미 가입됨"으로 간주 → 로그인 처리
      //   1) signedUp === true (영속 가입 플래그; __finishOnboarding이 찍음)
      //   2) onboarded === true (과거 빌드 호환 — signedUp 추가 이전 가입자)
      //   3) goal 필드가 비어있지 않음 (가입 완료만이 goal을 저장하므로)
      //   4) role 필드가 비어있지 않음
      // 운영진(유버디) 등 isOperator 계정도 동일 플로우로 판정됨.
      const remotelyRegistered = !!(
        remote && typeof remote === 'object' && (
          remote.signedUp === true ||
          remote.onboarded === true ||
          (typeof remote.goal === 'string' && remote.goal.trim().length > 0) ||
          (typeof remote.role === 'string' && remote.role.trim().length > 0)
        )
      );
      if (remotelyRegistered) {
        // Existing account — treat as login. Merge server state and jump home.
        try { mergePersistedState(remote); } catch (_) {}
        // Make sure the essentials from this session's entry are honored
        state.name = name;
        state.accessCode = code;
        state.accountKey = probeKey;
        state.timezoneOffsetText = timezone.ok ? timezone.text : (state.timezoneOffsetText || '+0h');
        state.timezoneOffsetMinutes = timezone.ok ? timezone.offsetMinutes : (state.timezoneOffsetMinutes || DEFAULT_TIMEZONE_OFFSET);
        if (match && match.tier) state.tier = match.tier;
        state.isOperator = !!(match && match.isOperator);
        state.onboarded = true;
        state.signedUp = true; // 서버에 가입 기록이 있으면 로컬에도 플래그 보정
        state.currentDay = computeCurrentDay();
        bindMeToMembers();
        saveState({ immediate: true });
        try { await loadMemberSummaries({ force: true }); } catch (_) {}
        showToast(`다시 만나서 반가워요, ${state.name}!`);
        currentPage = 'home';
        __onboardStep = 0;
        __onboardDraft = { name: '', code: '', goal: '', role: '', roleSkipped: false, timezoneOffsetText: '+0h' };
        saveRoute();
        render();
        return;
      }
      if (hint) { hint.textContent = '코드는 운영팀이 전달한 값을 입력해주세요.'; hint.style.color = 'var(--muted)'; }
    }

    __onboardStep = 1;
    render();
  } else if (__onboardStep === 1) {
    const goal = (__onboardDraft.goal || '').trim();
    if (!goal) { showToast('한 줄만 적어주세요. 나중에 수정할 수 있어요.'); return; }
    __onboardStep = 2;
    render();
  } else if (__onboardStep === 2) {
    __finishOnboarding();
  }
}

function __finishOnboarding() {
  state.name = (__onboardDraft.name || '').trim();
  state.accessCode = (__onboardDraft.code || '').trim();
  const timezone = parseTimezoneShift(__onboardDraft.timezoneOffsetText);
  state.timezoneOffsetText = timezone.ok ? timezone.text : '+0h';
  state.timezoneOffsetMinutes = timezone.ok ? timezone.offsetMinutes : DEFAULT_TIMEZONE_OFFSET;
  state.goal = (__onboardDraft.goal || '').trim();
  state.role = (__onboardDraft.role || '').trim();
  state.roleSkipped = !!__onboardDraft.roleSkipped;
  state.onboarded = true;
  state.signedUp = true; // 영속 가입 플래그 — 로그아웃 후 재로그인 시 목표/롤 다시 묻지 않게 하는 근거
  state.accountKey = [state.accessCode || 'guest', state.name || 'member'].join(':');
  const m = lookupCode(state.accessCode);
  if (m && m.tier) state.tier = m.tier;
  state.isOperator = !!(m && m.isOperator);
  state.currentDay = computeCurrentDay();
  bindMeToMembers();
  saveState({ immediate: true });
  currentPage = 'home';
  lastLearningPage = 'weeks';
  saveRoute();
  showToast(`🚀 환영해요, ${state.name}! Day 1이 기다리고 있어요.`);
  render();
}

    });
    tab.innerHTML = Icon(t.icon, 14) + ' <span>' + t.label + '</span>';
    inner.appendChild(tab);
  }
  bar.appendChild(inner);
  return bar;
}

/* Checkboard — 30 rows × 20 days heatmap */
function Checkboard() {
  const wrap = el('div', { class: 'checkboard-wrap' });
  const grid = el('div', { class: 'checkboard' });
  grid.appendChild(el('div', { class: 'cb-header cb-header-name', style: { textAlign: 'left' } }, 'MEMBER'));
  for (let d = 1; d <= 20; d++) {
    grid.appendChild(el('div', { class: 'cb-header' + (d === state.currentDay ? ' today-col' : '') }, d));
  }
  // Kick off per-day peer-time fetches in background so a re-render picks them up.
  // Bounded to days [1 .. currentDay] — we only care about already-completed days.
  if (typeof loadPeerVerificationTimes === 'function') {
    const maxD = Math.min(20, Math.max(1, state.currentDay || 1));
    for (let d = 1; d <= maxD; d++) {
      if (!(window.__peerVerifyTimes || {})[d]) {
        loadPeerVerificationTimes(d).then((map) => {
          if (map && Object.keys(map).length) {
            // Only re-render if we're still on this page; skip otherwise to avoid churn.
            if (currentPage === 'board' || currentPage === 'home' || currentPage === 'weeks') {
              if (typeof render === 'function') render();
            }
          }
        }).catch(() => {});
      }
    }
  }
  visibleMembers().forEach((m) => {
    const name = el('div', { class: 'cb-name' + (m.me ? ' cb-row-me' : '') });
    // Hide tz on the checkboard so all rows stay uniform height (we don't have
    // tz for other members yet — showing it only on "me" looks inconsistent).
    name.innerHTML = `
      <div class="tiny-av ${m.color}">${m.name.slice(0,1)}</div>
      <div style="min-width:0;">
        <div style="display:flex;align-items:center;gap:4px;min-width:0;">
          <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${m.name}</span>
          ${premiumPill(m)}
        </div>
      </div>`;
    grid.appendChild(name);
    for (let d = 1; d <= 20; d++) {
      // For "me" row we have full status (verified_at → late detection).
      // For other members we only know progress count (no per-day timestamps yet),
      // so default them to 'on' (정상) when within their progress — upstream
      // board RPC can be extended later to emit per-day late flags.
      let cls = 'cb-cell';
      let tooltip = '';
      if (m.me) {
        const st = dayStatus(d);
        if (st === 'done')           cls += ' on';
        else if (st === 'done-late') cls += ' on late';
        else if (st === 'today')     cls += ' today';
        else if (st === 'missed')    cls += ' missed';
        else if (st === 'locked')    cls += ' locked';
        // 'open' renders as default (크림 빈 슬롯 = 내일 미리 풀기)
        const vt = state.verified_time && state.verified_time['d'+d];
        if (vt && (st === 'done' || st === 'done-late')) {
          const tz = state.timezoneOffsetText || '+0h';
          tooltip = `${m.name} · Day ${d} · ${vt} ${tz}${st === 'done-late' ? ' (지각)' : ''}`;
        }
      } else {
        const on = d <= m.progress;
        if (on) cls += ' on';
        else if (d < state.currentDay) cls += ' missed';      // 피어 과거 미인증
        else if (d > state.currentDay + 1) cls += ' locked';  // 피어 모레 이후
        if (on) {
          // Peer times: look up the server-side RPC cache (keyed by both member_key
          // and member_name). Falls back to just the name if time isn't cached yet.
          const peerMap = (window.__peerVerifyTimes || {})[d] || {};
          const nm = String(m.name || '').trim();
          const hhmm = peerMap[nm] || peerMap[m.member_key || ''] || '';
          const peerTz = memberTimezoneText(m);
          const stamp = hhmm ? (peerTz ? `${hhmm} ${peerTz}` : hhmm) : '';
          tooltip = stamp ? `${m.name} · Day ${d} · ${stamp}` : `${m.name} · Day ${d} 완료`;
        }
      }
      const attrs = { class: cls };
      if (tooltip) attrs.title = tooltip;
      grid.appendChild(el('div', attrs));
    }
  });
  wrap.appendChild(grid);
  return wrap;
}

    </span>`;
  page.appendChild(legend);

  return page;
}

function buildVerifyQuestions(dayN) {
  // 출제 범위 = 오늘까지 공개된 모든 Day 단어.
  //   - 오늘의 3단어는 항상 맨 앞에 포함.
  //   - 이전 Day 단어들 중 랜덤하게 최대 3문항까지 복습 문항으로 섞어 출제.
  // Day가 늘어날수록 자연스럽게 복습 분량이 붙도록 설계.
  // 같은 회차 내에서는 리렌더되어도 문항이 흔들리지 않도록 캐시. __restartVerifyQuiz에서 초기화.
  window.__verifyQuestionsCache = window.__verifyQuestionsCache || {};
  const cached = window.__verifyQuestionsCache[dayN];
  if (Array.isArray(cached) && cached.length) return cached;

  const toQuestion = (w) => ({
    en: w.en,
    kr: w.def,
    syn: w.syn || [],
    prompt: w.ex_en || `Let's use ${w.en} in a sentence.`,
    prompt_kr: w.ex_kr || '',
  });
  const today = getDay(dayN);
  const primary = (today?.words || []).map(toQuestion);

  const pool = [];
  (CHALLENGE.weeks || []).forEach((week) => {
    (week.days || []).forEach((d) => {
      if (!d || d.day >= dayN) return;
      (d.words || []).forEach((w) => pool.push(w));
    });
  });
  for (let i = pool.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  const recall = pool.slice(0, 3).map(toQuestion);

  const questions = [...primary, ...recall];
  window.__verifyQuestionsCache[dayN] = questions;
  return questions;
}

function normalizeQuizAnswer(value='') {
  return String(value).trim().toLowerCase().replace(/\s+/g, ' ');
}

function blankPatternFor(answer='') {
  return String(answer)
    .split('')
    .map((ch) => (/\s/.test(ch) ? ' ' : '_'))
    .join('');
}

// 첫 글자 힌트 마스크 — "hit out" → "h__ o__", "go with" → "g_ w___"
// 알파벳이 아닌 구두점/숫자/하이픈은 그대로 보여줘요 (시각적 단서).
function buildVerifyHintMask(answer='') {
  return String(answer)
    .split(/(\s+)/) // 공백을 유지한 토큰
    .map((tok) => {
      if (/^\s+$/.test(tok)) return tok;
      if (!tok) return tok;
      let out = '';
      let seenAlpha = false;
      for (const ch of tok) {
        if (/[A-Za-z]/.test(ch)) {
          if (!seenAlpha) { out += ch; seenAlpha = true; }
          else { out += '_'; }
        } else {
          // 하이픈/어포스트로피/구두점은 그대로
          out += ch;
        }
      }
      return out;
    })
    .join('');
}

  const stepList = el('div', { class: 'stack', style: { marginTop: '18px', gap: '12px' } });

      onClick: () => {

          // Allow re-taking the word quiz even after passing/submission
          try { delete state.checkpoints[quizKey]; } catch (e) {}
          saveState();
          if (typeof window.__restartVerifyQuiz === 'function') {

          } else {

            ui.done = false;

            ui.value = '';
            ui.score = 0;
            ui.reveal = false;

          render();
        }
      }

  });
  page.appendChild(stepList);

  const verified = !!state.verified['d'+dayN];
  const allDone = steps.every((step) => step.done);
  const finalBtn = el('button', {
    class: 'btn btn-full btn-lg',
    style: { marginTop: '20px', padding: '22px 24px', fontSize: '18px', background: verified ? 'var(--green-soft)' : (allDone ? 'var(--orange)' : 'var(--paper)'), color: verified ? 'var(--green)' : (allDone ? '#fff' : 'var(--muted)'), display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '4px', lineHeight: '1.25' },

      if (verified) go('day', { week: d.weekN, day: dayN });
      else {
        if (guardFutureDay(dayN)) return;
        state.verified['d'+dayN] = true;
        state.verified_at = state.verified_at || {};
        state.verified_at['d'+dayN] = todayStr();
        state.verified_time = state.verified_time || {};
        state.verified_time['d'+dayN] = nowTimeStr();

        recordVerificationEvent(dayN);
        showToast('🎉 Day ' + dayN + ' 인증 완료! 보너스 영상이 열렸어요');
        fireConfetti();

        setTimeout(() => go('day', { week: d.weekN, day: dayN }), 1400);
      }
    }
  });
  if (verified) {
    const vt = (state.verified_time && state.verified_time['d'+dayN]) || '';
    const vd = (state.verified_at && state.verified_at['d'+dayN]) || '';
    const stampText = formatVerifyStamp(vd, vt, state.timezoneOffsetText);
    finalBtn.innerHTML = `
      <span style="font-size:18px;font-weight:700;">오늘 인증 완료됨</span>
      ${stampText ? `<span style="font-size:11px;font-weight:500;opacity:0.75;letter-spacing:0.02em;">인증 ${escapeHtml(stampText)}</span>` : ''}
    `;
  } else {
    finalBtn.textContent = allDone ? '인증 완료하기 ✓' : `${completed}/3 단계 완료`;
  }
  page.appendChild(finalBtn);
  return page;
}

          padding: '14px 16px',
          borderRadius: '18px',

          border: '1px solid rgba(107,142,78,0.18)',
        }
      });
      compareBanner.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
          <div>
            <div class="kicker" style="color:var(--green);">COMPARE AFTER TRYING</div>
            <div style="margin-top:4px;font-size:15px;font-weight:700;color:var(--ink);">좋아요. 이제 아래에서 동료 문장과 비교해볼 수 있어요.</div>
          </div>
          <span class="badge badge-green" style="font-size:10px;">LIVE ${peers.length}</span>

        <div class="t-small" style="margin-top:6px;color:var(--ink-soft);line-height:1.5;">먼저 쓴 뒤에 비교하면, 표현이 더 오래 남고 내 문장도 더 선명해져요.</div>

      // funnels heavy comparing to the Community tab.
      const peerTop = peers.slice(0, 3);
      const peerHead = el('div', { class: 'row-between', style: { marginBottom: '10px', alignItems: 'flex-end' } });

        <div>
          <div class="kicker">SUBMIT THEN COMPARE · LIVE</div>
          <div class="h2" style="margin-top:4px;font-size:18px;">다른 사람들은 이렇게 썼어요</div>

        const wordRe = new RegExp('(' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'i');
        const highlighted = (p.sentence || '').replace(wordRe, '<b style="color:var(--orange-dark);">$1</b>');
        const item = el('div', { class: 'card', style: { padding: '14px 16px', borderRadius: '20px', background: 'var(--cream)' } });

          <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
            <div style="width:32px;height:32px;border-radius:10px;background:var(--paper);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink);">${escapeHtml(p.avatar || '')}</div>
