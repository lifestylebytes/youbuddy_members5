              <div style="font-size:13px;font-weight:700;color:var(--ink);">${escapeHtml(p.user)} <span class="t-small mono" style="color:var(--muted);font-weight:500;">· ${p.team}</span></div>

          <div style="font-size:13px;line-height:1.55;color:var(--ink);">${highlighted}</div>
          <div class="t-small" style="margin-top:6px;color:var(--ink-soft);font-size:11.5px;line-height:1.5;">${escapeHtml(p.translation || '')}</div>
          <div style="display:flex;gap:14px;margin-top:10px;align-items:center;">
            <span class="t-small" style="font-size:11px;color:var(--muted);">♥ ${p.likes || 0}</span>

          padding: '18px 18px',

          background: 'rgba(255,250,241,0.78)',

        }
      });

        <div class="kicker">UNLOCK AFTER FIRST TRY</div>

  }

  page.appendChild(s2);

  // 보너스 영상은 페이지 상단으로 옮겼어요 — tipCard 바로 아래에서 바로 보여요.

  // Complete button
  const verified = !!state.verified['d'+dayN];

  // Once verified, don't let users accidentally un-verify themselves.
  // Instead, give them a way to *review* what they submitted today —
  // sentences, AI corrections, story hook, and word-quiz answers — and
  // re-take the word quiz if they want to practice again.
  if (verified) {
    const reviewBtn = el('button', {
      class: 'btn btn-ghost btn-full',

        marginTop: '20px',
        borderRadius: '16px',

      },
      onClick: () => { verificationReviewDay = dayN; render(); },
    });

    page.appendChild(reviewBtn);
  }

  const cta = el('button', {
    class: 'btn btn-full btn-lg',
    style: {
      marginTop: '14px',
      borderRadius: '999px',
      padding: '24px 28px',
      fontSize: '20px',
      background: verified ? 'var(--green-soft)' : (prepDone === 2 ? 'var(--orange)' : 'var(--paper)'),
      color: verified ? 'var(--green)' : (prepDone === 2 ? '#fff' : 'var(--muted)'),
      cursor: verified ? 'default' : 'pointer',
    },
    disabled: verified || prepDone !== 2,
    onClick: () => {
      // verified=true → disabled, no-op. Un-verify is intentionally disabled.
      if (!verified) go('verify', { week: d.weekN, day: dayN });
    },
  });
  // 버튼 문구를 "다음에 할 일" 하나로 명확히 — 이전의 '학습 준비 0/2'는 제출 0/3과 혼동되던 문제 해결
  let ctaLabel;
  if (verified) {
    const vt = (state.verified_time && state.verified_time['d'+dayN]) || '';
    const vd = (state.verified_at && state.verified_at['d'+dayN]) || '';
    const stampText = formatVerifyStamp(vd, vt, state.timezoneOffsetText);
    ctaLabel = `
      <span style="display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.25;">
        <span style="font-size:18px;font-weight:700;">오늘 인증 완료됨</span>
        ${stampText ? `<span style="font-size:11px;font-weight:500;opacity:0.75;letter-spacing:0.02em;">인증 ${escapeHtml(stampText)}</span>` : ''}
      </span>`;
  } else if (prepDone === 2) {
    ctaLabel = `인증 마무리로 가기 ${Icon('arrowRight', 18)}`;
  } else if (!copyDone) {
    ctaLabel = `① 표현 3번씩 읽기부터 시작 ${Icon('arrowRight', 18)}`;
  } else {
    ctaLabel = `② 문장 제출 이어가기 (${submittedCount}/3) ${Icon('arrowRight', 18)}`;
  }
  cta.innerHTML = ctaLabel;
  page.appendChild(cta);

  page.appendChild(el('div', { class: 't-small', style: { textAlign: 'center', marginTop: '16px', fontSize: '16px', lineHeight: '1.55' } },
    verified
      ? '인증이 완료되어 대시보드에 반영됐어요.'
      : (prepDone === 2
          ? '학습 준비 완료. 다음 화면에서 단어 테스트와 말하기까지 마치면 오늘 인증이 끝나요.'
          : `오늘 할 일: ① 읽기 ${copyDone ? '✓' : '—'} · ② 문장 제출 ${submittedCount}/3`)
  ));

  return page;
}

function aiGenerateTalkPoints(meta, isPT, existing='') {
  const focus = (meta.desc || '').trim();
  const title = meta.title || '';
  const common = [
    `- ${isPT ? '나의 약점: ' : ''}이번 주 가장 자주 막혔던 표현 정리`,
    `- ${focus ? focus + ' 관련해서' : '이번 세션에서'} 내 실제 업무 예시로 써먹을 방법`,
    '- 단톡방에서 받은 피드백 중 헷갈리는 것',
    '- 다음 주 적용할 한 가지 목표(Goal) 확정',
  ];
  const themed = isPT
    ? [
        '- 내 발음/인토네이션에서 가장 "한국어스러운" 부분 1개 꼭 짚어달라 요청',
        '- 지난 주 작성한 문장 중 가장 어색했던 3개 리뷰 요청',
        `- "${title}"에서 기대하는 구체적 결과 말로 표현`,
      ]
    : [
        `- "${title}" 핵심 표현 3개를 내 업무 상황에 바로 적용`,
        '- 롤플레이에서 내가 말할 오프닝 문장 1개 준비',
        '- 이번 주 표현 중 회의에서 꼭 써볼 표현 1개 선정',
      ];
  const out = [...themed, ...common];
  const hasExisting = (existing || '').trim();
  return (hasExisting ? '' : '') + out.join('\n');
}

function aiPolishNotes(raw) {
  const text = (raw || '').trim();
  if (!text) {
    return [
      '[배운 표현]',
      '- ',
      '',
      '[액션 아이템]',
      '- ',
      '',
      '[인상적이었던 피드백]',
      '- ',
      '',
      '[다음 주 적용]',
      '- ',
    ].join('\n');
  }
  // Super-lightweight structuring: group lines into a template
  const lines = text.split('\n').map(s => s.trim()).filter(Boolean);
  const buckets = { expr: [], action: [], feedback: [], misc: [] };
  const challengeRegex = challengeWordRegex('i');
  lines.forEach(l => {
    const low = l.toLowerCase();
    const hasChallengeWord = challengeRegex ? challengeRegex.test(low) : false;
    if (/^(\[?배운|표현|phrase|express|vocab)/i.test(l) || hasChallengeWord) buckets.expr.push(l.replace(/^[-\*\s]+/, ''));
    else if (/액션|todo|다음|할일|action/i.test(l)) buckets.action.push(l.replace(/^[-\*\s]+/, ''));
    else if (/피드백|feedback|코칭|지적/i.test(l)) buckets.feedback.push(l.replace(/^[-\*\s]+/, ''));
    else buckets.misc.push(l.replace(/^[-\*\s]+/, ''));
  });
  const out = [];
  const add = (head, arr) => {
    out.push(head);
    if (arr.length) arr.forEach(x => out.push('- ' + x));
    else out.push('- ');
    out.push('');
  };
  add('[배운 표현]', buckets.expr);
  add('[액션 아이템]', buckets.action);
  add('[인상적이었던 피드백]', buckets.feedback);
  if (buckets.misc.length) add('[기타 메모]', buckets.misc);
  add('[다음 주 적용]', []);
  return out.join('\n').trim();
}

function aiKrToEn(korean) {
  // Tiny heuristic translator: leaves a clean bilingual template for AI polishing.
  // Empty-state example is derived from today's first word so it stays in sync with
  // whatever Day 1-20 vocabulary is currently loaded.
  const text = (korean || '').trim();
  if (!text) {
    const firstWord = allChallengeWords()[0] || 'today\'s phrase';
    return `- I want to clarify how to use "${firstWord}" in real meetings.\n- Could you give me 3 natural closings I can use to end a status meeting?`;
  }
  const lines = text.split('\n').map(s => s.trim()).filter(Boolean);
  const map = [
    ['회의', 'meeting'], ['발표', 'presentation'], ['피드백', 'feedback'], ['목표', 'goal'],
    ['다음 주', 'next week'], ['지난 주', 'last week'], ['이번 주', 'this week'],
    ['맞았는지', 'was right'], ['차이', 'difference'], ['표현', 'expression'], ['롤플레이', 'role-play'],
    ['질문', 'question'], ['확인', 'check'], ['업무', 'work'], ['프로젝트', 'project'],
  ];
  return lines.map(l => {
    let en = l.replace(/^[-\*\s]+/, '');
    map.forEach(([k, e]) => { en = en.split(k).join(e); });
    // Strip leftover hangul and tidy spacing
    const clean = en.replace(/[가-힣]+/g, '__').replace(/\s+/g, ' ').trim();
    return `- Korean: ${l.replace(/^[-\*\s]+/, '')}\n  → English draft: Could you help me with ${clean.replace(/__/g, 'this')}?`;
  }).join('\n');
}

function aiSummarize(meta, notes) {
  const mn = (notes.meeting_notes || '').trim();
  const tp = (notes.talk_points || '').trim();
  if (!mn && !tp) return '아직 적힌 내용이 부족해요. 몇 줄만 먼저 써보면 요약 드릴게요. ✍️';
  const lines = [];
  lines.push(`📌 ${meta.title}`);
  lines.push('');
  if (tp) {
    const count = tp.split('\n').filter(s => s.trim()).length;
    lines.push(`• 말할 거리 ${count}개 준비됨`);
  }
  if (mn) {
    const len = mn.length;
    const low = mn.toLowerCase();
    const seen = new Set();
    allChallengeWords().forEach((w) => {
      const key = w.toLowerCase();
      if (!key || seen.has(key)) return;
      if (low.includes(key)) { seen.add(key); }
    });
    const keywords = Array.from(seen).map((w) => `"${w}"`);
    lines.push(`• 회의록 ${len}자 기록`);
    if (keywords.length) lines.push(`• 등장한 핵심 표현: ${keywords.join(', ')}`);
  }
  lines.push('');
  lines.push(`💡 다음 주 적용 TIP: 회의록에서 가장 인상 깊었던 표현 1개를 내일 이메일이나 슬랙에서 한 번 써보세요.`);
  return lines.join('\n');
}

/* ============================================================
   MEETING CLOUD SYNC — Supabase if configured, else skip
   ============================================================ */
async function cloudSaveMeetingNote(meetingId) {
  const notes = state.meeting_notes[meetingId] || {};
  if (!hasSupabase()) {
    // No cloud configured — simulate success so UX still feels right, but mark as local
    await new Promise(r => setTimeout(r, 320));
    return { ok: false, reason: 'local-only' };
  }
  try {
    await supabaseRpc('upsert_meeting_note', {
      p_user: memberKey(),
      p_cohort: CHALLENGE.cohort,
      p_meeting_id: meetingId,
      p_talk_points: notes.talk_points || '',
      p_meeting_notes: notes.meeting_notes || '',
      p_updated_at: new Date().toISOString(),
    });
    return { ok: true };
  } catch (e) {
    return { ok: false, reason: 'error', error: String(e.message || e) };
  }
}

// Debounced cloud sync — fires 1.5s after last edit
function scheduleCloudSync(meetingId) {
  window.__mnSyncTimers = window.__mnSyncTimers || {};
  if (window.__mnSyncTimers[meetingId]) clearTimeout(window.__mnSyncTimers[meetingId]);
  if (!hasSupabase()) return; // local-only — no background sync
  window.__mnSyncTimers[meetingId] = setTimeout(async () => {
    window.__mnSync = window.__mnSync || {};
    const prev = window.__mnSync[meetingId] || { status: 'cloud' };
    window.__mnSync[meetingId] = { status: 'syncing', lastSaved: prev.lastSaved };
    if (currentPage === 'meeting-notes' && window.__currentMeetingId === meetingId) render();
    const res = await cloudSaveMeetingNote(meetingId);
    const now = new Date();
    const when = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
    window.__mnSync[meetingId] = { status: res.ok ? 'cloud' : 'local', lastSaved: when };
    if (currentPage === 'meeting-notes' && window.__currentMeetingId === meetingId) render();
  }, 1500);
}

function generateMeetingMarkdown(meetingId) {
  let meta = null;
  let isPT = false;
  if (meetingId.startsWith('pt')) {
    isPT = true;
    const idx = parseInt(meetingId.replace('pt', ''), 10) - 1;
    meta = CHALLENGE.premium.pt_sessions[idx];
  } else {
    const n = parseInt(meetingId.replace('m', ''), 10);
    meta = CHALLENGE.premium.weekly_meetings.find(x => x.n === n);
  }
  const notes = state.meeting_notes[meetingId] || { talk_points: '', meeting_notes: '' };
  const lines = [];
  lines.push(`# ${isPT ? 'PT' : 'Weekly Meeting'} — ${meta.title}`);
  lines.push('');
  lines.push(`- **Date**: ${meta.date}`);
  lines.push(`- **Cohort**: ${CHALLENGE.cohort}`);
  lines.push(`- **Focus**: ${meta.desc}`);
  lines.push('');
  lines.push('## 🗣 Talking points');
  lines.push('');
  lines.push(notes.talk_points || '_(작성 전)_');
  lines.push('');
  lines.push('## 📝 Meeting notes');
  lines.push('');
  lines.push(notes.meeting_notes || '_(작성 전)_');
  lines.push('');
  lines.push(`*Exported from YouBuddy 비즈니스 영어 챌린지 ${CHALLENGE.cohort}*`);
  return lines.join('\n');
}

      } else if (chosen === oi) {

      <div class="t-small" style="margin-top:2px;">/20 days</div>
    </div>
    <div class="card card-flat" style="padding:14px 12px;text-align:center;">
      <div class="kicker">STREAK</div>
      <div class="serif" style="font-size:28px;line-height:1;margin-top:4px;">${meMember().streak}</div>
      <div class="t-small" style="margin-top:2px;">🔥 연속일</div>
    </div>
    <div class="card card-flat" style="padding:14px 12px;text-align:center;">
      <div class="kicker">SENTENCES</div>
      <div class="serif" style="font-size:28px;line-height:1;margin-top:4px;">${Object.values(state.sentences).filter(Boolean).length}</div>
      <div class="t-small" style="margin-top:2px;">개 작성</div>
    </div>`;
  page.appendChild(statsGrid);

  // 3. 목표 — 온보딩에서 입력한 본인 목표를 그대로 보여줌. 편집 가능.
  const goalCard = el('div', { class: 'card', style: { marginTop: '18px' } });
  const hasGoal = !!(state.goal && state.goal.trim());
  goalCard.innerHTML = `
    <div class="row-between" style="align-items:flex-start;">
      <div>
        <div class="kicker">MY GOAL · 이번 챌린지 목표</div>
        <h3 class="h3" style="margin-top:6px;margin-bottom:4px;">${hasGoal ? '4주 뒤 이렇게 되고 싶어요' : '아직 목표를 정하지 않았어요'}</h3>
      </div>
      <button id="__editGoalBtn" style="background:transparent;border:none;font-size:11px;color:var(--orange-dark);cursor:pointer;padding:4px 8px;">${hasGoal ? '수정' : '+ 추가'}</button>
    </div>
    ${hasGoal
      ? `<div style="margin-top:10px;padding:14px 16px;background:var(--orange-ghost);border-radius:14px;border:1px solid rgba(240,125,56,0.22);">
           <div style="display:flex;gap:10px;align-items:flex-start;">
             <span style="font-size:18px;line-height:1.1;flex-shrink:0;">🎯</span>
             <p style="margin:0;font-size:14px;line-height:1.55;color:var(--ink);letter-spacing:-0.01em;word-break:keep-all;">${escapeHtml(state.goal)}</p>
           </div>
         </div>`
      : `<div style="margin-top:10px;padding:14px 16px;background:var(--paper);border-radius:14px;border:1px dashed var(--line);">
           <p style="margin:0;font-size:13px;color:var(--muted);line-height:1.55;">수정 버튼을 눌러 이번 챌린지에서 이루고 싶은 목표를 한 줄로 적어보세요.</p>
         </div>`
    }
  `;
  page.appendChild(goalCard);
  // Wire up goal edit (opens the Settings modal, which has a goal field too, or a prompt)
  setTimeout(() => {
    const btn = document.getElementById('__editGoalBtn');
    if (btn) btn.onclick = () => {
      const next = window.prompt('이번 챌린지 목표를 수정해요', state.goal || '');
      if (next === null) return;
      state.goal = next.trim();
      saveState();
      showToast('🎯 목표를 업데이트했어요');
      render();
    };
  }, 0);

  // 3.5 내 대본 모음 카드 — quick link to scripts page
  const scriptsCard = el('div', {
    class: 'card',
    style: {
      marginTop: '18px',
      padding: '16px 18px',
      cursor: 'pointer',
      background: 'linear-gradient(165deg, #FFFDF7 0%, #FBE7D2 100%)',
      borderColor: 'rgba(240,125,56,0.22)',
    },
    onClick: () => go('scripts'),
  });
  const sentenceCount = Object.values(state.sentences || {}).filter((v) => v && v.trim()).length;
  scriptsCard.innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;">
      <div style="width:42px;height:42px;border-radius:14px;background:var(--orange);color:#fff;display:grid;place-items:center;font-size:18px;flex-shrink:0;">📝</div>
      <div style="flex:1;min-width:0;">
        <div class="kicker" style="color:var(--orange-dark);">MY SCRIPTS</div>
        <div style="font-size:15px;font-weight:800;letter-spacing:-0.02em;margin-top:4px;">내 대본 모음 — Notion 내보내기</div>
        <div style="font-size:11.5px;color:var(--ink-soft);margin-top:2px;">지금까지 ${sentenceCount}개 문장</div>
      </div>
      <span style="color:var(--orange-dark);">${Icon('arrowRight', 14)}</span>
    </div>`;
  page.appendChild(scriptsCard);

  // 4. 저장한 표현 — 단어 + 유의어 + 커뮤니티 문장 (단일 단어장, 필터 탭)
  const bookmarkedEntries = [];
  const synonymEntries = [];
  CHALLENGE.weeks.forEach(w => {
    w.days.forEach(dy => {
      dy.words.forEach((word, idx) => {
        const key = `d${dy.day}-${idx}`;
        if (state.bookmarks[key]) {
          bookmarkedEntries.push({ key, day: dy.day, weekN: w.n, word });
        }
        (word.syn || []).forEach((syn) => {
          const synKey = `${key}::${syn}`;
          if (state.saved_syns?.[synKey]) {
            synonymEntries.push({ key: synKey, day: dy.day, weekN: w.n, parent: word.en, syn });
          }
        });
      });
    });
  });
  const savedCommunityPosts = Array.from(new Map(
    [
      ...Object.values(communityFeedCache).flatMap((entry) => entry?.rows || []).map((post) => ({
        id: post.id,
        user: post.user,
        word: post.word,
        sentence: post.sentence,
        avatar: (post.user || '').slice(0, 2),
        avatarClass: post.member_key === memberKey() ? 'orange' : 'cream',
      })),
      ...COMMUNITY_POSTS,
    ]
      .filter((post) => state.community_bookmarks?.[post.id])
      .map((post) => [post.id, post])
  ).values());
  const totalSaved = bookmarkedEntries.length + synonymEntries.length + savedCommunityPosts.length;
  const tab = state.savedTab || 'all';
  const bookmarkCard = el('div', { class: 'card', style: { marginTop: '18px', padding: '18px' } });
  const bookHead = el('div', { class: 'row-between' });
  bookHead.innerHTML = `
    <div>
      <div class="kicker">MY WORD DECK · 저장한 표현</div>
      <h3 class="h3" style="margin-top:6px;">단어장 <span class="mono" style="color:var(--muted);font-weight:500;">· ${totalSaved}개</span></h3>
    </div>
    <span class="icon-btn" style="width:34px;height:34px;border-radius:12px;background:var(--orange-ghost);border-color:var(--orange-soft);color:var(--orange-dark);">${Icon('bookmarkFill', 14)}</span>`;
  bookmarkCard.appendChild(bookHead);

  // Filter tabs: 전체 / 단어 / 유의어 / 문장
  const tabs = [
    { key: 'all',   label: '전체',  count: totalSaved },
    { key: 'word',  label: '단어',  count: bookmarkedEntries.length },
    { key: 'syn',   label: '유의어', count: synonymEntries.length },
    { key: 'post',  label: '문장',  count: savedCommunityPosts.length },
  ];
  const tabBar = el('div', { style: { display: 'flex', gap: '6px', marginTop: '12px', flexWrap: 'wrap' } });
  tabs.forEach((t) => {
    const active = tab === t.key;
    const btn = el('button', {
      style: {
        border: 'none',
        background: active ? 'var(--ink)' : 'var(--paper)',
        color: active ? 'var(--cream)' : 'var(--ink)',
        borderRadius: '999px',
        padding: '8px 14px',
        fontSize: '11.5px',
        fontWeight: active ? '700' : '500',
        cursor: 'pointer',
      },
      onClick: () => { state.savedTab = t.key; saveState(); render(); },
    });
    btn.innerHTML = `${t.label} <span style="font-family:var(--font-mono);opacity:0.72;">${t.count}</span>`;
    tabBar.appendChild(btn);
  });
  bookmarkCard.appendChild(tabBar);

  if (!totalSaved) {
    bookmarkCard.appendChild(el('p', { class: 't-body', style: { marginTop: '14px', fontSize: '13px', color: 'var(--muted)' } },
      'Day 노트에서 단어/유의어에 🔖 해보세요. 여기에 한 통에 모여요.'));
  } else {
    const list = el('div', { style: { marginTop: '14px', display: 'flex', flexDirection: 'column', gap: '8px' } });
    const showWords = tab === 'all' || tab === 'word';
    const showSyns = tab === 'all' || tab === 'syn';
    const showPosts = tab === 'all' || tab === 'post';

    if (showWords && bookmarkedEntries.length) {
      if (tab === 'all') list.appendChild(el('div', { class: 'kicker', style: { color: 'var(--muted)' } }, `단어 · ${bookmarkedEntries.length}`));
      bookmarkedEntries.forEach(({ key, day, weekN, word }) => {
        const row = el('div', {
          style: {
            display: 'flex', alignItems: 'center', gap: '12px',
            padding: '10px 12px', borderRadius: '14px', background: 'var(--paper)',
            cursor: 'pointer',
          },
          onClick: () => go('day', { week: weekN, day }),
        });
        row.innerHTML = `
          <span class="mono" style="font-size:10px;color:var(--muted);min-width:30px;">D${day}</span>
          <div style="flex:1;min-width:0;">
            <div style="font-size:14.5px;font-weight:800;color:var(--orange);line-height:1.2;">${escapeHtml(word.en)}</div>
            <div class="t-small" style="margin-top:2px;font-size:12px;color:var(--ink-soft);">${escapeHtml(word.def)}</div>
          </div>
          <button class="icon-btn" style="width:30px;height:30px;border-radius:10px;background:transparent;border:none;color:var(--orange);" onclick="event.stopPropagation(); window.__toggleBookmark('${key}')">${Icon('bookmarkFill', 13)}</button>`;
        list.appendChild(row);
      });
    }

    if (showSyns && synonymEntries.length) {
      if (tab === 'all') list.appendChild(el('div', { class: 'kicker', style: { color: 'var(--muted)', marginTop: '6px' } }, `유의어 · ${synonymEntries.length}`));
      synonymEntries.forEach(({ key, day, weekN, parent, syn }) => {
        const row = el('div', {
          style: {
            display: 'flex', alignItems: 'center', gap: '12px',
            padding: '10px 12px', borderRadius: '14px', background: 'rgba(245,239,228,0.55)',
            border: '1px solid rgba(240,125,56,0.14)',
            cursor: 'pointer',
          },
          onClick: () => go('day', { week: weekN, day }),
        });
        row.innerHTML = `
          <span class="mono" style="font-size:10px;color:var(--muted);min-width:30px;">D${day}</span>
          <div style="flex:1;min-width:0;">
            <div style="font-size:13.5px;font-weight:800;color:var(--ink);line-height:1.2;">${escapeHtml(syn)}</div>
            <div class="t-small" style="margin-top:2px;font-size:11.5px;color:var(--ink-soft);">≈ ${escapeHtml(parent)}</div>
          </div>
          <button class="icon-btn" style="width:30px;height:30px;border-radius:10px;background:transparent;border:none;color:var(--orange);" onclick="event.stopPropagation(); window.__toggleSynBookmark('${key}')">${Icon('bookmarkFill', 13)}</button>`;
        list.appendChild(row);
      });
    }

    if (showPosts && savedCommunityPosts.length) {
      if (tab === 'all') list.appendChild(el('div', { class: 'kicker', style: { color: 'var(--muted)', marginTop: '6px' } }, `커뮤니티 문장 · ${savedCommunityPosts.length}`));
      savedCommunityPosts.forEach((post) => {
        const row = el('div', {
          style: {
            display: 'flex', alignItems: 'flex-start', gap: '12px',
            padding: '12px', borderRadius: '14px', background: 'var(--paper)',
            cursor: 'pointer',
          },
          onClick: () => go('community'),
        });
        row.innerHTML = `
          <div class="avatar ${post.avatarClass}" style="width:32px;height:32px;border-radius:11px;font-size:11px;flex-shrink:0;">${post.avatar}</div>
          <div style="flex:1;min-width:0;">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
              <span style="font-size:12.5px;font-weight:800;color:var(--ink);">${escapeHtml(post.user)}</span>
              <span class="mono" style="font-size:10px;color:var(--muted);">${escapeHtml(post.word)}</span>
            </div>
            <div style="margin-top:3px;font-size:12.5px;line-height:1.45;color:var(--ink);font-weight:600;">${escapeHtml(post.sentence)}</div>
          </div>
          <button class="icon-btn" style="width:30px;height:30px;border-radius:10px;background:transparent;border:none;color:var(--orange);flex-shrink:0;" onclick="event.stopPropagation(); window.__toggleCommunityBookmark('${post.id}')">${Icon('bookmarkFill', 13)}</button>`;
        list.appendChild(row);
      });
    }

    bookmarkCard.appendChild(list);
  }
  page.appendChild(bookmarkCard);

  // 5. Tier section (moved to bottom near export)
  const tierCard = el('div', { class: 'card', style: { marginTop: '18px' } });
  const tierHtml = state.tier === 'premium' ? `
    <div class="kicker">PREMIUM UNLOCKED · ₩169,000</div>
    <h3 class="h2" style="margin-top:6px;"><span class="serif">Welcome</span> to premium</h3>
    <p class="t-body" style="margin-top:6px;">프리미엄 전용 PT · 주간 미팅 · 퀴즈 · Certification이 열려있어요.</p>
    <button class="btn btn-ghost btn-sm" style="margin-top:12px;" onclick="window.__resetTier()">베이직으로 되돌리기</button>
  ` : `
    <div class="kicker">BASIC MEMBER · ₩59,000</div>
    <h3 class="h2" style="margin-top:6px;"><span class="serif">Upgrade</span> to premium</h3>
    <p class="t-body" style="margin-top:6px;">PT 세션, 주간 Zoom 미팅 4회, 개인 퀴즈, 최종 Certification을 함께 받아요.</p>
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;">
      <button class="btn btn-lilac btn-sm" onclick="window.__openPremiumGate()">프리미엄 코드 입력</button>
      <a href="https://www.latpeed.com/products/en0l_" target="_blank" class="btn btn-ghost btn-sm" style="text-decoration:none;">업그레이드 (₩169,000)</a>
    </div>`;
  tierCard.innerHTML = tierHtml;
  page.appendChild(tierCard);

  // Notion 내보내기는 20일(마지막 Day) 인증까지 끝낸 뒤에만 노출 — 중간에 내보내면 반쪽짜리 기록이 돼서.
  const totalDays = CHALLENGE.total_days || 20;
  const lastDayDone = !!state.verified['d' + totalDays];
  const reachedLastDay = (state.currentDay || 0) >= totalDays;
  if (lastDayDone || reachedLastDay) {
    const exportCard = el('div', { class: 'card', style: { marginTop: '20px', padding: '18px', background: 'linear-gradient(135deg, #FFF3E3, #FDE2C6)', border: '1px solid var(--orange-soft)' } });
    exportCard.innerHTML = `
      <div style="display:flex;gap:12px;align-items:flex-start;">
        <div style="width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:18px;font-family:var(--font-serif);font-style:normal;font-weight:700;color:var(--ink);">N</div>
        <div style="flex:1;">
          <div class="kicker" style="color:var(--green);">20일 완주 보상</div>
          <div class="h3" style="margin-top:4px;">Notion으로 내보내기</div>
          <div class="t-small" style="margin-top:4px;">내 학습 기록과 문장들을 Notion에 바로 붙여넣을 수 있는 형식으로 복사해요</div>
        </div>
      </div>`;
    const exportActions = el('div', { style: { display: 'flex', gap: '8px', marginTop: '14px' } });
    const exportPageBtn = el('button', { class: 'btn btn-ink', style: { flex: '1', justifyContent: 'center' }, onClick: () => go('export') });
    exportPageBtn.innerHTML = `${Icon('download', 16)} 노션 내보내기`;
    exportActions.appendChild(exportPageBtn);
    const copyBtn = el('button', { class: 'btn btn-ghost', onClick: () => copyMarkdown() });
    copyBtn.textContent = 'Notion용 복사';
    exportActions.appendChild(copyBtn);
    exportCard.appendChild(exportActions);
    page.appendChild(exportCard);
  }

  // 로그아웃 — 베타 계정 전용 (유버디 / 이규태 / 이지흔)
  const BETA_ACCOUNTS = new Set(['유버디', '이규태', '이지흔']);
  if (BETA_ACCOUNTS.has(state.name)) {
    const logoutCard = el('div', {
      class: 'card',
      style: {
        marginTop: '18px',
        padding: '16px 18px',
        background: 'var(--paper)',
        borderColor: 'var(--line)',
      }
    });
    logoutCard.innerHTML = `
      <div class="kicker" style="color:var(--muted);">SESSION · 베타 계정</div>
      <div class="t-small" style="margin-top:6px;color:var(--ink-soft);line-height:1.5;">
        다른 계정으로 테스트할 때 로그아웃하면 이 기기의 로그인 상태만 초기화돼요. 서버에 저장된 내 진행 기록은 유지됩니다.
      </div>`;
    const logoutBtn = el('button', {
      class: 'btn btn-ghost',
      style: {
        marginTop: '12px',
        width: '100%',
        justifyContent: 'center',
        color: '#B04A2B',
        borderColor: 'rgba(176,74,43,0.25)',
        background: '#fff',
      },
      onClick: () => window.__logoutBeta(),
    });
    logoutBtn.innerHTML = `${Icon('arrowRight', 14)} 로그아웃`;
    logoutCard.appendChild(logoutBtn);
    page.appendChild(logoutCard);
  }

  return page;
}

/* ============================================================
   COMMUNITY PAGE
   ============================================================ */
function CommunityPage() {
  const page = el('div', { class: 'page', style: { paddingTop: '24px', paddingLeft: '22px', paddingRight: '22px' } });
  const filterState = state.communityFilter || 'all';
  const likedMap = state.community_likes || {};
  const savedMap = state.community_bookmarks || {};
  // 날짜 필터 — 기본값은 오늘. 달력에서 지난 날짜 고를 수 있음.
  const selectedDay = state.communityDay || state.currentDay;
  const selDayObj = getDay(selectedDay);

  const header = el('div', {
    style: {
      display: 'grid',
      gridTemplateColumns: '56px 1fr 56px',
      alignItems: 'start',
      gap: '12px',
    }
  });
  const back = el('button', { class: 'icon-btn', style: { width: '56px', height: '56px', borderRadius: '20px' }, onClick: () => go('home') });
  back.innerHTML = Icon('arrowLeft', 20);
  header.appendChild(back);
  const title = el('div', { style: { textAlign: 'center', paddingTop: '2px' } });
  title.innerHTML = `<h2 style="margin:0;font-size:21px;line-height:1.2;letter-spacing:-0.02em;">커뮤니티</h2><p style="margin:6px 0 0;font-size:12px;line-height:1.4;color:var(--muted);">${selectedDay === state.currentDay ? '오늘' : `Day ${selectedDay}`} 동료들의 문장</p>`;
  header.appendChild(title);
  // 달력 아이콘 → 지난 날짜 탐색
  const calBtn = el('button', {
    class: 'icon-btn',
    style: {
      width: '56px', height: '56px', borderRadius: '20px',
      background: state.communityDay && state.communityDay !== state.currentDay ? 'var(--orange-ghost)' : 'transparent',
      color: state.communityDay && state.communityDay !== state.currentDay ? 'var(--orange-dark)' : 'var(--ink)',
      borderColor: state.communityDay && state.communityDay !== state.currentDay ? 'rgba(240,125,56,0.28)' : 'var(--line)',
    },
    onClick: () => { state.communityDayPickerOpen = !state.communityDayPickerOpen; render(); },
    title: '날짜 선택',
  });
  calBtn.innerHTML = Icon('calendar', 18);
  header.appendChild(calBtn);
  page.appendChild(header);

  // Day picker drawer — compact 20-day grid with status dots
  if (state.communityDayPickerOpen) {
    const picker = el('div', {
      style: {
        marginTop: '14px',
        padding: '16px',
        borderRadius: '22px',
        background: 'var(--cream)',
        border: '1px solid var(--line)',
      }
    });
    picker.innerHTML = `<div class="kicker" style="margin-bottom:10px;">날짜 선택 · Day 1–20</div>`;
    const grid = el('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: '6px' } });
    for (let d = 1; d <= 20; d++) {
      const isSel = d === selectedDay;
      const isToday = d === state.currentDay;
      const isDone = !!state.verified['d' + d];
      const bg = isSel ? 'var(--ink)'
        : isToday ? 'var(--orange-ghost)'
        : isDone ? 'var(--paper)'
        : '#FFFDF7';
      const color = isSel ? 'var(--cream)' : (isToday ? 'var(--orange-dark)' : 'var(--ink)');
      const btn = el('button', {
        style: {
          padding: '10px 6px',
          borderRadius: '10px',
          background: bg,
          color,
          border: '1px solid ' + (isSel ? 'var(--ink)' : 'var(--line-soft)'),
          fontSize: '12px',
          fontWeight: isSel ? '800' : '600',
          cursor: d <= state.currentDay ? 'pointer' : 'not-allowed',
          opacity: d > state.currentDay ? 0.4 : 1,
          position: 'relative',
        },
        disabled: d > state.currentDay,
        onClick: () => {
          state.communityDay = d;
          state.communityDayPickerOpen = false;
          saveState();
          render();
        },
      });
      const dot = isDone ? '<span style="position:absolute;top:4px;right:5px;width:5px;height:5px;border-radius:3px;background:var(--green);"></span>' : '';
      btn.innerHTML = `${dot}<span style="font-family:var(--font-mono);">D${d}</span>`;
      grid.appendChild(btn);
    }
    picker.appendChild(grid);
    const resetRow = el('div', { style: { display: 'flex', justifyContent: 'space-between', marginTop: '12px', alignItems: 'center' } });
    resetRow.innerHTML = `<span class="t-small" style="font-size:11px;color:var(--muted);">회색 점 = 내가 인증한 날</span>`;
    const todayBtn = el('button', {
      class: 'btn btn-ghost btn-sm',
      style: { padding: '6px 12px', fontSize: '11px', borderRadius: '999px' },
      onClick: () => { state.communityDay = state.currentDay; state.communityDayPickerOpen = false; saveState(); render(); },
    }, '오늘로 돌아가기');
    resetRow.appendChild(todayBtn);
    picker.appendChild(resetRow);
    page.appendChild(picker);
  }

  const hero = el('div', { style: { padding: '24px 8px 12px' } });
  const dateStr = formatDateKR(dayDate(selectedDay));
  hero.innerHTML = `
    <div class="kicker">${selectedDay === state.currentDay ? 'TODAY' : 'LOOKING BACK'} · DAY ${selectedDay} · ${dateStr}</div>
    <h1 style="margin:10px 0 0;font-size:26px;line-height:1.12;letter-spacing:-0.03em;font-weight:700;">다같이 제출한 문장</h1>`;
  page.appendChild(hero);

  // Storage policy mini-banner
  const policyNote = el('div', {
    style: {
      marginTop: '4px',
      padding: '10px 12px',
      borderRadius: '12px',
      background: 'var(--paper)',
      fontSize: '11px',
      lineHeight: '1.5',
      color: 'var(--ink-soft)',
      display: 'flex',
      alignItems: 'center',
      gap: '8px',
    }
  });
  policyNote.innerHTML = `<span style="font-size:13px;">💡</span><span>제출 시 저장되는 건 <b>영어 원문 1줄</b>뿐이에요. AI 리뷰본은 내 기록실에만 남아요.</span>`;
  page.appendChild(policyNote);

  // Filter chips derive from the selected day's 3 words so content swaps (Day 1~20 rewrites) flow through automatically.
  const dayWords = (selDayObj && Array.isArray(selDayObj.words)) ? selDayObj.words : [];
  const filters = ['all', ...dayWords.map((w) => (w.en || '').toUpperCase()).filter(Boolean)];
  // If stored filter no longer matches today's words (e.g. user changed day), reset to 'all' in-view only.
  const activeFilter = filters.includes(filterState) ? filterState : 'all';
  const chips = el('div', { class: 'hidden-scroll', style: { display: 'flex', gap: '8px', overflowX: 'auto', padding: '14px 0 14px', marginRight: '-22px' } });
  filters.forEach((f) => {
    const active = activeFilter === f;
    const chip = el('button', {
      style: {
        border: 'none',
        background: active ? 'var(--ink)' : '#F5EFE4',
        color: active ? 'var(--cream)' : 'var(--orange-dark)',
        borderRadius: '999px',
        padding: '10px 16px',
        fontSize: '11px',
        lineHeight: '1',
        flexShrink: '0',
        letterSpacing: '0.06em',
        textTransform: 'uppercase',
      },
      onClick: () => { state.communityFilter = f; saveState(); render(); },
    });
    chip.innerHTML = f === 'all' ? '전체' : `<span style="font-size:11px;color:${active ? 'var(--cream)' : 'var(--orange)'};font-weight:700;">${f}</span>`;
    chips.appendChild(chip);
  });
  page.appendChild(chips);

  const dayData = selDayObj;
  let basePosts = [];
  if (hasSupabase()) {
    const remotePosts = requestCommunityPosts(selectedDay);
    basePosts = remotePosts.map((post) => ({
      id: post.id,
      sourceKey: post.source_key,
      user: post.user,
      team: post.team || 'A',
      avatar: (post.user || '').slice(0, 2),
      avatarClass: post.member_key === memberKey() ? 'orange' : 'cream',
      word: post.word || '',
      time: '방금',
      sentence: post.sentence,
      translation: post.translation || '',
      likesCount: Number(post.likes_count || 0),
      likedByMe: !!post.liked_by_me,
      comments: Array.isArray(post.comments) ? post.comments : [],
      mine: post.member_key === memberKey(),
      edited: !!post.updated_at && post.updated_at !== post.created_at,
      member_key: post.member_key,
      tier: post.tier,
      role: post.role,
      timezone_text: post.timezone_text,
    }));
  } else {
    const myName = state.name || '박지혜';
    const myPosts = [];
    if (dayData && dayData.words) {
      dayData.words.forEach((w, i) => {
        const raw = state.sentences[`d${selectedDay}-${i}`];
        if (!raw || !raw.trim()) return;
        const submitted = state.submitted?.[`d${selectedDay}-${i}`];
        if (!submitted) return;
        const edit = state.community_edits?.[`me-d${selectedDay}-${i}`];
        myPosts.push({
          id: `me-d${selectedDay}-${i}`,
          sourceKey: `d${selectedDay}-${i}`,
          user: myName,
          team: 'A',
          avatar: myName.slice(0, 1),
          avatarClass: 'orange',
          word: (w.en || '').toUpperCase(),
          time: '방금',
          sentence: edit?.sentence || raw,
          translation: edit?.translation || '',
          likesCount: 0,
          likedByMe: false,
          comments: 0,
          mine: true,
          edited: !!edit,
        });
      });
    }
    const peers = peerSentencesFor(selectedDay).map((p, idx) => {
      const w = dayData && dayData.words ? (dayData.words[p.wordIdx] || dayData.words[0]) : { en: '' };
      return {
        id: `peer-d${selectedDay}-${idx}`,
        user: p.user,
        team: p.team,
        avatar: p.avatar,
        avatarClass: idx % 2 === 0 ? 'cream' : 'ink',
        word: (w.en || '').toUpperCase(),
        time: p.time,
        sentence: p.sentence,
        translation: p.translation,
        likesCount: p.likes || 0,
        likedByMe: false,
        comments: 0,
      };
    });
    const curated = selectedDay === state.currentDay ? COMMUNITY_POSTS : [];
    basePosts = [...myPosts, ...peers, ...curated];
  }
  if (activeFilter !== 'all') basePosts = basePosts.filter((p) => (p.word || '').toUpperCase() === activeFilter);

  const stack = el('div', { style: { marginTop: '4px' } });
  basePosts.forEach((post) => {
    const member = memberByRef(post.user) || (post.mine ? meMember() : null);
    const role = memberRole(member);
    const tz = memberTimezoneText(member);
    const liked = hasSupabase() ? !!post.likedByMe : !!likedMap[post.id];
    const saved = !!savedMap[post.id];
    const localComments = hasSupabase() ? (Array.isArray(post.comments) ? post.comments : []) : communityCommentsFor(post.id);
    const likeCount = hasSupabase() ? Number(post.likesCount || 0) : ((post.likesCount || 0) + (liked ? 1 : 0));
    const commentCount = Math.max(Number(Array.isArray(post.comments) ? post.comments.length : post.comments || 0), localComments.length);
    const postIdArg = jsStringLiteral(post.id);
    const sourceKeyArg = jsStringLiteral(post.sourceKey || '');
    const userArg = jsStringLiteral(post.user);
    const sentenceArg = jsStringLiteral(post.sentence);
    const row = el('div', {
      style: {
        display: 'grid',
        gridTemplateColumns: '36px 1fr',
        gap: '10px',
        padding: '10px 2px 12px',
        borderBottom: '1px solid rgba(231,221,200,0.55)',
        alignItems: 'flex-start',
      }
    });
    const wordRegex = challengeWordRegex('i');
    const highlighted = wordRegex
      ? escapeHtml(post.sentence).replace(
          wordRegex,
          '<span style="background:var(--orange-ghost);color:var(--orange-dark);padding:1px 5px;border-radius:5px;font-weight:700;">$1</span>'
        )
      : escapeHtml(post.sentence);
    const editTag = post.edited
      ? `<span style="font-size:10px;color:var(--muted);margin-left:6px;">(수정됨)</span>` : '';
    const mineEditBtn = post.mine
      ? `<button onclick="window.__editMyCommunityPost(${postIdArg}, ${sourceKeyArg})" style="background:transparent;border:none;padding:2px 6px;font-size:11px;color:var(--orange-dark);cursor:pointer;">수정</button>` : '';
    row.innerHTML = `
      <button onclick="window.__openMemberCard(${userArg})" style="background:transparent;border:none;padding:0;">
        <div class="avatar ${post.avatarClass}" style="width:34px;height:34px;border-radius:10px;font-size:12px;">${post.avatar}</div>
      </button>
      <div style="min-width:0;">
        <div style="display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;">
          <button onclick="window.__openMemberCard(${userArg})" style="background:transparent;border:none;padding:0;font-size:12.5px;font-weight:700;color:var(--ink);letter-spacing:-0.01em;cursor:pointer;">${escapeHtml(post.user)}</button>
          ${premiumPill(member)}
          <span style="font-size:10px;color:var(--muted);">Team ${post.team}</span>
          ${role ? `<span style="font-size:10px;color:var(--ink-soft);">${escapeHtml(role)}</span>` : ''}
          ${tz ? `<span style="font-size:10px;color:var(--muted);" class="mono">${escapeHtml(tz)}</span>` : ''}
          <span style="font-size:10px;color:var(--muted);">· ${post.time}</span>
          <span style="font-size:9.5px;font-weight:700;letter-spacing:0.08em;color:var(--orange-dark);background:var(--orange-ghost);padding:2px 6px;border-radius:4px;">${escapeHtml(post.word)}</span>
          ${editTag}
        </div>
        <p style="margin:5px 0 0;font-size:13.5px;line-height:1.5;color:var(--ink);letter-spacing:-0.01em;">${highlighted}</p>
        ${post.translation ? `<p style="margin:3px 0 0;font-size:11.5px;line-height:1.45;color:var(--ink-soft);word-break:keep-all;">${escapeHtml(post.translation)}</p>` : ''}
        <div style="display:flex;gap:12px;margin-top:6px;align-items:center;">
          <button onclick="window.__toggleCommunityLike(${postIdArg})" style="background:transparent;border:none;padding:0;display:inline-flex;align-items:center;gap:3px;color:${liked ? 'var(--orange-dark)' : 'var(--muted)'};font-size:11px;font-weight:${liked ? '700' : '500'};">${Icon('flame', 10)} ${likeCount}</button>
          <button onclick="window.__commentOnCommunityPost(${postIdArg})" style="background:transparent;border:none;padding:0;display:inline-flex;align-items:center;gap:3px;color:${commentCount ? 'var(--orange-dark)' : 'var(--muted)'};font-size:11px;font-weight:${commentCount ? '700' : '500'};">${Icon('messageCircle', 10)} ${commentCount}</button>
          <button onclick="window.__speakText(${sentenceArg})" style="background:transparent;border:none;padding:0;display:inline-flex;align-items:center;gap:3px;color:var(--muted);font-size:11px;">${Icon('volume', 10)} 듣기</button>
          <button onclick="window.__toggleCommunityBookmark(${postIdArg})" style="background:transparent;border:none;padding:0;display:inline-flex;align-items:center;gap:3px;color:${saved ? 'var(--orange-dark)' : 'var(--muted)'};font-size:11px;margin-left:auto;">${Icon(saved ? 'bookmarkFill' : 'bookmark', 10)}</button>
          ${mineEditBtn}
        </div>
        ${localComments.length ? `
          <div style="margin-top:8px;display:grid;gap:6px;">
            ${localComments.slice(-2).map((comment) => `
              <div style="padding:8px 10px;border-radius:10px;background:var(--paper);font-size:11px;line-height:1.45;color:var(--ink-soft);">
                <b style="color:var(--ink);font-size:10.5px;">${escapeHtml(comment.author || '익명')}</b> ${escapeHtml(comment.text || '')}
              </div>
            `).join('')}
          </div>
        ` : ''}
      </div>`;
    stack.appendChild(row);
  });
  if (!basePosts.length) {
    stack.appendChild(el('p', { class: 't-body', style: { marginTop: '18px', fontSize: '13px', color: 'var(--muted)' } },
      '아직 올라온 문장이 없어요.'));
  }
  page.appendChild(stack);

  return page;
}

function SettingsModal() {
  const backdrop = el('div', {
    class: 'modal-backdrop',
    onClick: (e) => { if (e.target === backdrop) { showSettings = false; render(); } },
  });
  const modal = el('div', {
    class: 'modal',
    style: {
      width: 'min(92vw, 420px)',
      padding: '22px 20px 18px',
      borderRadius: '26px',
      background: '#FFFDF7',
      border: '1px solid var(--line)',
    },
  });
  const ROLE_PRESETS = ['PM', '마케터', '디자이너', '개발자', '기획자', '세일즈', '리서처', 'HR'];
  const currentRole = state.role || '';
  const currentTimezone = state.timezoneOffsetText || '+0h';
  const presetChips = ROLE_PRESETS.map((r) => {
    const active = currentRole === r;
    return `<button class="role-chip" data-role="${escapeHtml(r)}" style="border:1px solid ${active ? 'var(--ink)' : 'var(--line)'};background:${active ? 'var(--ink)' : '#FFFDF7'};color:${active ? 'var(--cream)' : 'var(--ink)'};border-radius:999px;padding:7px 14px;font-size:12px;font-weight:${active ? '700' : '500'};cursor:pointer;">${escapeHtml(r)}</button>`;
  }).join('');
  modal.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
      <div>
        <div class="kicker">SETTINGS · 설정</div>
        <h2 style="margin:6px 0 0;font-size:20px;font-weight:800;letter-spacing:-0.02em;">내 정보 관리</h2>
      </div>
      <button id="__settingsClose" class="icon-btn" style="width:36px;height:36px;border-radius:12px;" title="닫기">✕</button>
    </div>
    <p class="t-body" style="margin-top:10px;font-size:13px;color:var(--ink-soft);line-height:1.5;">이름은 코드 기준으로 유지되고, 직무와 시차는 언제든 바꿀 수 있어요.</p>
    <div style="margin-top:16px;">
      <div class="kicker" style="color:var(--muted);">이름 (수정 불가)</div>
      <div style="margin-top:6px;padding:12px 14px;border-radius:12px;background:var(--paper);color:var(--ink-soft);font-size:14px;font-weight:600;">${escapeHtml(state.name || '박지혜')}</div>
    </div>
    <div style="margin-top:14px;">
      <div class="kicker" style="color:var(--muted);">직무 프리셋</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;">${presetChips}</div>
    </div>
    <div style="margin-top:14px;">
      <div class="kicker" style="color:var(--muted);">직접 입력</div>
      <input id="__settingsRoleInput" class="input" type="text" placeholder="예: 프로덕트 디자이너" value="${escapeHtml(currentRole)}" style="margin-top:8px;" />
    </div>
    <div style="margin-top:14px;">
      <div class="kicker" style="color:var(--muted);">한국 대비 시차</div>
      <input id="__settingsTimezoneInput" class="input" type="text" placeholder="예: +0h, -13h, +1:30h" value="${escapeHtml(currentTimezone)}" style="margin-top:8px;" />
    </div>
    ${state.isOperator ? `
      <div style="margin-top:14px;padding:14px;border-radius:14px;background:#FFF7EF;border:1px solid rgba(240,125,56,0.18);">
        <div class="kicker" style="color:var(--orange-dark);">OPERATOR ONLY</div>
        <div style="margin-top:6px;font-size:13px;line-height:1.55;color:var(--ink);font-weight:700;">가입 화면부터 다시 확인할 수 있어요.</div>
        <button id="__settingsResetApp" class="btn btn-ghost btn-full" style="margin-top:12px;border-color:rgba(240,125,56,0.24);">가입부터 다시 시작</button>
      </div>
    ` : ''}
    <div style="display:flex;gap:8px;margin-top:20px;">
      <button id="__settingsCancel" class="btn btn-ghost" style="flex:1;">취소</button>
      <button id="__settingsSave" class="btn btn-primary" style="flex:1;">저장</button>
    </div>
  `;
  backdrop.appendChild(modal);
  // Wire up handlers after mount
  setTimeout(() => {
    const input = document.getElementById('__settingsRoleInput');
    const timezoneInput = document.getElementById('__settingsTimezoneInput');
    const closeBtn = document.getElementById('__settingsClose');
    const cancelBtn = document.getElementById('__settingsCancel');
    const saveBtn = document.getElementById('__settingsSave');
    const resetBtn = document.getElementById('__settingsResetApp');
    const close = () => { showSettings = false; render(); };
    if (closeBtn) closeBtn.onclick = close;
    if (cancelBtn) cancelBtn.onclick = close;
    if (saveBtn) saveBtn.onclick = () => {
      const next = (input && input.value || '').trim();
      const timezone = parseTimezoneShift(timezoneInput && timezoneInput.value);
      if (!timezone.ok) {
        showToast('시차 형식이 맞지 않아요. 예: +0h, -13h, +1:30h');
        return;
      }
      state.role = next;
      state.timezoneOffsetText = timezone.text;
      state.timezoneOffsetMinutes = timezone.offsetMinutes;
      state.currentDay = computeCurrentDay();
      saveState();
      showSettings = false;
      showToast('내 정보를 업데이트했어요.');
      render();
    };
    if (resetBtn) resetBtn.onclick = () => window.__resetForSignup();
    modal.querySelectorAll('.role-chip').forEach((chip) => {
      chip.onclick = () => {
        const r = chip.getAttribute('data-role') || '';
        if (input) input.value = r;
        state.role = r;
        saveState();
        render();
      };
    });
    if (input) input.focus();
  }, 0);
  return backdrop;
}

function MemberCardModal(memberRef) {
  const member = memberCardData(memberRef);
  if (!member) return document.createDocumentFragment();
  const backdrop = el('div', {
    class: 'modal-backdrop',
    onClick: (e) => {
      if (e.target === backdrop) {
        activeMemberCard = null;
        render();
      }
    }
  });
  const modal = el('div', {
    class: 'modal',
    style: {
      width: 'min(92vw, 420px)',
      padding: '22px 20px 20px',
      borderRadius: '28px',
      background: member.me ? 'linear-gradient(180deg, #FFF7EF 0%, #FFFDF7 100%)' : '#FFFDF7',
      border: member.me ? '1px solid rgba(240,125,56,0.26)' : '1px solid var(--line)',
    }
  });
  modal.innerHTML = `
    <div style="display:flex;align-items:flex-start;gap:14px;">
      <div class="avatar ${member.color}" style="width:62px;height:62px;border-radius:18px;font-size:22px;">${member.name.slice(0,1)}</div>
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <div style="font-size:24px;font-weight:800;letter-spacing:-0.03em;line-height:1.08;">${escapeHtml(member.name)}</div>
          ${premiumPill(member)}
          ${member.me ? '<span class="badge badge-orange">ME</span>' : ''}
        </div>
        <div style="margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          ${member.role ? `<span class="badge">${escapeHtml(member.role)}</span>` : ''}
          <span class="t-small mono" style="color:var(--muted);">Team ${member.team}</span>
          ${member.timezoneText ? `<span class="t-small mono" style="color:var(--muted);">${escapeHtml(member.timezoneText)}</span>` : ''}
          <span class="t-small mono" style="color:var(--muted);">${member.progress}/20</span>
          <span class="t-small mono" style="color:var(--orange);display:inline-flex;align-items:center;gap:4px;">${Icon('flame', 11)} ${member.streak}d</span>
        </div>
      </div>
      <button class="icon-btn" style="width:40px;height:40px;border-radius:14px;" onclick="window.__closeMemberCard()">${Icon('close', 16)}</button>
    </div>
  `;

  // Goal / phrase cards — only show when we actually have data. Keep the card honest.
  const hasGoal = !!(member.goal && member.goal.trim());
  const hasPhrase = !!(member.phrase && member.phrase.trim());
  if (hasGoal || hasPhrase) {
    const stats = el('div', {
      style: {
        display: 'grid',
        gridTemplateColumns: (hasGoal && hasPhrase) ? 'repeat(2, minmax(0, 1fr))' : '1fr',
        gap: '10px',
        marginTop: '16px',
      }
    });
    let statsHtml = '';
    if (hasGoal) {
      statsHtml += `
        <div style="padding:14px;border-radius:18px;background:var(--paper);">
          <div class="kicker" style="color:var(--muted);">${member.me ? '내 챌린지 목표' : '이번 목표'}</div>
          <div style="margin-top:8px;font-size:15px;line-height:1.45;font-weight:700;color:var(--ink);word-break:keep-all;">${escapeHtml(member.goal)}</div>
        </div>`;
    }
    if (hasPhrase) {
      statsHtml += `
        <div style="padding:14px;border-radius:18px;background:var(--paper);">
          <div class="kicker" style="color:var(--muted);">요즘 붙잡는 표현</div>
          <div style="margin-top:8px;font-size:22px;line-height:1.05;color:var(--orange);font-weight:700;letter-spacing:-0.03em;">${escapeHtml(member.phrase)}</div>
          <div class="t-small" style="margin-top:6px;color:var(--ink-soft);">최근 저장한 표현</div>
        </div>`;
    }
    stats.innerHTML = statsHtml;
    modal.appendChild(stats);
  } else if (!member.me) {
    const note = el('div', {
      style: {
        marginTop: '16px',
        padding: '14px 16px',
        borderRadius: '18px',
        background: 'var(--paper)',
        color: 'var(--ink-soft)',
        fontSize: '13px',
        lineHeight: '1.55',
      }
    });
    note.textContent = '아직 프로필을 꾸미지 않은 동료예요. 같이 달리는 루틴에서 소리 없이 페이스를 맞춰주고 있어요.';
    modal.appendChild(note);
  }

  const footer = el('div', { style: { display: 'flex', gap: '8px', marginTop: '14px', flexWrap: 'wrap' } });
  const progressChip = `<span class="badge" style="padding:7px 11px;">${member.progress > 0 ? `Day ${member.progress} 진행 중` : '시작 전'}</span>`;
  const streakChip = member.streak > 0
    ? `<span class="badge" style="padding:7px 11px;">🔥 ${member.streak}일 연속</span>`
    : '';
  const teamChip = `<span class="badge" style="padding:7px 11px;">같이 달리는 동료</span>`;
  footer.innerHTML = `${progressChip}${streakChip}${teamChip}`;
  modal.appendChild(footer);
  backdrop.appendChild(modal);
  return backdrop;
}

/* ============================================================
   SCRIPTS PAGE — 내 대본 모음
   Aggregates all sentences I've written across days. Supports copy-to-Notion markdown.
   ============================================================ */
function ScriptsPage() {
  const page = el('div', { class: 'page', style: { paddingBottom: '120px' } });
  const head = el('div', { class: 'topbar' });
  const back = el('button', { class: 'icon-btn', onClick: () => go('profile') });
  back.innerHTML = Icon('arrowLeft', 16);
  head.appendChild(back);
  head.appendChild(el('div', { class: 'brand-name' }, '내 대본 모음'));
  const exportBtn = el('button', {
    class: 'icon-btn',
    title: 'Notion으로 내보내기',
    onClick: () => __exportScriptsAsMarkdown(),

function __collectScriptsMarkdown(onlyDay) {
  const lines = [];
  lines.push(`# 비즈니스 영어 챌린지 ${CHALLENGE.cohort} — 내 대본`);
  lines.push('');
  lines.push(`- 이름: ${state.name || '-'}`);
  if (state.role) lines.push(`- 직무: ${state.role}`);
  if (state.goal) lines.push(`- 목표: ${state.goal}`);
  lines.push(`- 기간: ${CHALLENGE.start_date} ~ ${CHALLENGE.end_date}`);
  lines.push('');
  CHALLENGE.weeks.forEach((w) => {
    w.days.forEach((dy) => {
      if (onlyDay && dy.day !== onlyDay) return;
      const rows = [];
      dy.words.forEach((word, i) => {
        const key = `d${dy.day}-${i}`;
        const s = state.sentences[key];
        if (!s || !s.trim()) return;
        const ai = state.ai_feedback?.[key];
        rows.push({
          word,
          sentence: s.trim(),
          corrected: ai?.corrected || '',
          note: (state.sentence_notes?.[key] || '').trim(),
        });
      });
      if (!rows.length) return;
      const dateStr = formatDateShortKR(dayDate(dy.day));
      lines.push(`## Day ${dy.day} · ${dy.title} (${dateStr})`);
      lines.push('');
      rows.forEach((r) => {
        lines.push(`- **${r.word.en}** _(${r.word.def})_`);
        if (r.note) lines.push(`  - 내 한국어 문장: ${r.note}`);
        lines.push(`  - 내 영어 문장: ${r.sentence}`);
        if (r.corrected && r.corrected !== r.sentence) {
          lines.push(`  - AI 교정: ${r.corrected}`);
        }
      });
      lines.push('');
    });
  });
  return lines.join('\n');
}

async function __exportScriptsAsMarkdown(onlyDay) {
  const md = __collectScriptsMarkdown(onlyDay);
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(md);
      showToast(onlyDay ? `📋 Day ${onlyDay} 복사 완료 — Notion에 바로 붙여넣어봐요` : '📋 전체 복사 완료 — Notion에 바로 붙여넣어봐요');
      return;
    }
  } catch (e) {}
  // Fallback — open in new tab
  const win = window.open('', '_blank');
  if (win) {
    win.document.write('<pre style="white-space:pre-wrap;font-family:monospace;padding:24px;">' + md.replace(/[<>&]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c])) + '</pre>');
    win.document.title = 'Notion Export';
  } else {
    showToast('클립보드 접근이 막혀있어요. 수동 복사해주세요.');
  }
}

/* ============================================================
   VERIFICATION REVIEW MODAL
   ------------------------------------------------------------
   Opens when a user taps "오늘 인증한 내용 다시 보기" on the Day
   page after they've already verified. Pulls together everything
   they submitted today so they can re-read without having to
   un-verify and redo the whole flow:
     · Word quiz score + per-question answers
     · 3 sentences (Korean memo + my English + AI correction)
     · Story hook (if submitted)
     · Button to re-take the word quiz (clears quiz UI cache)

function VerificationReviewModal(dayN) {
  const d = getDay(dayN);
  if (!d) return el('div');
  const backdrop = el('div', {
    class: 'modal-backdrop',
    onClick: (e) => { if (e.target === backdrop) { verificationReviewDay = null; render(); } },
  });
  const modal = el('div', {
    class: 'modal',
    style: {
      width: 'min(92vw, 560px)',
      maxHeight: '88vh',
      overflowY: 'auto',
      padding: '22px 20px 20px',
      borderRadius: '26px',
      background: '#FFFDF7',
      border: '1px solid var(--line)',
    },
  });

  // --- Word quiz state (runtime, not persisted beyond session) ---
  const quizUi = (window.__verifyUi || {})[dayN];
  const quizQuestions = (typeof buildVerifyQuestions === 'function') ? buildVerifyQuestions(dayN) : [];
  const quizDone = !!(quizUi && quizUi.done);
  const quizScore = quizUi ? (quizUi.score || 0) : 0;
  const quizTotal = quizQuestions.length || (d.words ? d.words.length : 3);

  // --- Sentences ---
  const sentenceRows = (d.words || []).map((w, i) => {
    const key = `d${dayN}-${i}`;
    const korean = (state.sentence_notes && state.sentence_notes[key]) || '';
    const mine = (state.sentences && state.sentences[key]) || '';
    const corrected = (state.ai_feedback && state.ai_feedback[key] && state.ai_feedback[key].corrected) || '';
    const why = (state.ai_feedback && state.ai_feedback[key] && state.ai_feedback[key].why) || '';
    const submitted = !!(state.submitted && state.submitted[key]);
    return { i, word: w.en, def: w.def || '', korean, mine, corrected, why, submitted };
  });

  // --- Story hook ---
  const storyKey = `d${dayN}-story`;
  const storyText = (state.sentences && state.sentences[storyKey]) || '';
  const storyCorrected = (state.ai_feedback && state.ai_feedback[storyKey] && state.ai_feedback[storyKey].corrected) || '';
  const storyWhy = (state.ai_feedback && state.ai_feedback[storyKey] && state.ai_feedback[storyKey].why) || '';

  const storyHtml = (storyText || storyCorrected) ? `

window.__setVerifyQuizValue = (dayN, value) => {

  window.__verifyUi = window.__verifyUi || {};
  window.__verifyUi[dayN] = window.__verifyUi[dayN] || { idx: 0, value: '', done: false, score: 0 };
  const ui = window.__verifyUi[dayN];
  ui.value = value;
  const current = questions[ui.idx];
  clearTimeout(window.__verifyAutoAdvanceTimers[dayN]);
  if (current && normalizeQuizAnswer(value) === normalizeQuizAnswer(current.en)) {
    window.__verifyAutoAdvanceTimers[dayN] = setTimeout(() => {
      const liveUi = (window.__verifyUi || {})[dayN];
      const liveCurrent = questions[liveUi?.idx];
      if (liveCurrent && normalizeQuizAnswer(liveUi.value) === normalizeQuizAnswer(liveCurrent.en)) {
        // Blur active input so the typing-focus guard doesn't defer the render —
        // the stale value was visually persisting because render() was deferred.
        try { document.activeElement && document.activeElement.blur(); } catch (e) {}
        window.__flashCorrect();
        // Give the green flash ~350ms of visible time before the DOM swaps in the next question.
        setTimeout(() => { window.__advanceVerifyQuiz(dayN, false); }, 350);
      }
    }, 180);
  }

window.__advanceVerifyQuiz = (dayN, skipped) => {
  const questions = buildVerifyQuestions(dayN);
  window.__verifyUi = window.__verifyUi || {};
  const ui = window.__verifyUi[dayN] || { idx: 0, value: '', done: false, score: 0, activeStep: 'capture', reveal: false };
  const current = questions[ui.idx];
  const answer = normalizeQuizAnswer(ui.value || '');
  const correct = skipped ? false : answer === normalizeQuizAnswer(current.en);
  ui.score = (ui.score || 0) + (correct ? 1 : 0);
  if (ui.idx >= questions.length - 1) {
    ui.done = true;
    ui.value = '';
  } else {
    ui.idx += 1;
    ui.value = '';
  }
  ui.reveal = false;
  ui.activeStep = 'capture';
  window.__verifyUi[dayN] = ui;
  render();
};

/* Female English voice picker — prefers well-known female voices, falls back gracefully */
function pickFemaleEnVoice() {
  try {
    const voices = window.speechSynthesis.getVoices() || [];
    if (!voices.length) return null;
    const preferredNames = [
      'Samantha', 'Ava', 'Allison', 'Susan', 'Karen', 'Moira', 'Tessa', 'Fiona',
      'Google US English', 'Google UK English Female',
      'Microsoft Aria', 'Microsoft Jenny', 'Microsoft Zira', 'Microsoft Emma', 'Microsoft Michelle',
    ];
    for (const n of preferredNames) {
      const v = voices.find((vo) => vo.name && vo.name.toLowerCase().includes(n.toLowerCase()));
      if (v) return v;
    }
    const femaleEn = voices.find((v) => /en/i.test(v.lang) && /female/i.test(v.name));
    if (femaleEn) return femaleEn;
    const anyEn = voices.find((v) => /^en/i.test(v.lang));
    return anyEn || null;
  } catch (e) { return null; }
}

function download(filename, content, mime='text/plain') {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 100);
}

/* confetti */
function fireConfetti() {
  const layer = el('div', { class: 'celebration' });
  const emojis = ['🎉', '✨', '🧡', '📘', '🎊'];
  for (let i = 0; i < 28; i++) {
    const s = document.createElement('span');
    s.textContent = emojis[i % emojis.length];
    s.style.left = (Math.random() * 100) + '%';
    s.style.setProperty('--x', (Math.random() * 200 - 100) + 'px');
    s.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
    s.style.animationDelay = (Math.random() * 400) + 'ms';
    layer.appendChild(s);
  }
  document.body.appendChild(layer);
  clearTimeout(confettiTimer);
  confettiTimer = setTimeout(() => layer.remove(), 3200);
}

/* ============================================================
   BOOT
   ============================================================ */
// 0) ?reset=1 URL param — wipes local cache for a clean re-onboarding.
//    Use this to reset a specific device (e.g., 유버디/이규태 test accounts).
try {
  if (typeof location !== 'undefined' && /[?&]reset=1\b/.test(location.search || '')) {
    try { localStorage.removeItem(LS_KEY); } catch (_) {}
    try { localStorage.removeItem('demoMode'); } catch (_) {}
    // Strip the query so refreshes don't keep wiping.
    try {
      const cleanUrl = location.pathname + (location.hash || '');
      history.replaceState({}, '', cleanUrl);
    } catch (_) {}
  }
} catch (_) {}

// 1) Hydrate state from localStorage (restores onboarded flag + user identity)
//    so returning users skip onboarding and see their real identity.
if (!__DEMO_MODE__) {
  try {
    const cached = loadCachedState();
    if (cached) mergePersistedState(cached);
  } catch (e) { console.warn('hydrate state failed', e); }
}

// 2) Bind the logged-in user to the right MEMBERS row (or keep placeholder renamed).
try { bindMeToMembers(); } catch (e) { console.warn('bindMeToMembers failed', e); }
try { setupSwipeNavigation(); } catch (e) { console.warn('setupSwipeNavigation failed', e); }
try { setupScrollMemory(); } catch (e) { console.warn('setupScrollMemory failed', e); }

// 3) Sync currentDay to today's calendar (skip in demo mode so seed stays visible)
if (!__DEMO_MODE__) {
  try {
    const realDay = computeCurrentDay();
    if (realDay && realDay !== state.currentDay) {
      state.currentDay = realDay;
    }
  } catch (e) { console.warn('computeCurrentDay failed', e); }
}

// 4) Async remote hydrate (Supabase) — overrides localStorage if fresher,
//    then re-binds + re-renders.
if (!__DEMO_MODE__ && hasSupabase()) {
  (async () => {
    try {
      const remote = await loadRemoteState();
      if (remote && typeof remote === 'object') {
        mergePersistedState(remote);
        bindMeToMembers();
        await loadMemberSummaries({ force: true });
        await loadCommunityPosts(state.communityDay || state.currentDay, { force: true });
        render();
      }
    } catch (e) { console.warn('loadRemoteState failed', e); }
  })();
}

if (hasSupabase()) {
  refreshDashboardStats();
  setInterval(refreshDashboardStats, 60 * 60 * 1000);
  setInterval(() => {
    if (!document.hidden) refreshRemoteStateAndCommunity();
  }, COMMUNITY_REFRESH_MS);
}
window.addEventListener('focus', () => {
  if (hasSupabase() && !document.hidden) refreshRemoteStateAndCommunity({ force: true });
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && hasSupabase()) refreshRemoteStateAndCommunity({ force: true });
});
render();
if (currentPage === 'weeks' || currentPage === 'day') {
  restoreCurrentScroll();
}
</script>
